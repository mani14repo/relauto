[project]
name = "sre-agent"
version = "0.1.0"
description = "Site Reliability Assessment Bot: template-driven reliability assessments with a local LLM."
requires-python = ">=3.13"
dependencies = [
    "lxml>=5",
    "python-docx>=1.1",
    "pyyaml>=6",
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "aiokafka>=0.11",
]

[project.optional-dependencies]
retrieval = ["fastembed>=0.4", "pgvector>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
sra = "sra.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
