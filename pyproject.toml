[project]
name = "sre-agent"
version = "0.1.0"
description = "Site Reliability Assessment Bot: template-driven reliability assessments with a local LLM."
requires-python = ">=3.13"
dependencies = [
    "lxml>=5",
    "python-docx>=1.1",
    "pyyaml>=6",
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "aiokafka>=0.11",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pypdf>=5",
    "rapidocr-onnxruntime>=1.3",
    "opencv-python-headless>=4.8",
    "anthropic>=1",
]

[project.optional-dependencies]
retrieval = ["fastembed>=0.4", "pgvector>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
sra = "sra.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
# rapidocr-onnxruntime asks for opencv-python, which needs libGL (absent from the distroless image)
# use the headless build, which is the same library without the GUI parts.
override-dependencies = ["opencv-python; sys_platform == 'never'", "opencv-python-headless>=4.8"]
