id: CMDB-AT-13
title: CMDB/CSDM Readiness Scorecard & Reporting Gates
domain: CMDB
variant: C
priority: P1
applicability: Each in-scope Business Application, rolled up by sub-portfolio, region and FSI REO. • Scope definition• CRI
  computation• Maturity assignment• Gate decisions• Publication
accountable_owner: CMDB Process Owner with OIP Product Owner
purpose: Combine the results of CMDB-AT-01 to AT-12 into one CMDB Readiness Index (CRI) and maturity level per application,
  and decide which executive metrics may be reported as authoritative for which applications (Reporting Gates A–D). This prevents
  unsupported calculations — the Nov 5 leadership direction.
relevance: 'Leadership asked for credible baselines that improve iteratively; gates make the limits explicit per metric. MG
  asked for scope reconciliation; C01 forces a single, approved scope list. Baseline reference (re-measure at assessment time):'
reassessment_trigger: Monthly (published in REO governance pack)
scope:
- • Scope definition• CRI computation• Maturity assignment• Gate decisions• Publication
- —
signoff_roles:
- Assessment Lead
- Data Steward (portfolio)
- SRE Region Lead
- Business Application Owner / Engineering Owner
- CMDB Process Owner
