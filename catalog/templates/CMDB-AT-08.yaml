id: CMDB-AT-08
title: CMDB-Driven Change Impact Analysis Assessment
domain: CMDB
variant: C
priority: P1
applicability: Changes affecting FSI REO services in a 90-day window; reported per Application Service and per change type.
  • Affected CI and Impacted Services population• Impact assessment quality for infrastructure changes• caused_by linkage•
  Post-change CMDB updates• Conflict detection
accountable_owner: Change Manager with CMDB Process Owner
purpose: Determine whether change records use CMDB data — Affected CIs, Impacted Services, dependency maps — to assess impact,
  and whether change-caused incidents are traced back to the change so that learning happens.
relevance: '0% change-to-incident linkage across 52 change records (V1). 100% manual deployments — CMDB is the only systematic
  source of impact information. Nov 5: change-window overrun KPI removed; impact accuracy and change-caused incidents are
  the meaningful change outcomes.'
reassessment_trigger: Monthly measurement; quarterly assessment
scope:
- • Affected CI and Impacted Services population• Impact assessment quality for infrastructure changes• caused_by linkage•
  Post-change CMDB updates• Conflict detection
- • Freeze calendar and standard change catalogue (moved to ITSM-AT-01)
signoff_roles:
- Assessment Lead
- Data Steward (portfolio)
- SRE Region Lead
- Business Application Owner / Engineering Owner
- CMDB Process Owner
criteria:
- id: CMDB-AT-08-C01
  number: 1
  name: Affected CI populated
  standard_ref: CMDB-STD-09 R01
  applicability: Normal and Emergency changes
  required_evidence: cmdb_ci and ≥ 1 task_ci row with a specific CI (not generic)
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: 100% (TH-05)
  default_risk: Critical
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-09
  - CMDB-PB-06
  rubric_refs:
  - P1-07
  rubric_enablers: []
  csdm_layer: Service Delivery → ITSM
  data_source: change_request; task_ci
  formula: Compliant changes ÷ changes
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Affected CI = Business Application instead of Production Application Service
  risk_if_gap: Critical
  playbooks:
  - CMDB-PB-06
- id: CMDB-AT-08-C02
  number: 2
  name: Impacted Services calculated from CMDB
  standard_ref: CMDB-STD-09 R02–R03
  applicability: Changes touching CIs used by Tier 1/2 services
  required_evidence: task_cmdb_ci_service rows generated by 'Refresh Impacted Services' (or equivalent) before approval
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: ≥ TH-06 (95/90%)
  default_risk: High
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-09
  - CMDB-PB-07
  rubric_refs:
  - P1-07
  rubric_enablers: []
  csdm_layer: Service Delivery
  data_source: task_cmdb_ci_service; sys_audit
  formula: Changes with populated Impacted Services before approval ÷ in-scope changes
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Impacted Services typed manually after CAB
  risk_if_gap: High
  playbooks:
  - CMDB-PB-07
- id: CMDB-AT-08-C03
  number: 3
  name: Infrastructure impact assessment quality
  standard_ref: CMDB-STD-09 R04–R06
  applicability: Infrastructure changes on shared platforms
  required_evidence: Impact list matches dependency map; Full-outage/Degraded impacts signed off by service owners; rollback
    impact stated
  evaluation_method: Human review (AI-assisted pre-check)
  methods:
  - human
  - ai
  acceptance_criteria: ≥ 90%
  default_risk: High
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-09
  - CMDB-PB-07
  rubric_refs:
  - P1-07
  rubric_enablers: []
  csdm_layer: Service Delivery
  data_source: change_request attachments; cmdb_rel_ci
  formula: Sampled infra changes meeting all conditions ÷ sample (10 per quarter)
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • 'No impact expected' with no justification on shared cluster changes
  risk_if_gap: High
  playbooks:
  - CMDB-PB-07
- id: CMDB-AT-08-C04
  number: 4
  name: Change-caused incident linkage
  standard_ref: CMDB-STD-08 R05; CMDB-STD-09 R07
  applicability: Incidents opened ≤ 72 h after change completion on the same CI or Application Service
  required_evidence: caused_by populated where causal, or a work note recording 'reviewed — not change-related'
  evaluation_method: Deterministic correlation + Human confirmation
  methods:
  - deterministic
  acceptance_criteria: 100% reviewed; ≥ 50% of correlated incidents dispositioned within 90 days of adoption, 100% at steady
    state
  default_risk: Critical
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-08
  - CMDB-STD-09
  - CMDB-PB-06
  - CMDB-PB-07
  rubric_refs:
  - P2-08
  rubric_enablers: []
  csdm_layer: ITSM
  data_source: incident; change_request; task_ci
  formula: Correlated incidents reviewed ÷ correlated incidents; Linkage rate = caused_by populated ÷ confirmed change-caused
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Correlation impossible because incident CI is generic (fix C06 of AT-01 first)
  risk_if_gap: Critical
  playbooks:
  - CMDB-PB-06
  - CMDB-PB-07
- id: CMDB-AT-08-C05
  number: 5
  name: Post-change CMDB update
  standard_ref: CMDB-STD-09 R08
  applicability: Topology-changing changes
  required_evidence: Discovery triggered or manual update completed and confirmed at closure within TH-14
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: 100% within TH-14
  default_risk: High
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-09
  - CMDB-PB-07
  rubric_refs:
  - P2-10
  rubric_enablers: []
  csdm_layer: Foundation
  data_source: change_request closure; sys_audit
  formula: Compliant changes ÷ topology-changing changes
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • New integration deployed, dependency never added
  risk_if_gap: High
  playbooks:
  - CMDB-PB-07
- id: CMDB-AT-08-C06
  number: 6
  name: Conflict detection uses CMDB
  standard_ref: CMDB-STD-09 R09
  applicability: Normal changes
  required_evidence: Conflict detection run; overlapping changes on related CIs/services flagged before approval
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: 100%
  default_risk: Medium
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-09
  - CMDB-PB-07
  rubric_refs: []
  rubric_enablers: []
  csdm_layer: Service Delivery
  data_source: conflict table / change conflict status
  formula: Changes with conflict check executed ÷ normal changes
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Conflict detection limited to the exact CI, ignoring services
  risk_if_gap: Medium
  playbooks:
  - CMDB-PB-07
