id: CMDB-AT-03
title: Asset & CI Lifecycle Management Assessment
domain: CMDB
variant: C
priority: P2
applicability: CI classes supporting FSI REO Production Application Services; sampled per class. • Life cycle and operational
  status accuracy• Transition governance (change linkage)• Asset ↔ CI linkage for hardware• Decommission completeness including
  telemetry mappings
accountable_owner: CMDB Process Owner / Platform Engineering
purpose: Determine whether CI life cycle states reflect reality so that retired components drop out of impact analysis and
  attribution, new components enter governance before go-live, and decommissions leave no residue in CMDB or monitoring.
relevance: Jenkins decommission (28/35 apps not migrated) shows life cycle state is not tracked as a control. Retired CIs
  left in service maps and telemetry mappings produce false impact and orphan telemetry.
reassessment_trigger: Semi-annually; after decommission programs
scope:
- • Life cycle and operational status accuracy• Transition governance (change linkage)• Asset ↔ CI linkage for hardware• Decommission
  completeness including telemetry mappings
- • EOL register and technical debt (CMDB-AT-09)
signoff_roles:
- Assessment Lead
- Data Steward (portfolio)
- SRE Region Lead
- Business Application Owner / Engineering Owner
- CMDB Process Owner
criteria:
- id: CMDB-AT-03-C01
  number: 1
  name: Life cycle state accuracy
  standard_ref: CMDB-STD-07 R06–R08
  applicability: Sample of 30 CIs per class supporting Tier 1/2 services
  required_evidence: State compared with discovery recency, monitoring activity and owner confirmation
  evaluation_method: Deterministic + Human confirmation for mismatches
  methods:
  - deterministic
  acceptance_criteria: ≥ 95% accurate; 0 Retired CIs on open records
  default_risk: Medium
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-07
  - CMDB-PB-04
  rubric_refs:
  - P2-10
  rubric_enablers: []
  csdm_layer: Foundation
  data_source: cmdb_ci; last_discovered; telemetry activity
  formula: Accuracy = sampled CIs whose state matches observed reality ÷ sample; plus count of Retired CIs referenced by open
    incidents/changes
  maturity_bands: L0 < 70%  |  L1 70–84%  |  L2 85–94%  |  L3 ≥ 95%  |  L4 ≥ 95% with automated state alignment
  look_for: • Installed CIs silent in discovery and telemetry for 90 days• Retired Application Services still receiving incidents
  risk_if_gap: Medium
  playbooks:
  - CMDB-PB-04
- id: CMDB-AT-03-C02
  number: 2
  name: Life cycle transition governance
  standard_ref: CMDB-STD-07 R09
  applicability: Transitions to In Maintenance, Retiring and Retired in last 180 days
  required_evidence: Linked change record for each transition; transition recorded ≤ 5 business days after change closure
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: ≥ 95% for Tier 1/2 hosting CIs and all Application Services
  default_risk: Medium
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-07
  - CMDB-PB-04
  rubric_refs: []
  rubric_enablers:
  - P1-07
  csdm_layer: Foundation
  data_source: sys_audit; change_request; task_ci
  formula: Governed transitions ÷ transitions
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Bulk retirements by script with no change• Change closed but CI still Installed months later
  risk_if_gap: Medium
  playbooks:
  - CMDB-PB-04
- id: CMDB-AT-03-C03
  number: 3
  name: Hosting CI linked to Application Service
  standard_ref: CMDB-STD-03 R10
  applicability: Production servers, VMs, DB instances, app servers, Kubernetes namespaces/workloads
  required_evidence: Membership in ≥ 1 Production Application Service (svc_ci_assoc or relationship)
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: ≥ 90% (≥ 98% for CIs serving Tier 1)
  default_risk: Medium
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-03
  - CMDB-PB-03
  rubric_refs:
  - P2-01
  rubric_enablers: []
  csdm_layer: Service Delivery
  data_source: svc_ci_assoc; cmdb_rel_ci
  formula: Linked production hosting CIs ÷ production hosting CIs
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Shared DB servers linked to one application only• Namespaces with no Application Service
  risk_if_gap: Medium — unlinked infrastructure is invisible to impact analysis
  playbooks:
  - CMDB-PB-03
- id: CMDB-AT-03-C04
  number: 4
  name: Asset-to-CI linkage (hardware)
  standard_ref: CMDB-STD-07 R10
  applicability: Physical hardware supporting Tier 1/2 (N/A for cloud-only services)
  required_evidence: alm_hardware record with ci reference and vice versa
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: ≥ 95%; N/A with justification if HAM not in use
  default_risk: Low
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-07
  - CMDB-PB-04
  rubric_refs: []
  rubric_enablers: []
  csdm_layer: Foundation
  data_source: alm_hardware; cmdb_ci_hardware
  formula: Hardware CIs with linked asset ÷ hardware CIs
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Assets disposed while CI remains Installed
  risk_if_gap: Low
  playbooks:
  - CMDB-PB-04
- id: CMDB-AT-03-C05
  number: 5
  name: Decommission completeness
  standard_ref: CMDB-STD-07 R11–R13
  applicability: Decommissions completed in last 180 days
  required_evidence: Change record; data sanitization evidence (hardware); relationships removed; CI set Retired ≤ 5 business
    days; telemetry mappings and alert rules retired; OIP maps updated
  evaluation_method: Deterministic + Human review of evidence
  methods:
  - deterministic
  - human
  acceptance_criteria: 100% for Tier 1/2-related CIs
  default_risk: Medium
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-07
  - CMDB-PB-04
  rubric_refs: []
  rubric_enablers: []
  csdm_layer: Foundation → Observability
  data_source: change_request; cmdb_rel_ci; OIP config maps; em_alert rules
  formula: Decommissions meeting all six conditions ÷ decommissions
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Alerts still firing against retired CIs and creating incidents• Telemetry mapping still pointing at retired
    service
  risk_if_gap: Medium
  playbooks:
  - CMDB-PB-04
- id: CMDB-AT-03-C06
  number: 6
  name: Software normalization for EOL (conditional)
  standard_ref: CMDB-STD-07 R14
  applicability: Software platforms supporting Tier 1/2 (N/A if SAM not licensed — document)
  required_evidence: Software installs normalized to product models with vendor life cycle dates
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: ≥ 90% or documented N/A
  default_risk: Low
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-07
  - CMDB-PB-04
  rubric_refs: []
  rubric_enablers: []
  csdm_layer: Foundation
  data_source: cmdb_sam_sw_install / cmdb_software_product_model [CONFIRM]
  formula: Normalized installs ÷ installs on Tier 1/2 hosting CIs
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Jenkins and middleware versions not normalized — EOL cannot be computed
  risk_if_gap: Low
  playbooks:
  - CMDB-PB-04
