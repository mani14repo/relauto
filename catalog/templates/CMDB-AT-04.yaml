id: CMDB-AT-04
title: CMDB Data Quality Governance Assessment
domain: CMDB
variant: C
priority: P1
applicability: FSI REO CMDB footprint (all in-scope BAs, Application Services and hosting CIs), measured per sub-portfolio.
  • CMDB Health configuration and baseline• Completeness, correctness, compliance• Governance roles, remediation workflow,
  reporting
accountable_owner: CMDB Process Owner
purpose: Determine whether CMDB data quality is measured against agreed thresholds, owned by named stewards, remediated through
  a tracked workflow with SLAs, and reported to REO governance so that improvement is visible and sustained.
relevance: 'Data quality was confirmed by REO leadership (Nov 5) as the highest priority. V1 thresholds conflicted (80%, 90%,
  95%, 100%); V2 uses one threshold table (CMDB-STD-00 TH-01…TH-14). OIP/COG already computes INC-APP / INC-CI / INC-APP-IDENTIFIED
  — this assessment makes those measures governed. Baseline reference (re-measure at assessment time):'
reassessment_trigger: Monthly measurement; quarterly governance review
scope:
- • CMDB Health configuration and baseline• Completeness, correctness, compliance• Governance roles, remediation workflow,
  reporting
- • Attestation mechanics (CMDB-AT-11)
signoff_roles:
- Assessment Lead
- Data Steward (portfolio)
- SRE Region Lead
- Business Application Owner / Engineering Owner
- CMDB Process Owner
criteria:
- id: CMDB-AT-04-C01
  number: 1
  name: CMDB Health configured and baselined for FSI scope
  standard_ref: CMDB-STD-05 R01–R03
  applicability: FSI REO footprint
  required_evidence: CMDB Health KPIs enabled for FSI classes; required/recommended fields configured exactly as CMDB-STD-00;
    baseline recorded with date and scope filter
  evaluation_method: Deterministic + Human review
  methods:
  - deterministic
  - human
  acceptance_criteria: 100% configured; dated baseline exists for completeness, correctness, compliance
  default_risk: Critical
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-05
  - CMDB-PB-02
  rubric_refs: []
  rubric_enablers: []
  csdm_layer: Foundation
  data_source: CMDB Health configuration; baseline record
  formula: Classes with Health KPIs configured per STD-00 ÷ classes in scope
  maturity_bands: L0 none  |  L1 OOB defaults  |  L2 configured, no baseline  |  L3 configured + baseline  |  L4 L3 + monthly
    trend
  look_for: • OOB required fields that do not match FSI needs (e.g., Subcategory-like fields that are not mandatory in FSI
    process)• Health measured instance-wide, not filtered to FSI
  risk_if_gap: Critical — without a baseline improvement cannot be shown
  playbooks:
  - CMDB-PB-02
- id: CMDB-AT-04-C02
  number: 2
  name: Required-attribute completeness by tier
  standard_ref: CMDB-STD-05 R04–R05
  applicability: BAs, Production Application Services, hosting CIs
  required_evidence: Field-level completeness per STD-00 dictionary
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: ≥ TH-01 (95/90/85%) per tier; ownership fields 100% (TH-02)
  default_risk: Critical
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-05
  - CMDB-PB-02
  rubric_refs:
  - P2-10
  rubric_enablers: []
  csdm_layer: Foundation / Service Delivery
  data_source: CMDB Health completeness; direct field queries
  formula: Populated required fields ÷ required fields, computed per tier
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Fields populated with placeholders ('TBD', 'Unknown', '-- None --') — treat as blank• Completeness high only
    because non-FSI classes dilute the measure
  risk_if_gap: Critical
  playbooks:
  - CMDB-PB-02
- id: CMDB-AT-04-C03
  number: 3
  name: 'Correctness: duplicates, orphans, staleness'
  standard_ref: CMDB-STD-05 R06–R08
  applicability: In-scope classes
  required_evidence: Duplicate, orphan and stale counts per class
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: All three within threshold for all classes
  default_risk: High
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-05
  - CMDB-PB-02
  - CMDB-PB-08
  rubric_refs:
  - P2-10
  rubric_enablers: []
  csdm_layer: Foundation
  data_source: CMDB Health correctness
  formula: Pass if duplicate ≤ TH-11, orphan ≤ TH-12, stale ≤ TH-10 for every class; report worst class
  maturity_bands: L0 no measure  |  L1 measured, ≥ 2 breaches  |  L2 one breach  |  L3 none  |  L4 none for 3 months
  look_for: • Orphan Application Services (no BA)• Orphan hosting CIs (no service)
  risk_if_gap: High
  playbooks:
  - CMDB-PB-02
  - CMDB-PB-08
- id: CMDB-AT-04-C04
  number: 4
  name: Governance roles staffed
  standard_ref: CMDB-POL-05 PS-03; CMDB-STD-00 roles
  applicability: FSI REO CMDB program
  required_evidence: Named CMDB Process Owner, Platform Owner, Portfolio Data Stewards (≤ 15 apps each), class managers; RACI
    published
  evaluation_method: Human review
  methods:
  - human
  acceptance_criteria: All roles named; ≤ 15 apps per steward; RACI approved by REO
  default_risk: High
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-POL-05
  - CMDB-STD-00
  - CMDB-PB-11
  rubric_refs:
  - P1-01
  rubric_enablers: []
  csdm_layer: Manage Portfolio
  data_source: Governance charter; group membership
  formula: Roles named ÷ roles required; max apps per steward
  maturity_bands: L0 no roles  |  L1 single person for all apps  |  L2 roles named, overload  |  L3 roles named, load ≤ 15  |  L4
    L3 + backup stewards
  look_for: • Data quality depends on one application manager (V1 baseline)
  risk_if_gap: High
  playbooks:
  - CMDB-PB-11
- id: CMDB-AT-04-C05
  number: 5
  name: Remediation workflow with SLA
  standard_ref: CMDB-STD-05 R09–R11; finding SLAs
  applicability: All data-quality findings
  required_evidence: Each failing rule generates a task/action item with owner and due date per finding SLA; aging report
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: ≥ 90% within SLA; 0 findings without owner
  default_risk: High
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-05
  - CMDB-PB-02
  rubric_refs: []
  rubric_enablers: []
  csdm_layer: Manage Portfolio
  data_source: CMDB remediation tasks; OIP action items
  formula: Findings closed within SLA ÷ findings due in period; open findings without owner
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Tasks auto-closed without data change• Findings reopened by the next OIP run (fix did not stick — check IRE
    precedence)
  risk_if_gap: High
  playbooks:
  - CMDB-PB-02
- id: CMDB-AT-04-C06
  number: 6
  name: Reporting cadence and trend
  standard_ref: CMDB-STD-05 R12
  applicability: REO governance
  required_evidence: Monthly CMDB scorecard (CMDB-AT-13) in REO governance pack; trend per sub-portfolio; decisions recorded
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: 100%; ≥ 2 improvement actions completed per quarter per sub-portfolio
  default_risk: Medium
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-05
  - CMDB-PB-02
  rubric_refs: []
  rubric_enablers: []
  csdm_layer: Manage Portfolio
  data_source: Governance minutes; OIP scorecard
  formula: Months with published scorecard ÷ months in period
  maturity_bands: L0 none  |  L1 ad hoc  |  L2 monthly, no actions  |  L3 monthly + actions  |  L4 L3 + targets met 2 quarters
  look_for: • Scorecard numbers not reconciled with Incident Management reporting (MG concern, Nov 5)
  risk_if_gap: Medium
  playbooks:
  - CMDB-PB-02
