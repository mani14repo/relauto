id: CMDB-AT-12
title: Observability Identity & Telemetry-to-CMDB Mapping Assessment
domain: CMDB
variant: C
priority: P1
applicability: One Production Application Service and every telemetry source that emits data about it. • Telemetry source
  inventory• Canonical identity tuple and mapping store• Environment discrimination• Workload metadata labels• Event/alert
  CI binding• Mapping governance• Retrievability for reliability metrics
accountable_owner: SRE Region Lead with Observability Platform Owners
purpose: Determine whether logs, metrics, traces and alerts from Splunk, Loki/Grafana, AppDynamics and Kubernetes can be attributed
  unambiguously to the correct Production Application Service and environment, so that error rates, MTTR evidence and SLOs
  computed from telemetry are trustworthy.
relevance: 'Nov 5 executive review: services and APIs appear under inconsistent or similar names across environments; production
  vs development is not always distinguishable — cross-platform correlation blocked. OIP Splunk source map has one non-prod
  AKS source (afp-api-int); rebate GCP/GKE services (CPR, CRR, repricing APIs) are unmapped. Splunk/Loki throttling limits
  wide-window retrieval; metrics 4, 5, 6, 8, 9, 10 of the 10-item list depend on this mapping.'
reassessment_trigger: Quarterly for Tier 1; semi-annually Tier 2; on deployment of new workloads or telemetry sources
scope:
- • Telemetry source inventory• Canonical identity tuple and mapping store• Environment discrimination• Workload metadata
  labels• Event/alert CI binding• Mapping governance• Retrievability for reliability metrics
- • Observability coverage quality (SRE-AT-03)
signoff_roles:
- Assessment Lead
- Data Steward (portfolio)
- SRE Region Lead
- Business Application Owner / Engineering Owner
- CMDB Process Owner
criteria:
