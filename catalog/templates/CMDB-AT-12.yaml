  required_evidence: Inventory listing every Splunk index/sourcetype, Loki label set, AppD application/tier, Grafana dashboard
    and k8s workload emitting data for the service
  evaluation_method: Deterministic sweep + Human confirmation
  methods:
  - deterministic
  acceptance_criteria: 100% Tier 1; ≥ 90% Tier 2
