id: CMDB-AT-07
title: Cloud & Container Infrastructure Registration Assessment
domain: CMDB
variant: C
priority: P1
applicability: Each cloud account/project/subscription and Kubernetes cluster hosting FSI workloads; rolled up per Application
  Service. • Account/project/subscription coverage• Kubernetes clusters, namespaces, workloads• Labels/tags• Ephemeral resource
  retirement• Hybrid consistency• Cost attribution (conditional)
accountable_owner: Cloud / Platform Engineering with CMDB Platform Owner
purpose: Determine whether cloud and container resources that run FSI services are registered, labelled and linked to Application
  Services so that incidents, telemetry and cost can be attributed and ephemeral resources do not accumulate as stale CIs.
relevance: 'Rebate CPR, CRR and repricing APIs run on GCP/GKE; AFP API integration runs on Azure AKS (non-prod). Nov 5 review:
  services appear under similar names across environments — cluster/namespace naming is the main evidence of environment.
  Raised from P2 to P1 because telemetry attribution (Gate C) depends on it.'
reassessment_trigger: Quarterly; on new account, project or cluster
scope:
- • Account/project/subscription coverage• Kubernetes clusters, namespaces, workloads• Labels/tags• Ephemeral resource retirement•
  Hybrid consistency• Cost attribution (conditional)
- • Telemetry-source mapping detail (CMDB-AT-12)
signoff_roles:
- Assessment Lead
- Data Steward (portfolio)
- SRE Region Lead
- Business Application Owner / Engineering Owner
- CMDB Process Owner
criteria:
- id: CMDB-AT-07-C01
  number: 1
  name: Cloud account coverage
  standard_ref: CMDB-STD-06 R02
  applicability: All cloud accounts/projects/subscriptions hosting FSI workloads
  required_evidence: Account registered and discovered (Cloud Discovery or Service Graph Connector) in last 7 days
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: 100%
  default_risk: High
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-06
  - CMDB-PB-08
  rubric_refs:
  - P2-10
  rubric_enablers: []
  csdm_layer: Foundation
  data_source: Cloud account CIs; discovery status
  formula: Discovered accounts ÷ inventory accounts
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Rebate GCP projects not in discovery scope
  risk_if_gap: High
  playbooks:
  - CMDB-PB-08
- id: CMDB-AT-07-C02
  number: 2
  name: Kubernetes cluster, namespace and workload registration
  standard_ref: CMDB-STD-01 R06; CMDB-STD-12 R03
  applicability: Clusters running FSI workloads
  required_evidence: Cluster and namespace CIs exist; each FSI namespace/workload belongs to exactly one Application Service
    with environment
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: 100% clusters; ≥ 95% namespaces (100% for Tier 1)
  default_risk: High
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-01
  - CMDB-STD-12
  - CMDB-PB-10
  rubric_refs:
  - P2-10
  rubric_enablers: []
  csdm_layer: Foundation → Service Delivery
  data_source: Kubernetes classes; svc_ci_assoc
  formula: FSI namespaces mapped to one Application Service ÷ FSI namespaces
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Shared namespaces hosting several applications — require workload-level mapping• Namespaces mapped to a BA directly
    (skipping Application Service)
  risk_if_gap: High
  playbooks:
  - CMDB-PB-10
- id: CMDB-AT-07-C03
  number: 3
  name: Required labels/tags present
  standard_ref: CMDB-STD-12 R04–R05
  applicability: Production workloads and cloud resources
  required_evidence: 'Labels: app service ID, business application ID, environment, owner/support group, cost center (proposed
    keys in CMDB-STD-12); enforced by policy-as-code'
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: ≥ 95% production; admission/policy control enforced for new deployments
  default_risk: High
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-12
  - CMDB-PB-10
  rubric_refs: []
  rubric_enablers: []
  csdm_layer: Foundation
  data_source: Workload manifests; cloud tags
  formula: Resources with all required labels ÷ resources
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Only app.kubernetes.io/name present — no CMDB key• Environment inferred only from cluster name
  risk_if_gap: High
  playbooks:
  - CMDB-PB-10
- id: CMDB-AT-07-C04
  number: 4
  name: Ephemeral resource retirement
  standard_ref: CMDB-STD-07 R08
  applicability: Cloud and Kubernetes classes
  required_evidence: Retire policy retires CIs not seen for 7 days; pods not individually governed
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: ≤ 2%
  default_risk: Medium
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-07
  - CMDB-PB-08
  rubric_refs:
  - P2-10
  rubric_enablers: []
  csdm_layer: Foundation
  data_source: CMDB Data Manager; last_discovered
  formula: Stale cloud CIs (> 7 days unseen, still Installed) ÷ cloud CIs
  maturity_bands: L0 no policy  |  L1 > 20%  |  L2 5–20%  |  L3 2–5%  |  L4 ≤ 2%
  look_for: • Thousands of pod CIs inflating counts
  risk_if_gap: Medium
  playbooks:
  - CMDB-PB-08
- id: CMDB-AT-07-C05
  number: 5
  name: Hybrid consistency
  standard_ref: CMDB-STD-03 R05
  applicability: Applications with on-prem and cloud components
  required_evidence: Both component sets belong to the same BA through Application Services per environment
  evaluation_method: Human review
  methods:
  - human
  acceptance_criteria: 100%
  default_risk: Medium
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-03
  - CMDB-PB-03
  rubric_refs:
  - P2-01
  rubric_enablers: []
  csdm_layer: Service Delivery
  data_source: cmdb_rel_ci; svc_ci_assoc
  formula: Hybrid apps with unified model ÷ hybrid apps
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Separate BAs created for 'cloud version' of same product
  risk_if_gap: Medium
  playbooks:
  - CMDB-PB-03
- id: CMDB-AT-07-C06
  number: 6
  name: Cloud cost attribution (conditional)
  standard_ref: CMDB-STD-12 R05
  applicability: Where FinOps reporting uses CMDB
  required_evidence: Cloud spend attributable to Application Service via tags
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: ≥ 90% or N/A with justification
  default_risk: Low
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-12
  - CMDB-PB-10
  rubric_refs: []
  rubric_enablers: []
  csdm_layer: Manage Portfolio
  data_source: Cloud billing export
  formula: Attributed spend ÷ total FSI spend
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: —
  risk_if_gap: Low
  playbooks:
  - CMDB-PB-10
