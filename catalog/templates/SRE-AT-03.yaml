- id: SRE-AT-03-C05
  number: 5
  name: Executive / Leadership Dashboard Availability
  standard_ref: ITPN G-18, G-19; IO-04 Score 20
  applicability: All FSI REO applications
  required_evidence: Splunk dashboard URL; confirmation that dashboard answers the 5 key exec questions (per G-18)
  evaluation_method: 'Human review: dashboard answers availability, MTTR, error rate, SLO attainment, and incident trends'
  methods:
  - human
  acceptance_criteria: At least one dashboard per application family answering all 5 executive reliability questions
  default_risk: High
  default_risk_assumed: false
  accountable_owner: SRE / PSE
  reassessment: ''
  example_risk: High — 4/5 exec questions unanswerable from live data
  example_recommendation: Build per-family Splunk dashboard; distinguish monitoring-generated vs. human-reported incidents
