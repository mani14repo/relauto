id: CMDB-AT-11
title: CMDB Certification & Audit Assessment
domain: CMDB
variant: C
priority: P2
applicability: FSI REO CMDB footprint per sub-portfolio. • Attestation, data certification, findings, exceptions, sample audit
accountable_owner: CMDB Process Owner
purpose: Determine whether owners attest their records on a tier-based cadence, data certification campaigns run, audit findings
  are closed within SLA, exceptions are controlled, and an independent sample confirms the data is actually correct.
relevance: Certification is the control that stops improved data decaying after the remediation program. Completeness alone
  can be gamed with placeholders; C06 adds an accuracy audit.
reassessment_trigger: Quarterly
scope:
- • Attestation, data certification, findings, exceptions, sample audit
- —
signoff_roles:
- Assessment Lead
- Data Steward (portfolio)
- SRE Region Lead
- Business Application Owner / Engineering Owner
- CMDB Process Owner
