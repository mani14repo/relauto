id: CMDB-AT-09
title: End-of-Life & Technical Debt Registration Assessment
domain: CMDB
variant: C
priority: P2
applicability: Software platforms and infrastructure supporting FSI Application Services. • EOL dates on product models• Exposure
  via CMDB relationships• Plans, risk acceptance, burn-down
accountable_owner: Platform Engineering / Application Engineering
purpose: Determine whether end-of-life and technical debt are recorded against CMDB product models and Application Services
  so that exposure can be computed from the CMDB, remediation is planned, and deferrals are formally risk-accepted.
relevance: 'Jenkins: 28 of 35 apps not migrated past the Oct 2026 deadline (G-17). No EOL or technical-debt register existed
  in V1.'
reassessment_trigger: Quarterly
scope:
- • EOL dates on product models• Exposure via CMDB relationships• Plans, risk acceptance, burn-down
- • Asset finance
signoff_roles:
- Assessment Lead
- Data Steward (portfolio)
- SRE Region Lead
- Business Application Owner / Engineering Owner
- CMDB Process Owner
criteria:
- id: CMDB-AT-09-C01
  number: 1
  name: EOL dates recorded on product models
  standard_ref: CMDB-STD-07 R14
  applicability: Platforms on Tier 1/2 hosting CIs
  required_evidence: Vendor EOL/EOS dates on models
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: ≥ 95%
  default_risk: High
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-07
  - CMDB-PB-04
  rubric_refs: []
  rubric_enablers: []
  csdm_layer: Foundation
  data_source: Product models
  formula: Models with EOL date ÷ models in use
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • EOL tracked in a spreadsheet outside CMDB
  risk_if_gap: High
  playbooks:
  - CMDB-PB-04
- id: CMDB-AT-09-C02
  number: 2
  name: Exposure computed through CMDB
  standard_ref: CMDB-STD-07 R15
  applicability: Past or ≤ 6-month EOL items
  required_evidence: List of affected Application Services and tiers generated from relationships
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: 100%
  default_risk: High
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-07
  - CMDB-PB-04
  rubric_refs: []
  rubric_enablers: []
  csdm_layer: Service Delivery
  data_source: cmdb_rel_ci; svc_ci_assoc
  formula: EOL items with computed service exposure ÷ EOL items
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Jenkins exposure counted by hand
  risk_if_gap: High
  playbooks:
  - CMDB-PB-04
- id: CMDB-AT-09-C03
  number: 3
  name: Remediation plan quality
  standard_ref: CMDB-STD-07 R16
  applicability: Past or ≤ 6-month EOL items
  required_evidence: 'Per-application plan: target date, path, test, rollback, owner'
  evaluation_method: Human review
  methods:
  - human
  acceptance_criteria: 100%
  default_risk: Critical
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
