id: CMDB-AT-10
title: Service Criticality & Operational Risk Assessment
domain: CMDB
variant: C
priority: P1
applicability: One Business Application and its Production Application Services. • Tier designation, BIA, RTO/RPO, consistency,
  dependency inheritance
accountable_owner: CMDB Process Owner / SRE Region Lead
purpose: Determine whether each service has an approved tier with documented business impact and recovery objectives, and
  whether the tier consistently drives incident priority, change risk, SRE engagement, data-quality thresholds and attestation
  frequency.
relevance: V1 used two tier vocabularies and two priority mappings; V2 harmonizes to the CMDB-STD-00 tier table (OD-2). Tier
  drives which thresholds apply in every other CMDB assessment.
reassessment_trigger: Annually; after business change or tier-mismatch incident
scope:
- • Tier designation, BIA, RTO/RPO, consistency, dependency inheritance
- • DR testing (SRE-AT / SRE-PB-10)
signoff_roles:
- Assessment Lead
- Data Steward (portfolio)
- SRE Region Lead
- Business Application Owner / Engineering Owner
- CMDB Process Owner
