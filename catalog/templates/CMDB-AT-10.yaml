  name: Tier designated and approved
  standard_ref: CMDB-STD-10 R01–R03
  applicability: Production Application Services
  required_evidence: busines_criticality set; approver and date recorded
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: 100%
