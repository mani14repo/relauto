id: CMDB-AT-06
title: Application Service Dependency Mapping Assessment
domain: CMDB
variant: C
priority: P1
applicability: One Production Application Service (Tier 1/2) and its direct upstream/downstream dependencies; chains assessed
  end-to-end. • Service population (hosting)• App-to-app and app-to-platform dependencies• Validation against observed traffic•
  Currency
accountable_owner: SRE Region Lead / Architecture
purpose: Determine whether runtime dependencies are modeled in the CMDB accurately enough to support blast-radius assessment
  during incidents, change impact analysis, and recurrence correlation across CIs.
relevance: GDX → RCI → CRS and CFAO → Eos chains have no CMDB dependency map (V1). Rebate API error clusters (CPR 33%, CRR
  23%) need upstream/downstream context to explain recurrence — Henry's 'why are they recurring' question. CFAO has 9 apps
  in CMDB and 0 linked to incidents.
reassessment_trigger: Tier 1 every 6 months; Tier 2 every 12 months; after topology change or cascading incident
scope:
- • Service population (hosting)• App-to-app and app-to-platform dependencies• Validation against observed traffic• Currency
- • Business Service Offering linkage (CMDB-AT-01 C05)
signoff_roles:
- Assessment Lead
- Data Steward (portfolio)
- SRE Region Lead
- Business Application Owner / Engineering Owner
- CMDB Process Owner
criteria:
- id: CMDB-AT-06-C01
  number: 1
  name: Critical chain coverage
  standard_ref: CMDB-STD-04 R01–R02
  applicability: 'Named critical chains: GDX→RCI→CRS, CFAO→Eos, rebate CPR/CRR/repricing flows'
  required_evidence: Each hop modeled as Depends on::Used by between Production Application Services
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: 100%
  default_risk: Critical
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-04
  - CMDB-PB-05
  rubric_refs:
  - P2-01
  rubric_enablers: []
  csdm_layer: Service Delivery
  data_source: cmdb_rel_ci
  formula: Modeled hops ÷ hops in the approved chain definition
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Chain modeled through non-prod services• Hops modeled to servers instead of services
  risk_if_gap: Critical
  playbooks:
  - CMDB-PB-05
- id: CMDB-AT-06-C02
  number: 2
  name: Service population (no empty services)
  standard_ref: CMDB-STD-03 R10–R11
  applicability: Production Application Services
  required_evidence: Documented population method (tag-based, top-down mapping, dynamic CI group, manual entry points) and
    ≥ 1 hosting CI
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: Tier 1/2 100%; Tier 3 ≥ 90%
  default_risk: High
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-03
  - CMDB-PB-03
  rubric_refs:
  - P2-01
  rubric_enablers: []
  csdm_layer: Service Delivery
  data_source: svc_ci_assoc; service definition
  formula: Populated services ÷ Production Application Services
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Application Services that are names only• Manual population with no review date
  risk_if_gap: High
  playbooks:
  - CMDB-PB-03
- id: CMDB-AT-06-C03
  number: 3
  name: Dependencies classified
  standard_ref: CMDB-STD-04 R03–R05
  applicability: All modeled dependencies of the service
  required_evidence: Each dependency has criticality (Critical/Important/Informational), interaction (sync API / async message
    / batch file / DB / shared cache) and failure behaviour note for Critical
  evaluation_method: Deterministic + AI-assisted review of failure notes
  methods:
  - deterministic
  - ai
  acceptance_criteria: 100% classified; Critical ones have failure behaviour and SPOF flag
  default_risk: High
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-04
  - CMDB-PB-05
  rubric_refs: []
  rubric_enablers:
  - P1-08
  csdm_layer: Service Delivery
  data_source: cmdb_rel_ci attributes or companion table [CONFIRM]
  formula: Classified dependencies ÷ dependencies
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Batch file handoffs between rebate systems not modeled at all
  risk_if_gap: High
  playbooks:
  - CMDB-PB-05
- id: CMDB-AT-06-C04
  number: 4
  name: Shared platforms modeled as Technical Service Offerings
  standard_ref: CMDB-STD-04 R06
  applicability: Shared clusters, DB platforms, MQ, IAM, file transfer
  required_evidence: Technical Service Offering per environment with Dynamic CI Group; consuming Application Services linked
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: 100% for platforms used by Tier 1
  default_risk: Medium
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-04
  - CMDB-PB-05
  rubric_refs:
  - P2-01
  rubric_enablers: []
  csdm_layer: Service Delivery
  data_source: service_offering; cmdb_ci_query_based_service; cmdb_rel_ci
  formula: Shared platforms used by FSI with modeled offering and consumer links ÷ shared platforms used
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Platform outages raising incidents on each app separately — no parent
  risk_if_gap: Medium
  playbooks:
  - CMDB-PB-05
- id: CMDB-AT-06-C05
  number: 5
  name: Validated against observed traffic
  standard_ref: CMDB-STD-04 R07–R08
  applicability: Tier 1/2 services with APM or trace coverage
  required_evidence: Comparison of modeled vs observed dependencies (AppDynamics flow map / traces / log call evidence)
  evaluation_method: Deterministic where APM exists; Human review otherwise
  methods:
  - deterministic
  - human
  acceptance_criteria: Discrepancy ≤ 10%; 0 observed-not-modeled Critical dependencies
  default_risk: High
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-04
  - CMDB-PB-05
  rubric_refs:
  - P2-01
  rubric_enablers: []
  csdm_layer: Service Delivery → Observability
  data_source: AppDynamics; Splunk; cmdb_rel_ci
  formula: Discrepancy = (observed-not-modeled + modeled-not-observed) ÷ union of both
  maturity_bands: L0 never compared  |  L1 > 40%  |  L2 20–40%  |  L3 10–20%  |  L4 ≤ 10%
  look_for: • Telemetry identity unmapped (CMDB-AT-12) prevents comparison — record as Insufficient Evidence
  risk_if_gap: High
  playbooks:
  - CMDB-PB-05
- id: CMDB-AT-06-C06
  number: 6
  name: Map currency
  standard_ref: CMDB-STD-04 R09–R10
  applicability: Production Application Services
  required_evidence: Last validated date within TH-07; topology changes since then have triggered review
  evaluation_method: Deterministic
  methods:
  - deterministic
  acceptance_criteria: 100% within TH-07
  default_risk: Medium
  default_risk_assumed: false
  accountable_owner: ''
  reassessment: ''
  example_risk: ''
  example_recommendation: ''
  references:
  - CMDB-STD-04
  - CMDB-PB-05
  rubric_refs:
  - P2-01
  rubric_enablers: []
  csdm_layer: Service Delivery
  data_source: Validation record; change_request
  formula: Services validated within interval ÷ services
  maturity_bands: L0 < 25%  |  L1 25–49%  |  L2 50–79%  |  L3 80% to tier threshold  |  L4 ≥ tier threshold sustained 2 cycles
  look_for: • Maps validated once at go-live and never again
  risk_if_gap: Medium
  playbooks:
  - CMDB-PB-05
