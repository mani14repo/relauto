id: CMDB-AT-06
title: Application Service Dependency Mapping Assessment
domain: CMDB
variant: A
priority: P1
applicability: All FSI REO applications with cross-team or cross-portfolio dependencies; immediate focus on GDX->RCI->CRS
  revenue chain and CFAO->Eos dependency chain
accountable_owner: CMDB / Architecture / SRE
purpose: Evaluate whether application service dependencies are accurately mapped in ServiceNow CMDB, enabling correct change
  impact analysis, incident blast-radius assessment, and AI-assisted reliability recommendations.
relevance: RCI->GDX->CRS chain has no dependency map in ServiceNow. CFAO has 9 apps in CMDB but 0 linked to incidents (G-15).
  Upstream/downstream failures not traceable. G-12, G-20, G-21.
reassessment_trigger: Major release, architecture change, or Post-Incident Review recommendation
scope: []
signoff_roles:
- Assessment Lead
- Domain Reviewer
- Engineering / Service Owner
- PSE Representative
criteria:
- id: CMDB-AT-06-C01
  number: 1
  name: Critical Path Dependency Coverage
  standard_ref: ServiceNow CSDM — Application Service; ITPN G-12
  applicability: 'Revenue-critical application chains: GDX->RCI->CRS and CFAO->Eos'
  required_evidence: ServiceNow service map or relationship record showing each link in the dependency chain
  evaluation_method: 'Deterministic: each application in the critical chain linked to its upstream and downstream CIs in ServiceNow'
  methods:
  - deterministic
  acceptance_criteria: All links in GDX->RCI->CRS and CFAO->Eos chains mapped in ServiceNow CMDB; relationships visible in
    Service Map
  default_risk: Critical
  default_risk_assumed: false
  accountable_owner: CMDB / Architecture
  reassessment: ''
  example_risk: Critical — critical chain has no dependency map; upstream failures are invisible to incident responders
  example_recommendation: Build CMDB service map for Region A revenue chain (GDX->RCI->CRS) as top priority
  references: []
- id: CMDB-AT-06-C02
  number: 2
  name: Business Service Linkage
  standard_ref: ServiceNow CSDM — Business Service; ITPN G-20
  applicability: All FSI REO production applications
  required_evidence: 'ServiceNow business service records: each FSI application linked to at least one business service'
  evaluation_method: 'Deterministic: all 63 FSI applications linked to a business service record in CMDB'
  methods:
  - deterministic
  acceptance_criteria: All 63 FSI applications linked to at least one ServiceNow business service record
  default_risk: High
  default_risk_assumed: false
  accountable_owner: CMDB / Application Engineering
  reassessment: ''
  example_risk: High — applications without business service linkage cannot be attributed in SLO or business impact analysis
  example_recommendation: Create business service records for Region A (8 apps) first; extend to all 63 apps within 60 days
  references: []
- id: CMDB-AT-06-C03
  number: 3
  name: Dependency Map Accuracy Validation
  standard_ref: ServiceNow Service Mapping; ITPN G-12
  applicability: All mapped application service dependencies
  required_evidence: Service Mapping discovery run on critical application chains; comparison of map to architecture documentation
  evaluation_method: 'Human review: service map reviewed with application architect; discrepancies documented and resolved'
  methods:
  - human
  acceptance_criteria: Dependency map validated by application architect for each critical chain; discrepancies < 10%
  default_risk: High
  default_risk_assumed: false
  accountable_owner: CMDB / Architecture
  reassessment: ''
  example_risk: High — inaccurate dependency maps produce incorrect change impact analysis and blast-radius alerts
  example_recommendation: Validate each critical chain map with the application architect; document any dynamic dependencies
    not in CMDB
  references: []
- id: CMDB-AT-06-C04
  number: 4
  name: Shared Service Dependency Registration
  standard_ref: ServiceNow CSDM; ITPN G-20
  applicability: All shared platform services (authentication, messaging, file transfer) used by FSI REO applications
  required_evidence: 'ServiceNow shared service CIs: each shared service linked to all consuming FSI applications'
  evaluation_method: 'Deterministic: all shared platform services registered in CMDB; each linked to consuming application
    CIs'
  methods:
  - deterministic
  acceptance_criteria: All shared services registered; consumer relationships defined in CMDB for each
  default_risk: Medium
  default_risk_assumed: false
  accountable_owner: CMDB / Platform Engineering
  reassessment: ''
  example_risk: Medium — shared service outages affect multiple applications but are not tracked without registration
  example_recommendation: Enumerate shared services from application team interviews; register in CMDB; link all consumers
  references: []
- id: CMDB-AT-06-C05
  number: 5
  name: Dependency Map Currency
  standard_ref: ServiceNow Service Mapping; ITIL Configuration Management
  applicability: All mapped application service dependencies
  required_evidence: Dependency map last-validated date; Change Records linked to map updates when topology changes
  evaluation_method: 'Deterministic: dependency maps reviewed and validated against recent Changes each quarter'
  methods:
  - deterministic
  acceptance_criteria: All dependency maps reviewed at least quarterly; Change Records trigger map review when topology changes
  default_risk: Medium
  default_risk_assumed: false
  accountable_owner: CMDB / Change Management
  reassessment: ''
  example_risk: Medium — stale dependency maps mislead change impact analysis months after topology changes
  example_recommendation: Add dependency map review to Change post-implementation checklist for topology changes
  references: []
source_file: CMDB-AT-06 — Application Service Dependency Mapping Assessment.docx
references: []
