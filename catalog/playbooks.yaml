playbooks:
- id: CMDB-PB-01
  title: CI Registration & Onboarding Playbook
  objective: Every FSI REO component is registered in the CSDM-correct class, with mandatory attributes, owners, environment
    and relationships, before it carries production traffic — so its first incident is routed and attributed correctly.
  triggers:
  - Architecture/production readiness review (SRE-PB-07) approves a new application or component
  - Change request introduces a new workload, cluster namespace, database or integration
  - Discovery reconciliation (CMDB-PB-08) reports a New CI that belongs to FSI
  - Telemetry sweep (CMDB-PB-10) finds a production identifier with no Application Service
  - An incident is raised against a component that is not in CMDB
  - 'Does NOT apply when: Attribute corrections on an existing record — use CMDB-PB-02; Ownership transfer — use CMDB-PB-04'
  steps:
  - n: 1
    action: Open a CMDB registration task (catalog item 'CMDB Registration' [CONFIRM]) with product name, components, environments,
      owners, hosting platform and go-live date
    expected: Task created with all intake fields; linked to the triggering change/PRR
    owner: Requester
    phase: PHASE A — Intake and duplicate check
  - n: 2
    action: Search cmdb_ci_business_app by APM number, then by name with wildcard (e.g., *CPR*); search Application Services
      and assignment groups with similar names
    expected: Either an existing BA is identified or a documented 'no match' result
    owner: Data Steward
    phase: PHASE A — Intake and duplicate check
  - n: 3
    action: If a match exists, stop creation and treat the request as an extension (new component or environment) of the existing
      BA
    expected: No duplicate BA created
    owner: Data Steward
    phase: PHASE A — Intake and duplicate check
  - n: 4
    action: Create the Business Application using the product name (CMDB-STD-00 naming); never use an assignment-group or
      team name
    expected: BA record with APM number
    owner: Data Steward
    phase: PHASE B — Business Application
  - n: 5
    action: Populate it_application_owner, owned_by, business_owner (Tier 1/2), support_group, busines_criticality (provisional
      if CMDB-PB-09 pending), life cycle, u_region, u_portfolio
    expected: All BA required fields valid; no placeholder values
    owner: Data Steward
    phase: PHASE B — Business Application
  - n: 6
    action: Confirm owners are active users and the support group is the resolving team, not a catch-all
    expected: Owner and group pass active check
    owner: Data Steward
    phase: PHASE B — Business Application
  - n: 7
    action: For each component × environment create an Application Service named '<BA> — <Component> — <ENV>' (e.g., 'Rebates
      CPR — API — PROD', 'Rebates CPR — API — QA')
    expected: One record per component/environment; no name equals the BA name
    owner: Data Steward
    phase: PHASE C — Application Services (one per component per environment)
  - n: 8
    action: Set environment, owned_by, support_group, change_control, operational_status, busines_criticality (Production
      inherits BA tier), u_rto/u_rpo for Tier 1/2
    expected: Required service fields complete
    owner: Data Steward
    phase: PHASE C — Application Services (one per component per environment)
  - n: 9
    action: Create relationship Application Service Consumes::Consumed by → Business Application
    expected: Relationship visible in Dependency View
    owner: Data Steward
    phase: PHASE C — Application Services (one per component per environment)
  - n: 10
    action: 'For Tier 1/2 Production: link the Business Service Offering (Depends on::Used by → Application Service); create
      the offering per CMDB-PB-03 if missing'
    expected: Offering linkage present
    owner: Data Steward / Business Owner
    phase: PHASE C — Application Services (one per component per environment)
  - n: 11
    action: 'Choose a population method: tag-based (preferred for cloud/Kubernetes), top-down Service Mapping, Dynamic CI
      Group, or manual entry points; record it on the service'
    expected: Population method recorded
    owner: Data Steward
    phase: PHASE D — Hosting and platform
  - n: 12
    action: Add hosting CIs (namespace/workload, VMs, DB instances, app servers) to the Production Application Service; verify
      Discovery created them — register manually only if no automated source, with discovery_source = Manual
    expected: Production service contains ≥ 1 hosting CI
    owner: Platform Engineering
    phase: PHASE D — Hosting and platform
  - n: 13
    action: Link the Application Service to each shared platform it consumes via Depends on::Used by → Technical Service Offering
      (e.g., 'GKE Container Platform — PROD — us-central1')
    expected: Platform dependencies visible
    owner: Data Steward
    phase: PHASE D — Hosting and platform
  - n: 14
    action: Register the telemetry identity tuple for each production workload per CMDB-PB-10 steps 5–9 (cluster, namespace,
      workload, environment → Application Service) and request the workload labels in the deployment manifests
    expected: Mapping entry exists; label PR raised
    owner: SRE Region Lead / App Engineering
    phase: PHASE E — Telemetry identity (production)
  - n: 15
    action: Bind monitoring alerts to the Production Application Service or its hosting CIs (not to the monitoring tool CI)
    expected: Test alert creates an incident with the correct CI and assignment group
    owner: Observability Platform Owner
    phase: PHASE E — Telemetry identity (production)
  - n: 16
    action: Run the onboarding validation report (queries Q1–Q4) for the new BA
    expected: All checks pass
    owner: Data Steward
    phase: PHASE F — Validate and hand off
  - n: 17
    action: Raise a test incident in non-production (or simulate in UAT) using the Production Application Service picker;
      confirm routing and business-application derivation
    expected: Assignment group auto-set; business application derived
    owner: PSE
    phase: PHASE F — Validate and hand off
  - n: 18
    action: Owner attests the BA and Production Application Service (first attestation)
    expected: attested_date set
    owner: Business Application Owner
    phase: PHASE F — Validate and hand off
  - n: 19
    action: Close the registration task with the BA number, Application Service sys_ids and evidence links; set first review
      date per tier (TH-09)
    expected: Task closed with evidence
    owner: Data Steward
    phase: PHASE F — Validate and hand off
  decisions:
  - - Does a Business Application already exist for this product?
    - 'Extend it: add components/environments as Application Services (Phase C) / Create the BA (Phase B)'
  - - Is the component Kubernetes/cloud-hosted?
    - Use tag-based population and require workload labels (CMDB-STD-12) / Use Service Mapping or manual entry points with
      a review date
  - - Is the business owner or tier unknown at go-live?
    - Register with provisional tier = BA owner's proposal; flag 'Provisional' and open CMDB-PB-09 task due in 10 BD / Proceed
  - - Will the environment receive incidents or changes?
    - Create its own Application Service / Do not create a service; record the environment in the BA notes only
  - - Did Discovery create a CI with the wrong class?
    - Correct class via Class Manager and raise a Discovery pattern fix task / Continue
  validation:
  - Q1 — BA required fields — 0 blank/placeholder required fields
  - Q2 — Application Services for the BA — One per component per environment; names compliant; environment set
  - Q3 — Production service population — ≥ 1 hosting CI; Technical Service Offering linked
  - Q4 — Telemetry identity — All production workloads mapped (TH-08 for tier)
  - Test incident — Routed to support_group; business application derived
  source_file: CMDB-PB-01 — CI Registration & Onboarding Playbook — V2.docx
  version: V2
- id: CMDB-PB-02
  title: CMDB Data Quality Management Playbook (Monthly Cycle)
  objective: Run a repeatable 20-business-day cycle that measures CMDB quality against the CMDB-STD-00 thresholds, turns every
    failure into an owned task with an SLA, verifies fixes stick, and publishes a reconciled scorecard to REO governance.
  triggers:
  - Business day 1 of each month (scheduled)
  - Any threshold breach alert between cycles (e.g., attribution falls 5 points week-over-week)
  - Incident misrouted because of CMDB data (ad hoc mini-cycle for the affected BA)
  - 'Does NOT apply when: Registering new components — CMDB-PB-01'
  steps:
  - n: 1
    action: Freeze the scope list (fsi_scope.json) for the cycle; record its version
    expected: Scope version noted in the cycle log
    owner: OIP Product Owner
    phase: PHASE A — Measure (BD 1–2)
  - n: 2
    action: Run CMDB Health for FSI-filtered classes and export completeness, correctness, compliance by class and sub-portfolio
    expected: Export stored with timestamp
    owner: CMDB Platform Owner
    phase: PHASE A — Measure (BD 1–2)
  - n: 3
    action: Run the OIP data-quality job on the last 90 days of incidents/changes/problems; capture INC-APP, INC-CI, INC-APP-IDENTIFIED
      and change rules per assignment group
    expected: OIP run id recorded
    owner: OIP Product Owner
    phase: PHASE A — Measure (BD 1–2)
  - n: 4
    action: Compute TH-01…TH-14 per tier with the criteria catalog; treat placeholder values ('TBD', 'Unknown', '-- None --',
      'N/A') as blank
    expected: Threshold table complete
    owner: CMDB Process Owner
    phase: PHASE A — Measure (BD 1–2)
  - n: 5
    action: 'Group failures by BA and root cause: missing record, missing field, wrong value, missing relationship, generic
      CI on records, reverted by integration'
    expected: Triage sheet per steward
    owner: Data Stewards
    phase: PHASE B — Triage (BD 3)
  - n: 6
    action: 'Assign severity using the finding-SLA table (Critical: blocks P1 rubric or misroutes P1/P2)'
    expected: Every finding has severity and due date
    owner: Data Stewards
    phase: PHASE B — Triage (BD 3)
  - n: 7
    action: Create one task per BA per root cause (not per field) and assign to the CI owner/support group
    expected: Tasks visible to owners with SLA
    owner: Data Stewards
    phase: PHASE B — Triage (BD 3)
  - n: 8
    action: Owners correct records in ServiceNow (never in spreadsheets) and add a work note with the reason
    expected: Audit trail shows owner edits
    owner: CI Owners
    phase: PHASE C — Remediate (BD 3–15)
  - n: 9
    action: 'For blank ownership: confirm with the Business Application Owner; if unknown after 5 BD apply interim owner rule
      (CMDB-PB-04 step A6)'
    expected: No unowned production record
    owner: Data Stewards
    phase: PHASE C — Remediate (BD 3–15)
  - n: 10
    action: 'For generic CIs on incidents: fix the alert/event binding or routing rule at source (CMDB-PB-06 Part B), not
      only the records'
    expected: Source fix ticket linked
    owner: Observability / PSE
    phase: PHASE C — Remediate (BD 3–15)
  - n: 11
    action: 'For values reverted after remediation: open a CMDB Platform task to correct IRE precedence (CMDB-PB-08 step 6)'
    expected: Reversion root cause fixed
    owner: CMDB Platform Owner
    phase: PHASE C — Remediate (BD 3–15)
  - n: 12
    action: Re-run measures for remediated BAs; close tasks only when the measure passes
    expected: Tasks closed on evidence, not on owner say-so
    owner: Data Stewards
    phase: PHASE D — Verify (BD 16–18)
  - n: 13
    action: Reconcile incident counts in scope with Incident Management's report for the same window; explain variance > 2%
    expected: Variance note
    owner: OIP Product Owner / Incident Management
    phase: PHASE D — Verify (BD 16–18)
  - n: 14
    action: 'Publish the CMDB scorecard (CMDB-AT-13): CRI, maturity distribution, gates, top 10 blocking gaps with owners,
      overdue tasks'
    expected: Scorecard in REO governance pack
    owner: CMDB Process Owner
    phase: PHASE E — Report (BD 19–20)
  - n: 15
    action: Record decisions (exceptions, escalations, threshold changes) and update the baseline trend
    expected: Decision log updated
    owner: CMDB Process Owner
    phase: PHASE E — Report (BD 19–20)
  decisions:
  - - Does a BA fall below TH-01 by > 15 points?
    - Open a remediation sprint for that BA (dedicated steward time, 10 BD) / Normal task flow
  - - Is the same finding back for the second cycle?
    - 'Treat as process/control failure: fix the source (integration, IRE, routing) and escalate to CMDB Process Owner / Normal
      task flow'
  - - Does the owner dispute the finding?
    - Steward reviews evidence within 2 BD; if the rule is wrong, raise a rule change to OIP / Owner remediates
  - - Is the incident-count variance vs Incident Management > 2%?
    - Hold publication of affected figures; reconcile scope lists first / Publish
  validation:
  - Threshold table — Computed for every tier and sub-portfolio
  - Tasks — 100% owned with due date
  - Within-SLA closure — ≥ 90%
  - Scorecard — Published by BD 20 with reconciliation note
  source_file: CMDB-PB-02 — CMDB Data Quality Management Playbook (Monthly Cycle) — V2.docx
  version: V2
- id: CMDB-PB-03
  title: Application-to-Service (CSDM) Modeling Playbook
  objective: Build, for one Business Application at a time, the full CSDM chain — Business Service Offering → Production Application
    Service → Business Application, plus Technical Service Offerings and hosting — so incidents, changes and telemetry roll
    up correctly and production is separated from non-production.
  triggers:
  - BA at maturity L0/L1 in the monthly scorecard
  - New component or environment
  - Incident misattributed between prod and non-prod
  - Program wave assignment (CMDB-PB-11)
  - 'Does NOT apply when: Attribute-only fixes on an otherwise correct model'
  steps:
  - n: 1
    action: Confirm the BA record, owner, tier and region (CMDB-AT-01 C01–C03); fix gaps first
    expected: BA passes C01–C03
    owner: Data Steward
    phase: PHASE A — Prepare (30 minutes with owner)
  - n: 2
    action: List components (UI, API, batch, integration, database owned by the app) and the environments each runs in
    expected: Component × environment matrix agreed with owner
    owner: Business Application Owner
    phase: PHASE A — Prepare (30 minutes with owner)
  - n: 3
    action: Pull 90 days of incidents for the app's assignment groups; list distinct cmdb_ci values and their classes
    expected: List of CIs engineers actually select today
    owner: Data Steward
    phase: PHASE A — Prepare (30 minutes with owner)
  - n: 4
    action: Create or rename one Application Service per component × environment using '<BA> — <Component> — <ENV>'; rename
      any service whose name equals the BA name
    expected: Naming compliant; zero name collisions
    owner: Data Steward
    phase: PHASE B — Application Services
  - n: 5
    action: Set environment, tier, owners, support_group, change_control on each service; production tier = BA tier
    expected: Fields complete
    owner: Data Steward
    phase: PHASE B — Application Services
  - n: 6
    action: Relate each service Consumes::Consumed by → BA
    expected: All services consume the BA
    owner: Data Steward
    phase: PHASE B — Application Services
  - n: 7
    action: Mark legacy catch-all CIs that engineers pick today (e.g., a server named after the app) as hosting CIs of the
      right service — do not retire them until incidents stop using them
    expected: Legacy CIs inside the correct service
    owner: Data Steward
    phase: PHASE B — Application Services
  - n: 8
    action: Identify the Business Service the app supports in consumer language (e.g., 'Rebate Processing'); create/choose
      the Business Service Offering; relate Offering Depends on::Used by → Production Application Service
    expected: Business linkage present (Tier 1/2 mandatory)
    owner: Business Owner / Data Steward
    phase: PHASE C — Offerings
  - n: 9
    action: For each shared platform (GKE/AKS cluster, DB platform, MQ, file transfer, IAM) relate Production Application
      Service Depends on::Used by → the platform's Technical Service Offering for that environment
    expected: Technical linkage present
    owner: Platform Engineering
    phase: PHASE C — Offerings
  - n: 10
    action: Populate each service with its hosting CIs using the chosen method; for Kubernetes use namespace/workload membership
      by label
    expected: Each Production service has ≥ 1 hosting CI
    owner: Platform Engineering
    phase: PHASE D — Populate and separate environments
  - n: 11
    action: Check that no hosting CI belongs to both a PROD and a non-PROD service; resolve shared hosts explicitly (document
      as shared and tier-inherit)
    expected: 0 cross-environment memberships, or documented
    owner: Data Steward
    phase: PHASE D — Populate and separate environments
  - n: 12
    action: Configure incident form/routing so engineers select Application Services (reference qualifier or CI picker filtered
      to services + hosting classes) [CONFIRM with platform team]
    expected: Picker shows '<BA> — <Component> — PROD' options
    owner: CMDB Platform Owner
    phase: PHASE D — Populate and separate environments
  - n: 13
    action: Walk the Dependency View with the owner and SRE Region Lead; confirm each relationship
    expected: Sign-off recorded
    owner: SRE Region Lead
    phase: PHASE E — Validate and publish
  - n: 14
    action: Run CMDB-AT-01 C04–C05 checks and Gate A pre-check for the BA
    expected: C04/C05 Met
    owner: Data Steward
    phase: PHASE E — Validate and publish
  - n: 15
    action: Notify PSE and the app team of the services to select on incidents and changes; update the app runbook's Identification
      section
    expected: Notice sent; runbook updated
    owner: Data Steward
    phase: PHASE E — Validate and publish
  - n: 16
    action: Set review date per tier (TH-07) and add to attestation scope
    expected: Review scheduled
    owner: Data Steward
    phase: PHASE E — Validate and publish
  decisions:
  - - Does an Application Service share the BA's exact name?
    - Rename to the convention and add the environment token / Continue
  - - Does one service currently cover prod and non-prod?
    - Split into per-environment services; move hosting CIs; re-point open records to the PROD service / Continue
  - - Is the component a shared platform rather than an app?
    - Model as Technical Service/Offering, not as an Application Service of this BA / Model as Application Service
  - - Owner and architect disagree on a relationship?
    - Mark relationship 'Proposed' in work notes; SRE Region Lead decides within 5 BD using observed traffic / Proceed
  validation:
  - Names — 100% compliant; 0 equal to BA
  - Environment — Every service has environment; PROD separate
  - 'Offerings — Tier 1/2: business + technical linkage'
  - Population — PROD service has ≥ 1 hosting CI
  - Owner sign-off — Recorded
  source_file: CMDB-PB-03 — Application-to-Service (CSDM) Modeling Playbook — V2.docx
  version: V2
- id: CMDB-PB-04
  title: CI Ownership, Lifecycle & Certification Playbook
  objective: Keep every record owned by an active, appropriate person and group; move CIs through life cycle states under
    change control; and prove — through attestation, certification and sample audits — that the data stays correct after remediation.
  triggers:
  - Leaver/mover feed shows an owner left or changed role
  - Team reorganization or app transfer between regions
  - Change implements decommission or major life cycle transition
  - Attestation due per TH-09
  - Quarterly sample audit
  - 'Does NOT apply when: Initial registration — CMDB-PB-01'
  steps:
  - n: 1
    action: 'Daily: list records whose it_application_owner/owned_by user became inactive or whose support_group became inactive'
    expected: Ownership exception list
    owner: CMDB Platform Owner (scheduled report)
    phase: PART A — Ownership
  - n: 2
    action: Notify the Data Steward and the departing owner's manager; request a named successor
    expected: Successor request sent
    owner: Data Steward
    phase: PART A — Ownership
  - n: 3
    action: Apply the successor to all records of the BA (BA + its Application Services) in one update with a work note
    expected: Ownership consistent across BA family
    owner: Data Steward
    phase: PART A — Ownership
  - n: 4
    action: 'Check concentration: if the successor now owns > 15 BAs, require a named delegate per sub-portfolio'
    expected: Concentration ≤ 15 or delegate named
    owner: Data Steward
    phase: PART A — Ownership
  - n: 5
    action: 'For transfers between regions: update owner, support_group, change_control, u_region together and notify PSE/SRE'
    expected: No partial transfer
    owner: Data Steward
    phase: PART A — Ownership
  - n: 6
    action: 'If no successor in 5 BD: set the steward''s manager as interim owner, flag ''Interim'', escalate to REO leadership
      (never the SRE On-Call group as owner)'
    expected: Interim owner recorded
    owner: Data Steward
    phase: PART A — Ownership
  - n: 7
    action: Require a change for transitions to In Maintenance, Retiring and Retired for Tier 1/2-related CIs
    expected: Change linked to transition
    owner: Change Manager
    phase: PART B — Life cycle and decommission
  - n: 8
    action: 'At decommission planning: list the CI''s services, relationships, alerts, telemetry mappings and OIP map entries'
    expected: Decommission checklist populated
    owner: CI Owner
    phase: PART B — Life cycle and decommission
  - n: 9
    action: 'After change completion: remove relationships, retire alert rules and telemetry mappings, update OIP maps, set
      CI Retired within 5 BD'
    expected: All six decommission conditions met (CMDB-AT-03 C05)
    owner: CI Owner / Observability
    phase: PART B — Life cycle and decommission
  - n: 10
    action: Keep retired records (no delete) for 12 months minimum for audit and historical attribution
    expected: Record retained
    owner: CMDB Platform Owner
    phase: PART B — Life cycle and decommission
  - n: 11
    action: 'For EOL items: record EOL on product model, compute exposure via relationships, attach per-app plan; obtain risk
      acceptance for deferrals (e.g., Jenkins)'
    expected: EOL exposure and acceptance on record
    owner: Platform Engineering / REO leadership
    phase: PART B — Life cycle and decommission
  - n: 12
    action: 'Monthly: generate attestation tasks for records whose attested_date exceeds TH-09 (6/12/24 months by tier)'
    expected: Tasks assigned to owners
    owner: CMDB Platform Owner
    phase: PART C — Attestation, certification and audit
  - n: 13
    action: Owner reviews owner, support group, change_control, environment, tier, relationships and attests or corrects within
      10 BD
    expected: attested_date updated or corrections made
    owner: Business Application Owner
    phase: PART C — Attestation, certification and audit
  - n: 14
    action: Run data certification campaigns on ownership, environment and tier fields for FSI scope each quarter
    expected: Campaign completion ≥ 95%
    owner: Data Steward
    phase: PART C — Attestation, certification and audit
  - n: 15
    action: 'Quarterly: auditor samples 25 random records per sub-portfolio and verifies against reality (who actually supports
      it, where it runs)'
    expected: Accuracy rate recorded
    owner: CMDB Process Owner (independent of steward)
    phase: PART C — Attestation, certification and audit
  - n: 16
    action: Raise findings with severity and SLA; track exceptions with expiry and compensating control
    expected: Findings/exceptions logged
    owner: CMDB Process Owner
    phase: PART C — Attestation, certification and audit
  decisions:
  - - Has the owner left the organization?
    - 'Part A steps 2–6 / If role change only: owner confirms keep or transfer within 5 BD'
  - - Is the transition to Retired for a CI still in an active service?
    - 'Block: remove from service and relationships first / Proceed'
  - - Attestation overdue > 30 days?
    - Escalate to owner's manager; flag record 'Unattested' in scorecard / Normal follow-up
  - - Sample accuracy < 85%?
    - Trigger targeted re-attestation for that sub-portfolio / Normal cycle
  validation:
  - Ownership — 0 inactive owners/groups on production records
  - Concentration — ≤ 15 BAs per owner without delegate
  - Decommissions — 100% meet six conditions
  - Attestation — 100% Tier 1 current
  - Sample accuracy — ≥ 95%
  source_file: CMDB-PB-04 — CI Ownership, Lifecycle & Certification Playbook — V2.docx
  version: V2
- id: CMDB-PB-05
  title: Service Dependency Mapping Playbook
  objective: Model runtime dependencies so that, for any Tier 1/2 service, an engineer can see in under 5 minutes what it
    depends on, what depends on it, which dependencies are critical, and where single points of failure are — validated against
    observed traffic.
  triggers:
  - Tier 1/2 service without validated map (TH-07)
  - Cascading incident
  - New integration deployed
  - Change impact analysis blocked (CMDB-PB-07)
  - 'Does NOT apply when: Non-production-only integrations'
  steps:
  - n: 1
    action: Export current modeled dependencies of the Production Application Service (Dependency View, depth 2)
    expected: Baseline list
    owner: Data Steward
    phase: PHASE A — Gather
  - n: 2
    action: 'Interview the architect/lead engineer with the interface checklist: outbound APIs, inbound callers, queues/topics,
      file transfers, DBs read/written, caches, IAM, schedulers'
    expected: Interview list
    owner: Application Architect
    phase: PHASE A — Gather
  - n: 3
    action: 'Extract observed dependencies: AppDynamics flow map for the tier(s); trace service graph; Splunk/Loki call or
      connection logs using summary searches (avoid wide raw searches that are throttled)'
    expected: Observed list with evidence links
    owner: SRE Region Lead
    phase: PHASE A — Gather
  - n: 4
    action: 'Merge the three lists into a candidate table: target, direction, interaction type, evidence source(s)'
    expected: Candidate table
    owner: Data Steward
    phase: PHASE A — Gather
  - n: 5
    action: Ensure every target exists as an Application Service or Technical Service Offering for the same environment; create
      via CMDB-PB-01/03 if missing
    expected: No dangling targets
    owner: Data Steward
    phase: PHASE B — Model
  - n: 6
    action: Create Depends on::Used by relationships from the consumer Application Service to each provider
    expected: Relationships in CMDB
    owner: Data Steward
    phase: PHASE B — Model
  - n: 7
    action: 'Classify each: Critical (provider failure = outage), Important (degradation), Informational; record interaction
      type'
    expected: 100% classified
    owner: Application Architect
    phase: PHASE B — Model
  - n: 8
    action: For each Critical dependency record failure behaviour (timeout, retry, circuit breaker, queue buffer, manual fallback)
      and flag SPOF where no redundancy exists
    expected: Failure notes and SPOF flags
    owner: SRE Region Lead
    phase: PHASE B — Model
  - n: 9
    action: Compute discrepancy = (observed-not-modeled + modeled-not-observed) ÷ union; investigate each observed-not-modeled
      Critical item
    expected: Discrepancy ≤ 10%
    owner: SRE Region Lead
    phase: PHASE C — Validate
  - n: 10
    action: Raise architecture review tasks for unintended dependencies and SPOFs (SRE-PB-02)
    expected: Tasks raised
    owner: SRE Region Lead
    phase: PHASE C — Validate
  - n: 11
    action: Sign-off by SRE Region Lead and architect; record validation date on the service
    expected: Validated date set
    owner: SRE Region Lead
    phase: PHASE C — Validate
  - n: 12
    action: Add 'dependency map updated?' to change closure for integration/topology changes
    expected: Change template updated
    owner: Change Manager
    phase: PHASE D — Maintain
  - n: 13
    action: Re-validate at TH-07 interval and after any cascading incident
    expected: Review scheduled
    owner: SRE Region Lead
    phase: PHASE D — Maintain
  decisions:
  - - Observed traffic shows an unmodeled dependency?
    - Model it; if unintended, raise architecture task / Continue
  - - Modeled dependency shows no traffic in 30 days?
    - 'Confirm with owner: batch/seasonal (keep, annotate) or obsolete (remove) / Continue'
  - - Telemetry identity unmapped so traffic cannot be attributed?
    - Record C05 as Insufficient Evidence; run CMDB-PB-10 first / Validate
  - - Critical dependency on lower-tier provider?
    - Record tier inversion; risk-accept or uplift (CMDB-PB-09) / Continue
  validation:
  - Critical chains — 100% hops modeled
  - Classification — 100%
  - Discrepancy — ≤ 10%
  - SPOFs — Flagged and tracked in SRE backlog
  source_file: CMDB-PB-05 — Service Dependency Mapping Playbook — V2.docx
  version: V2
- id: CMDB-PB-06
  title: CI Association on Incident, Problem & Change Records Playbook
  objective: Every operational record names the specific Production Application Service (or a hosting CI inside it) so that
    routing, application-level volume, MTTR, recurrence correlation and change-caused-incident linkage work — fixing causes
    at the source (event binding, routing) rather than record by record.
  triggers:
  - Every incident at assignment and resolution
  - Every normal/emergency change before CAB
  - Every problem at creation
  - Weekly hygiene run
  - Alert binds to a generic CI
  - 'Does NOT apply when: Security incidents handled by SOC'
  steps:
  - n: 1
    action: Open the record; if cmdb_ci is blank, generic (e.g., 'FSI REO', monitoring tool) or a non-prod service for a production
      impact, correct it before assigning
    expected: Specific CI selected
    owner: Assigned engineer / PSE
    phase: PART A — At record time (engineer)
  - n: 2
    action: Select the Production Application Service '<BA> — <Component> — PROD'; if the failing component is known, select
      the hosting CI inside that service instead
    expected: CI resolves to an Application Service
    owner: Engineer
    phase: PART A — At record time (engineer)
  - n: 3
    action: Confirm assignment_group matches the service support_group; if not, reassign or raise a CMDB task if the service
      record is wrong
    expected: Correct group
    owner: Engineer
    phase: PART A — At record time (engineer)
  - n: 4
    action: If several services are impacted, set the primary CI to the originating service and add others to Affected CIs/Impacted
      Services
    expected: Primary + affected recorded
    owner: Engineer
    phase: PART A — At record time (engineer)
  - n: 5
    action: 'For changes: set cmdb_ci and Affected CIs; run ''Refresh Impacted Services'' before submitting to CAB'
    expected: task_ci and task_cmdb_ci_service populated
    owner: Change Requester
    phase: PART A — At record time (engineer)
  - n: 6
    action: 'For problems: set cmdb_ci to the Application Service and relate all incidents with the same service and symptom'
    expected: Problem linked
    owner: Problem Manager
    phase: PART A — At record time (engineer)
  - n: 7
    action: 'Add a work note when correcting a CI: ''CI changed from X to Y because Z'''
    expected: Audit trail
    owner: Engineer
    phase: PART A — At record time (engineer)
  - n: 8
    action: 'Weekly: list alerts/events whose cmdb_ci is generic or a monitoring tool CI, grouped by alert rule/source'
    expected: Binding defect list
    owner: Observability Platform Owner
    phase: PART B — Event and alert binding (source fix)
  - n: 9
    action: 'Fix the binding using the telemetry identity map (CMDB-PB-10): event rule / CI binding to the Production Application
      Service or hosting CI'
    expected: Rule updated
    owner: Observability Platform Owner
    phase: PART B — Event and alert binding (source fix)
  - n: 10
    action: Test by replaying or triggering the alert in non-prod; confirm the created incident carries the right CI and group
    expected: Test passes
    owner: Observability Platform Owner
    phase: PART B — Event and alert binding (source fix)
  - n: 11
    action: 'Run the weekly hygiene report: open/resolved incidents last 7 days with blank/generic/non-prod CI, by assignment
      group'
    expected: Hygiene list
    owner: Data Steward
    phase: PART C — Weekly hygiene and historical backfill
  - n: 12
    action: Return records to the resolving group for correction (open) or correct directly with work note (resolved, within
      7 days)
    expected: Weekly list cleared
    owner: PSE
    phase: PART C — Weekly hygiene and historical backfill
  - n: 13
    action: 'Historical backfill (> 7 days, closed): do not edit closed records in bulk; instead maintain the OIP derived-attribution
      map (config/ci_application_map.json) from confirmed CI → Application Service mappings and label results ''derived'''
    expected: Derived attribution available for trends
    owner: OIP Product Owner
    phase: PART C — Weekly hygiene and historical backfill
  - n: 14
    action: 'Daily: OIP correlates incidents opened ≤ 72 h after a change completed on the same CI or Application Service
      (or its dependencies at depth 1)'
    expected: Candidate pairs list
    owner: OIP Product Owner
    phase: PART D — Change-caused incident correlation
  - n: 15
    action: PSE reviews each pair; if causal set incident.caused_by = change and notify the change owner; if not, add 'reviewed
      — not change-related' note
    expected: 100% pairs dispositioned
    owner: PSE Lead
    phase: PART D — Change-caused incident correlation
  - n: 16
    action: 'Monthly: feed confirmed change-caused incidents into change success metrics and Problem Management'
    expected: CHG-EMERGENCY-INCIDENT / PRB-CHANGE-LINK improve
    owner: Change Manager
    phase: PART D — Change-caused incident correlation
  decisions:
  - - Is the correct Application Service missing from CMDB?
    - Select the BA's closest service, raise CMDB-PB-01 task, note in work notes / Select it
  - - Does the same generic CI recur from one alert rule?
    - Part B source fix / Part A correction only
  - - Is the impacted environment non-production?
    - Select the non-prod service; never the PROD one / Select PROD
  - - Correlated pair involves a standard change?
    - Still disposition; standard changes can cause incidents / —
  validation:
  - P1/P2 specific CI — 100% at assignment (TH-04)
  - Attribution — TH-03 for tier
  - Changes — Affected CI 100%; Impacted Services ≥ TH-06
  - Correlation — 100% pairs dispositioned within 5 BD
  source_file: CMDB-PB-06 — CI Association on Incident, Problem & Change Records Playbook — V2.docx
  version: V2
- id: CMDB-PB-07
  title: Infrastructure Change Impact Analysis Playbook
  objective: Before approval, every shared-infrastructure change lists the Application Services it can affect — derived from
    the CMDB, not memory — with impact type, owner sign-off for outage/degradation, blackout checks and rollback impact; after
    implementation the CMDB is updated and dependents are confirmed healthy.
  triggers:
  - Change submitted on a CI that is a member of a Technical Service Offering or hosts any Production Application Service
  - Platform maintenance window planned
  - Emergency change during P1
  - 'Does NOT apply when: Changes scoped to one Application Service only'
  steps:
  - n: 1
    action: Set Affected CIs to the exact infrastructure CIs; run 'Refresh Impacted Services'
    expected: Impacted Services list generated
    owner: Change Requester
    phase: ''
  - n: 2
    action: Open Dependency View from each Affected CI (upstream, depth 3) and compare with Impacted Services; add missing
      services and note why the CMDB missed them
    expected: Reconciled impacted list; gaps logged
    owner: Change Requester
    phase: ''
  - n: 3
    action: If the platform's Technical Service Offering or Dynamic CI Group is missing, stop and raise CMDB-PB-05/03 task;
      for emergency changes use observed-traffic evidence and mark 'CMDB incomplete'
    expected: Decision recorded
    owner: SRE Region Lead
    phase: ''
  - n: 4
    action: For each impacted service record impact type (Full Outage / Degraded / Latency / None with justification), tier,
      owner and support group
    expected: Impact table attached
    owner: Change Requester
    phase: ''
  - n: 5
    action: Obtain written sign-off from owners of Full Outage/Degraded Tier 1/2 services
    expected: Sign-offs attached
    owner: Change Requester
    phase: ''
  - n: 6
    action: Check blackout windows (month-end rebate cycles, regulatory dates) for every impacted service
    expected: No conflict, or business-approved waiver
    owner: Change Requester
    phase: ''
  - n: 7
    action: State rollback impact for the same services
    expected: Rollback impact recorded
    owner: Change Requester
    phase: ''
  - n: 8
    action: Run conflict detection; resolve overlaps on related CIs/services
    expected: No unresolved conflicts
    owner: Change Manager
    phase: ''
  - n: 9
    action: Set risk from the number and tier of impacted services (≥ 1 Tier 1 Full Outage → High)
    expected: Risk consistent with impact
    owner: Change Manager
    phase: ''
  - n: 10
    action: Escalate to SRE Director and CAB if > 5 Tier 1/2 services or any Tier 1 Full Outage outside window
    expected: Escalation recorded
    owner: Change Manager
    phase: ''
  - n: 11
    action: 'After implementation: trigger Discovery or update CMDB for topology changes within TH-14; confirm in closure
      notes'
    expected: CMDB updated
    owner: Implementer
    phase: ''
  - n: 12
    action: Confirm each impacted service healthy via its SLO/health dashboard (CMDB-PB-10 mapped telemetry) for 60 minutes
    expected: Health confirmed
    owner: SRE Region Lead
    phase: ''
  - n: 13
    action: Close change with impact table, sign-offs and health evidence; OIP correlation (CMDB-PB-06 Part D) watches 72
      h
    expected: Closed with evidence
    owner: Change Requester
    phase: ''
  decisions:
  - - Owner sign-off missing after 2 BD?
    - Escalate to owner's manager; do not approve / Proceed
  - - More than 10 impacted services?
    - Dedicated CAB; consider splitting change / Normal CAB
  - - Impacted Services differ materially from Dependency View?
    - Raise CMDB-PB-05 task; use the union for this change / Proceed
  validation:
  - Impact table — Attached, complete
  - Sign-offs — All required present
  - Post-change CMDB update — Within TH-14
  - Health — All impacted services healthy 60 min
  source_file: CMDB-PB-07 — Infrastructure Change Impact Analysis Playbook — V2.docx
  version: V2
- id: CMDB-PB-08
  title: Discovery & Reconciliation Playbook
  objective: Keep automated discovery covering the whole FSI estate (on-prem, GCP, Azure, Kubernetes), reconcile New/Stale/Conflict
    items weekly, and enforce IRE precedence so owner-maintained data is never overwritten.
  triggers:
  - Weekly (Monday)
  - New cloud account/project/cluster
  - Coverage below TH-13
  - Remediated value reverted
  steps:
  - n: 1
    action: Reconcile source inventory (IP ranges, cloud accounts/projects/subscriptions, clusters) from Platform/Cloud Engineering
      with configured schedules/connectors
    expected: Every source has a schedule
    owner: CMDB Platform Owner
    phase: ''
  - n: 2
    action: Review last 7 days run status; open tasks for sources failing or not run
    expected: Failures ticketed
    owner: CMDB Platform Owner
    phase: ''
  - n: 3
    action: 'New items: for each newly discovered CI in FSI ranges/accounts, assign to the right Application Service (tags/labels)
      or route to CMDB-PB-01; unknown assets go to Security within 24 h'
    expected: No unassigned new CIs > 5 BD
    owner: Data Steward
    phase: ''
  - n: 4
    action: 'Stale items: Installed CIs not seen in 30 days (7 days for cloud) — confirm with owner; retire via CMDB-PB-04
      Part B or fix discovery reach'
    expected: Stale ≤ TH-10
    owner: Data Steward
    phase: ''
  - n: 5
    action: 'Duplicates: work de-duplication tasks; keep the IRE-identified record, merge relationships, retire the other'
    expected: Duplicates ≤ TH-11
    owner: Data Steward
    phase: ''
  - n: 6
    action: 'Precedence check: query sys_audit for owner-maintained fields changed by integration/discovery users in last
      7 days; fix reconciliation rules for any hit'
    expected: 0 overwrites
    owner: CMDB Platform Owner
    phase: ''
  - n: 7
    action: 'Enrichment: verify rules set used_for/environment and support_group from IP range, account, cluster or labels;
      fix rule gaps'
    expected: Enrichment ≥ 90%
    owner: CMDB Platform Owner
    phase: ''
  - n: 8
    action: 'Credentials: check rotation ≤ 90 days and vault backing'
    expected: Compliant
    owner: CMDB Platform Owner / Security
    phase: ''
  - n: 9
    action: Publish weekly reconciliation summary (new/stale/duplicate/overwrite/coverage)
    expected: Summary posted
    owner: CMDB Platform Owner
    phase: ''
  decisions:
  - - New CI has no owner or service?
    - Hold in 'Pending assignment'; steward resolves within 5 BD / Assign
  - - Discovery producing duplicates at scale?
    - Pause the pattern/schedule; fix identification rule; re-run / Continue
  - - Owner field overwritten?
    - Fix precedence; restore value from history / Continue
  validation:
  - Coverage — ≥ TH-13
  - Stale/duplicates — ≤ TH-10 / TH-11
  - Overwrites — 0
  source_file: CMDB-PB-08 — Discovery & Reconciliation Playbook — V2.docx
  version: V2
- id: CMDB-PB-09
  title: Application Criticality & Service Tiering Playbook
  objective: Assign each service an evidence-based tier using a scored worksheet, record RTO/RPO and approval in CMDB, and
    propagate the tier into incident priority, change risk, SRE engagement, data-quality thresholds and attestation cadence.
  triggers:
  - New service
  - Annual review
  - P1 incident suggesting tier mismatch
  - Business/regulatory change
  steps:
  - n: 1
    action: 'Score five dimensions 1–3 with the business owner: Financial impact per hour, Member/client impact, Regulatory/contractual
      exposure, Downstream dependency (number of Tier 1 consumers), Time sensitivity (24x7 / windows / deferrable)'
    expected: Worksheet completed
    owner: SRE Region Lead
    phase: ''
  - n: 2
    action: 'Total score → tier: 12–15 = Tier 1; 8–11 = Tier 2; 5–7 = Tier 3; any single ''3'' on Regulatory = minimum Tier
      2'
    expected: Proposed tier
    owner: SRE Region Lead
    phase: ''
  - n: 3
    action: Set RTO/RPO within the tier limits (CMDB-STD-00) and confirm they match the continuity plan and DR runbook
    expected: Values consistent
    owner: SRE Region Lead
    phase: ''
  - n: 4
    action: 'Obtain approval: Tier 1 by business owner + SRE Region Lead; Tier 2/3 by Business Application Owner'
    expected: Approval recorded
    owner: Approver
    phase: ''
  - n: 5
    action: Update busines_criticality on BA and Production Application Service; u_rto/u_rpo; approval reference in work notes
    expected: CMDB updated
    owner: Data Steward
    phase: ''
  - n: 6
    action: Check dependency tier inversions for Critical dependencies; record risk acceptance or uplift request
    expected: Inversions handled
    owner: SRE Region Lead
    phase: ''
  - n: 7
    action: Confirm incident priority guidance and routing reflect the tier (outage/degradation mapping)
    expected: PSE notified
    owner: Incident Management
    phase: ''
  - n: 8
    action: Confirm tier-based thresholds and attestation interval now apply in OIP and CMDB Health
    expected: Scorecard uses new tier
    owner: OIP Product Owner
    phase: ''
  - n: 9
    action: Set annual review date
    expected: Scheduled
    owner: Data Steward
    phase: ''
  decisions:
  - - Business owner and SRE disagree?
    - Use financial and regulatory scores as tie-breaker; escalate to SRE Director + business leadership / Proceed
  - - Observed incident impact exceeds tier?
    - Provisional uplift pending review / Keep
  - - Tier 1 without DR plan?
    - Raise critical SRE risk (SRE-PB-10) / Proceed
  validation:
  - Tier, RTO, RPO — Set and approved
  - Consistency — Matches plan/runbook
  - Propagation — Priority, thresholds, attestation updated
  source_file: CMDB-PB-09 — Application Criticality & Service Tiering Playbook — V2.docx
  version: V2
- id: CMDB-PB-10
  title: Observability Identity & Telemetry-to-CMDB Mapping Playbook
  objective: Give every production telemetry source a canonical identity that resolves to exactly one Application Service
    and environment, store that mapping once (CMDB-authoritative) and synchronize it to OIP and event binding, and make the
    series needed for reliability metrics retrievable without throttled raw-log pulls.
  triggers:
  - Production Application Service without mapping (CMDB-AT-12 C02)
  - New workload/namespace deployed
  - Weekly drift sweep finds unmapped production identifiers
  - Telemetry metric needed for executive reporting (Gate C)
  - 'Does NOT apply when: Non-production-only sources not used in reporting (map them, but no SLO series required)'
  steps:
  - n: 1
    action: 'Splunk: | tstats count where index=<FSI indexes> earliest=-7d by index, sourcetype, host, k8s.cluster.name, k8s.namespace.name,
      k8s.deployment.name [CONFIRM indexed field names]'
    expected: Identifier table from Splunk
    owner: Observability Platform Owner
    phase: PHASE A — Inventory sweep (per Application Service or per cluster)
  - n: 2
    action: 'Loki: list series/label values for cluster, namespace, app/service_name, env over 7 days (logcli series --analyze-labels
      or Grafana label browser)'
    expected: Identifier table from Loki
    owner: Observability Platform Owner
    phase: PHASE A — Inventory sweep (per Application Service or per cluster)
  - n: 3
    action: 'AppDynamics: export applications, tiers, nodes; note which map to the service'
    expected: AppD identifier table
    owner: SRE Region Lead
    phase: PHASE A — Inventory sweep (per Application Service or per cluster)
  - n: 4
    action: 'Kubernetes: kubectl get deploy,statefulset,cronjob -A --show-labels per cluster; capture cluster name, namespace,
      workload, labels'
    expected: Workload inventory
    owner: Platform Engineering
    phase: PHASE A — Inventory sweep (per Application Service or per cluster)
  - n: 5
    action: 'Build the canonical tuple for every identifier: {platform, cluster|host, namespace, workload|service.name, environment}'
    expected: Tuple table
    owner: Data Steward
    phase: PHASE B — Normalize and classify environment
  - n: 6
    action: 'Classify environment in this order: (1) explicit label fsi-reo/env or deployment.environment; (2) cluster/account/subscription
      designation (e.g., ''…-nonprod-…'' → non-prod); (3) workload/namespace token (''-int'', ''-qa'', ''-uat'', ''-stg'',
      ''-dev'' → non-prod); (4) owner confirmation. Record which rule decided'
    expected: Environment + rule per tuple
    owner: Data Steward
    phase: PHASE B — Normalize and classify environment
  - n: 7
    action: Flag contradictions (label says PROD but cluster is non-prod, or same service.name in both without env label)
      and resolve with owner before mapping
    expected: 0 unresolved contradictions
    owner: SRE Region Lead
    phase: PHASE B — Normalize and classify environment
  - n: 8
    action: Map each tuple to exactly one Application Service of matching environment; create the service via CMDB-PB-01/03
      if missing
    expected: Every production tuple mapped
    owner: Data Steward
    phase: PHASE C — Map and store
  - n: 9
    action: 'Record the mapping in the authoritative store (OD-4: CMDB relationship from workload/namespace CI to Application
      Service, or identity table keyed by tuple) with Application Service sys_id and readable key'
    expected: Mapping stored in CMDB
    owner: Data Steward
    phase: PHASE C — Map and store
  - n: 10
    action: 'Synchronize to OIP config: splunk_source_map.json entries {cluster, namespace, ci_family, application, environment}
      and ci_application_map.json; commit with reference to the CMDB record'
    expected: OIP map matches CMDB
    owner: OIP Product Owner
    phase: PHASE C — Map and store
  - n: 11
    action: 'Raise a PR on each workload manifest adding labels: app.kubernetes.io/name, app.kubernetes.io/part-of (BA), fsi-reo/app-service
      (service key), fsi-reo/business-app (APM number), fsi-reo/env, fsi-reo/support-group; and OTel resource attributes service.name,
      service.namespace, deployment.environment.name [proposed — OD-4]'
    expected: PR merged; labels visible
    owner: Application Engineering
    phase: PHASE D — Make identity self-describing
  - n: 12
    action: Request policy-as-code (admission policy) requiring these labels on production namespaces
    expected: Policy active (audit then enforce)
    owner: Platform Engineering
    phase: PHASE D — Make identity self-describing
  - n: 13
    action: Update event rules/CI binding so alerts from these sources bind to the mapped Application Service or hosting CI
      (CMDB-PB-06 Part B)
    expected: Test alert binds correctly
    owner: Observability Platform Owner
    phase: PHASE E — Bind events and make metrics retrievable
  - n: 14
    action: 'For Tier 1/2 services create a 28-day retrievable series: Splunk summary index or metrics (requests, errors,
      latency p95/p99 per service per 5 min) and/or Loki recording rules; avoid raw-log pulls across the window'
    expected: Series available for SLO window
    owner: Observability Platform Owner
    phase: PHASE E — Bind events and make metrics retrievable
  - n: 15
    action: 'Validate: pick 3 recent incidents for the service; confirm telemetry for the incident window is found via the
      mapping and the environment is correct'
    expected: 3/3 found, correct env
    owner: SRE Region Lead
    phase: PHASE E — Bind events and make metrics retrievable
  - n: 16
    action: 'Weekly drift sweep: re-run Phase A for production clusters/indexes; any production identifier not in the store
      raises a task (5 BD SLA)'
    expected: 0 aged unmapped identifiers
    owner: OIP Product Owner
    phase: PHASE F — Govern
  - n: 17
    action: 'On decommission: remove mappings, labels and summary searches (CMDB-PB-04 Part B)'
    expected: No orphan mappings
    owner: CI Owner
    phase: PHASE F — Govern
  - n: 18
    action: SRE Region Lead signs off Tier 1/2 mappings; record date for CMDB-AT-12
    expected: Sign-off
    owner: SRE Region Lead
    phase: PHASE F — Govern
  decisions:
  - - Does the cluster name designate non-prod (e.g., contains 'nonprod')?
    - Map all its workloads to non-prod services regardless of workload names / Continue to workload-level rules
  - - Same service.name exists in prod and non-prod without env label?
    - Treat as contradiction; require env label before mapping either to PROD / Map
  - - Namespace hosts several applications?
    - Map at workload level, not namespace level / Map at namespace level
  - - Raw search over 30 days is throttled?
    - Create summary/recording rule (Phase E) instead of retrying / Use the raw search for validation only
  - - No Application Service exists for the identifier?
    - Create via CMDB-PB-01 (Tier 1 within 2 BD) / Map
  validation:
  - Inventory completeness — AT-12 C01 ≥ tier threshold
  - Mapping coverage — TH-08
  - Environment contradictions — 0
  - Labels — ≥ 95% prod workloads
  - Event binding — ≥ 90% alerts bound
  - 28-day series — Tier 1 100%
  source_file: CMDB-PB-10 — Observability Identity & Telemetry-to-CMDB Mapping Playbook — V2.docx
  version: V2
- id: CMDB-PB-11
  title: CSDM Foundation Remediation Program Playbook — 90 Days
  objective: Move FSI REO from L0/L1 to Gate A for the highest-volume applications in 30 days and to L2 for all Tier 1 (≥
    50% at L3) in 90 days, so that executive application-level reporting becomes authoritative in waves rather than all at
    once.
  triggers:
  - Program kickoff approved by REO leadership
  - Scorecard shows < 50% of in-scope apps at L2
  steps:
  - n: 1
    action: Approve the single scope list (17 groups / 63 apps) and load it into OIP fsi_scope.json; reconcile incident counts
      with Incident Management (≤ 2% variance)
    expected: Scope approved and reconciled (AT-13 C01)
    owner: MG / OIP Product Owner
    phase: 'WAVE 0 — Days 0–10: Scope and baseline'
  - n: 2
    action: Confirm field names and licensed capabilities (OD-1, OD-6); configure CMDB Health for FSI classes per CMDB-STD-00
    expected: Platform ready
    owner: CMDB Platform Owner
    phase: 'WAVE 0 — Days 0–10: Scope and baseline'
  - n: 3
    action: Name Portfolio Data Stewards (≤ 15 apps each) and SRE Region Lead per region (OD-5)
    expected: Roles staffed
    owner: REO leadership
    phase: 'WAVE 0 — Days 0–10: Scope and baseline'
  - n: 4
    action: 'Run baseline: CMDB-AT-01, AT-04, AT-12 deterministic criteria for all apps; compute CRI and maturity'
    expected: Baseline scorecard v0
    owner: OIP Product Owner
    phase: 'WAVE 0 — Days 0–10: Scope and baseline'
  - n: 5
    action: Rank apps by 90-day incident volume × tier; assign to waves
    expected: Wave plan
    owner: CMDB Process Owner
    phase: 'WAVE 0 — Days 0–10: Scope and baseline'
  - n: 6
    action: Model each wave-1 BA with CMDB-PB-03 (Application Service per environment, offerings, population)
    expected: AT-01 C04/C05 Met
    owner: Data Stewards
    phase: 'WAVE 1 — Days 11–30: Region A top apps + REBATES-group apps + rebate APIs (CPR, CRR, repricing)'
  - n: 7
    action: Fix ownership and placement (CMDB-PB-04 Part A; Region = None → 0 for wave-1 apps)
    expected: AT-01 C02/C03 Met
    owner: Data Stewards
    phase: 'WAVE 1 — Days 11–30: Region A top apps + REBATES-group apps + rebate APIs (CPR, CRR, repricing)'
  - n: 8
    action: Fix event/alert binding and routing for wave-1 services (CMDB-PB-06 Part B)
    expected: Generic-CI rate ≤ 5% for new incidents
    owner: Observability / PSE
    phase: 'WAVE 1 — Days 11–30: Region A top apps + REBATES-group apps + rebate APIs (CPR, CRR, repricing)'
  - n: 9
    action: Publish OIP derived-attribution rules for the last 90 days (CI → Application Service from confirmed mappings)
      and label dashboard trends 'derived' until native attribution reaches TH-03
    expected: Historical trend available with label
    owner: OIP Product Owner
    phase: 'WAVE 1 — Days 11–30: Region A top apps + REBATES-group apps + rebate APIs (CPR, CRR, repricing)'
  - n: 10
    action: Map production telemetry for rebate APIs (CMDB-PB-10) and create 28-day summary series
    expected: AT-12 C02/C07 Met for rebate APIs
    owner: SRE Region Lead
    phase: 'WAVE 1 — Days 11–30: Region A top apps + REBATES-group apps + rebate APIs (CPR, CRR, repricing)'
  - n: 11
    action: 'Day 30 checkpoint: Gate A for wave-1 apps; record which executive metrics are authoritative'
    expected: Gate decisions recorded (AT-13 C04)
    owner: CMDB Process Owner
    phase: 'WAVE 1 — Days 11–30: Region A top apps + REBATES-group apps + rebate APIs (CPR, CRR, repricing)'
  - n: 12
    action: Model remaining Tier 1/2 BAs; tier them with CMDB-PB-09
    expected: All Tier 1/2 at ≥ L2
    owner: Data Stewards / SRE
    phase: 'WAVE 2 — Days 31–60: Remaining Tier 1/2 + critical chains'
  - n: 13
    action: Map critical chains GDX→RCI→CRS and CFAO→Eos (CMDB-PB-05) and validate against traffic
    expected: AT-06 C01 Met
    owner: SRE Region Leads
    phase: 'WAVE 2 — Days 31–60: Remaining Tier 1/2 + critical chains'
  - n: 14
    action: Turn on Impacted Services and post-change CMDB update controls (CMDB-PB-07); start change-caused correlation (CMDB-PB-06
      Part D)
    expected: AT-08 C01/C02/C04 trending to target
    owner: Change Manager
    phase: 'WAVE 2 — Days 31–60: Remaining Tier 1/2 + critical chains'
  - n: 15
    action: 'Day 60 checkpoint: Gate B candidates for wave-1 apps'
    expected: Gate B decisions
    owner: CMDB Process Owner
    phase: 'WAVE 2 — Days 31–60: Remaining Tier 1/2 + critical chains'
  - n: 16
    action: 'Model Tier 3 apps (lighter: Production Application Service + owner + support group)'
    expected: All apps ≥ L1; Tier 3 ≥ L2 target 70%
    owner: Data Stewards
    phase: 'WAVE 3 — Days 61–90: Tier 3, assurance and handover to steady state'
  - n: 17
    action: Launch attestation (CMDB-PB-04 Part C) and first independent sample audit
    expected: AT-11 C01/C06 baselined
    owner: CMDB Process Owner
    phase: 'WAVE 3 — Days 61–90: Tier 3, assurance and handover to steady state'
  - n: 18
    action: Turn on drift sweeps (CMDB-PB-08, CMDB-PB-10 Phase F) and monthly cycle (CMDB-PB-02)
    expected: Steady-state cadence running
    owner: CMDB Platform Owner / OIP
    phase: 'WAVE 3 — Days 61–90: Tier 3, assurance and handover to steady state'
  - n: 19
    action: 'Day 90 review with REO: CRI trend, gates passed, residual risks, next-quarter targets'
    expected: Program report
    owner: CMDB Process Owner
    phase: 'WAVE 3 — Days 61–90: Tier 3, assurance and handover to steady state'
  - n: 20
    action: 'Tuesday 30-minute stand-up: wave tracker, blockers, decisions needed; Thursday scorecard refresh in OIP'
    expected: Blockers owned within 1 BD
    owner: CMDB Process Owner
    phase: WEEKLY CADENCE (all waves)
  decisions:
  - - Wave-1 app misses Gate A at day 30?
    - Keep it 'indicative' on the dashboard; add steward capacity; re-check weekly / Report as authoritative
  - - Field/platform decision (OD-1…OD-7) not made by day 10?
    - Escalate to REO; proceed with documented assumption and flag / Proceed
  - - Native attribution reaches TH-03?
    - Retire derived attribution for that app / Keep derived, labelled
  validation:
  - Day 30 — Wave-1 apps at Gate A; rebate APIs telemetry mapped
  - Day 60 — All Tier 1/2 ≥ L2; critical chains mapped
  - Day 90 — Tier 1 ≥ 50% at L3; attestation and sweeps live
  source_file: CMDB-PB-11 — CSDM Foundation Remediation Program Playbook — 90 Days — V2.docx
  version: V2
- id: ITSM-PB-01
  title: Incident Detection, Triage & Resolution Playbook
  objective: Restore service to normal operation as quickly as possible; ensure every incident is correctly classified, assigned,
    worked, and closed with full evidence.
  triggers:
  - Automated alert fires in Splunk or AppDynamics and creates a ServiceNow incident record.
  - PSE or engineer manually raises an incident in ServiceNow.
  - A change record post-implementation review identifies a production defect.
  - A user or stakeholder reports a service degradation via the Service Desk.
  - A scheduled job fails and the failure is detected by monitoring or a downstream consumer.
  steps:
  - n: 1
    action: Confirm the incident record is open in ServiceNow. Note the INC number, creation time, and source (automated /
      manual).
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: Review the short description and any alert payload. Identify the affected application and service from the Configuration
      Item (CI) field.
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: If the CI field is blank or set to a generic group, update it to the correct application CI before proceeding.
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: 'Classify the incident: Priority P1 (critical — full outage or data loss risk), P2 (major — significant degradation),
      P3 (moderate — partial degradation), P4 (low — cosmetic or low-impact).'
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: Assign the incident to the correct assignment group. Use the CMDB service map or the FSI REO Application Ownership
      matrix to identify the owning team.
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: If this is a monitoring-generated incident (source = Event Management), confirm whether the alert is actionable.
      If the alert is a known false positive, document the reason in the Work Notes and close as Cancelled.
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: Open the relevant Splunk dashboard and AppDynamics APM trace. Capture screenshots of the error spike, latency
      anomaly, or infrastructure metric deviation.
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: Check for related open incidents on the same CI or shared infrastructure (use the 'Related Records' tab). If a
      parent incident exists, relate this incident to it.
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: 'Post an initial Work Note within 15 minutes of assignment: current symptoms, affected users/services, initial
      hypothesis, and next action.'
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: Execute the recovery procedure from the application runbook. If no runbook exists, escalate to the application
      engineer and document that the runbook is missing.
    expected: ''
    owner: ''
    phase: ''
  - n: 11
    action: 'For P1/P2 incidents: open a Teams bridge or Zoom war room and notify the SRE lead, PSE lead, and application
      owner within 10 minutes of triage completion.'
    expected: ''
    owner: ''
    phase: ''
  - n: 12
    action: Apply the fix, workaround, or restart procedure. Document each command or configuration change in the Work Notes
      with timestamp.
    expected: ''
    owner: ''
    phase: ''
  - n: 13
    action: Confirm service restoration by validating the Splunk health dashboard and executing the application smoke test
      (documented in the runbook).
    expected: ''
    owner: ''
    phase: ''
  - n: 14
    action: 'Update the Resolution Code field: select the most specific code (e.g., Software Fix, Configuration Change, Workaround
      Applied, Monitoring Noise).'
    expected: ''
    owner: ''
    phase: ''
  - n: 15
    action: If the incident recurred or required a workaround, create or update the Problem record and link it from the incident's
      Problem field.
    expected: ''
    owner: ''
    phase: ''
  - n: 16
    action: 'Complete the Closure Notes field with: root cause summary, resolution action taken, and whether a Problem record
      has been raised.'
    expected: ''
    owner: ''
    phase: ''
  - n: 17
    action: Set the incident state to Resolved. The affected user or service owner has 3 business days to reopen before auto-closure.
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - P1 or P2 after classification
    - Invoke Major Incident Management Playbook (ITSM-PB-02) immediately in parallel.
  - - CI field blank or incorrect
    - Do not proceed with assignment until CI is corrected. Notify the CMDB team if CI does not exist.
  - - No application runbook found
    - Escalate to application engineer. Log a gap in the Work Notes. Raise a Problem task to create the runbook.
  - - Monitoring-generated, no user impact confirmed
    - Investigate root cause. If alert is a false positive, close as Cancelled and raise alert-quality improvement task.
  - - Workaround applied but root cause not resolved
    - Raise a Problem record. Document the workaround in the Known Error Database.
  validation:
  - ServiceNow incident is in Resolved or Closed state with a completed Resolution Code.
  - CI field correctly identifies the affected application service.
  - Work Notes contain timestamped investigation steps and resolution evidence.
  - Splunk / AppDynamics screenshot or link is attached to the incident.
  - 'If a workaround was applied: a linked Problem record exists.'
  - MTTR is recorded and the incident appears in the weekly SRE reliability dashboard.
  source_file: ITSM-PB-01 — Incident Detection, Triage & Resolution Playbook.docx
  version: V1
- id: ITSM-PB-02
  title: Major Incident Management Playbook
  objective: Minimise business impact, maintain stakeholder communication, coordinate cross-team recovery, and capture learning
    outcomes from every major incident.
  triggers:
  - Incident classified as P1 at any point during triage.
  - SRE Lead or PSE Lead declares a P2 as major due to scope, duration, or business impact.
  - Two or more P2 incidents on the same platform or dependency within a 30-minute window.
  - Automated escalation rule in ServiceNow promotes the incident to Major based on impact thresholds.
  steps:
  - n: 1
    action: Assign the Incident Commander (IC). The IC owns the bridge, tracks time, and makes escalation decisions. The IC
      does not perform hands-on troubleshooting.
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: Open the pre-provisioned Teams war room for the affected portfolio region. Post the INC number, P1 declaration
      time, and initial impact statement.
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: 'Send the T+0 notification to the executive distribution list: application name, impact summary, region affected,
      and estimated time to next update.'
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: Assign a dedicated scribe to log all actions, decisions, and timestamps in the ServiceNow Work Notes.
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: 'Assemble the technical team: application engineer, SRE on-call, PSE lead, and platform/infrastructure owner if
      required.'
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: 'The technical team begins parallel investigation: application logs in Splunk, transaction traces in AppDynamics,
      infrastructure health in ServiceNow CMDB.'
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: IC issues a status update every 30 minutes to the executive distribution list until the incident is contained.
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: 'If root cause is identified and a fix is available: the IC approves the change. Document the emergency change
      approval in the Work Notes referencing the Change record number.'
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: 'If root cause is not identified within 60 minutes: escalate to the SRE Director and application architect. Consider
      invoking DR procedures (SRE-PB-10).'
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: Once service is restored, confirm via the Splunk health dashboard and application smoke test.
    expected: ''
    owner: ''
    phase: ''
  - n: 11
    action: 'Issue the resolution notification to the executive distribution list: resolution time, root cause summary (preliminary),
      and next steps.'
    expected: ''
    owner: ''
    phase: ''
  - n: 12
    action: Close the war room. Ensure the ServiceNow incident contains the full Work Notes, CI, resolution code, and all
      attachments.
    expected: ''
    owner: ''
    phase: ''
  - n: 13
    action: Schedule the Post-Incident Review (PIR) within 5 business days. Assign the PIR owner in ServiceNow as a Child
      Task.
    expected: ''
    owner: ''
    phase: ''
  - n: 14
    action: 'Complete the PIR document: timeline, contributing factors, corrective actions, and assigned owners with due dates.'
    expected: ''
    owner: ''
    phase: ''
  - n: 15
    action: Link all corrective action tasks to a Problem record in ServiceNow. Verify that each action has an owner and due
      date.
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Root cause not identified within 60 minutes
    - Escalate to SRE Director and application architect. Evaluate DR invocation.
  - - Emergency change is required
    - IC approves verbally on the bridge. Engineer raises an Emergency Change record in ServiceNow and links it to the incident.
  - - Multiple portfolios affected
    - Elevate to cross-portfolio bridge. Notify all four SRE region leads.
  - - PIR identifies a systemic risk
    - Raise a formal Problem record with a P-Task for engineering remediation. Assign to the application architect and SRE
      lead.
  validation:
  - ServiceNow incident has the Major Incident flag set and is in Resolved state.
  - All bridge updates are recorded in Work Notes with timestamps.
  - Executive notifications sent at T+0, T+30, T+60 and at resolution are attached or linked.
  - Post-Incident Review document is complete and linked as a ServiceNow attachment.
  - All corrective action tasks are linked to a Problem record and have assigned owners.
  - Incident timeline appears in the SRE monthly reliability report.
  source_file: ITSM-PB-02 — Major Incident Management Playbook.docx
  version: V1
- id: ITSM-PB-03
  title: Problem Management & RCA Playbook
  objective: Eliminate recurrence by identifying and addressing root causes; maintain a current Known Error database; ensure
    every corrective action is tracked to completion.
  triggers:
  - The same CI or application service experiences three or more incidents within 30 days.
  - A P1 incident is resolved with a workaround rather than a permanent fix.
  - An SRE reliability review identifies a recurring error pattern in Splunk or AppDynamics.
  - A Post-Incident Review (PIR) recommends a Problem record be raised.
  - A proactive trend analysis identifies a degradation trajectory before an outage occurs.
  steps:
  - n: 1
    action: Open a Problem record in ServiceNow. Link all related incident records in the Related Records tab.
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: Assign the Problem to the correct assignment group and name a Problem Manager as the accountable owner.
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: Confirm the affected CI is correctly populated. Update the CMDB record if the CI or service relationship is missing.
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: Conduct the RCA using the Five Whys or Fishbone (Ishikawa) method. Document each level of causal analysis in the
      RCA Notes field.
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: 'Identify the contributing factors: application defect, configuration drift, missing monitoring, infrastructure
      constraint, or process gap.'
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: Search the KEDB for existing Known Errors on the same CI or error pattern. If found, update the Known Error record
      rather than creating a duplicate.
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: 'If no Known Error exists: create a Known Error record with the symptom description, approved workaround, and
      CI relationship.'
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: 'Create Problem Tasks (P-Tasks) for each corrective action: code fix, configuration change, runbook update, monitoring
      improvement, or architecture change.'
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: 'Assign each P-Task to the accountable engineer. Set a due date based on the Problem priority (P1 Problem: 10
      business days; P2: 20 business days).'
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: Track P-Task progress in the weekly SRE operational review. Escalate overdue tasks to the engineering manager.
    expected: ''
    owner: ''
    phase: ''
  - n: 11
    action: 'Once all P-Tasks are complete: verify in production that the error pattern is gone (check Splunk — 14 days without
      recurrence).'
    expected: ''
    owner: ''
    phase: ''
  - n: 12
    action: 'Update the Known Error record: set the status to Known Error — Resolved, document the permanent fix, and note
      the date.'
    expected: ''
    owner: ''
    phase: ''
  - n: 13
    action: Close the Problem record with the Root Cause field completed and all P-Tasks in Closed state.
    expected: ''
    owner: ''
    phase: ''
  - n: 14
    action: 'If the RCA reveals a systemic risk beyond this application: raise a separate Problem for the shared platform
      and assign to the infrastructure or platform team.'
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Permanent fix requires a production change
    - Raise a Change record and link it to the P-Task. Follow ITSM-PB-05 for change planning and approval.
  - - Root cause cannot be determined with available data
    - Raise a monitoring improvement task. Add observability requirements to the SRE backlog (SRE-PB-03).
  - - Issue is a shared platform defect affecting multiple portfolios
    - Escalate to the platform owner. Raise a cross-portfolio Problem and assign to the SRE Director.
  - - Workaround is the only viable option long-term
    - Document in the KEDB as a Permanent Workaround. Set a calendar reminder for annual review.
  validation:
  - Problem record is Closed with Root Cause field completed.
  - All linked P-Tasks are in Closed state.
  - Known Error record updated to Resolved status with permanent fix documented.
  - Splunk shows 14 consecutive days with no recurrence of the error pattern.
  - Related incidents are linked to the Problem record in ServiceNow.
  - RCA document is attached to the Problem record or referenced by URL.
  source_file: ITSM-PB-03 — Problem Management & RCA Playbook.docx
  version: V1
- id: ITSM-PB-04
  title: Corrective & Preventive Action (CAPA) Playbook
  objective: Ensure every RCA corrective action is implemented, tested, and validated; provide auditable evidence linking
    Problem records to engineering outcomes.
  triggers:
  - A Problem record P-Task enters In Progress state.
  - A Post-Incident Review assigns a corrective action to an engineer.
  - An SRE audit or reliability review identifies a gap requiring remediation.
  - A preventive action is raised to address a risk identified before an incident occurs.
  steps:
  - n: 1
    action: Review the P-Task description. Confirm you understand the root cause, the expected fix, and the acceptance criteria.
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: 'Confirm the fix type: code change, configuration update, runbook improvement, monitoring enhancement, or architecture
      change.'
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: 'For code changes: create a feature branch, implement the fix, and submit a pull request with the Problem record
      number in the PR description.'
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: 'For configuration changes: document the before and after configuration state in the P-Task Work Notes before
      making any change.'
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: Raise a Normal or Standard Change record in ServiceNow. Link the Change to the P-Task and the parent Problem record.
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: Complete peer review and testing in the non-production environment. Document test results in the Change record's
      Test Evidence field.
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: Deploy the fix to production per the approved Change record schedule.
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: 'After deployment: execute the validation procedure (smoke test, monitoring check, or load test as appropriate).'
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: 'Attach validation evidence to the P-Task: Splunk dashboard screenshot, test report, or AppDynamics health confirmation.'
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: Monitor the affected service for 14 days post-deployment. Check Splunk daily for recurrence of the original error
      pattern.
    expected: ''
    owner: ''
    phase: ''
  - n: 11
    action: 'If no recurrence in 14 days: update the P-Task state to Closed — Validated. Add a closure note referencing the
      Change record and Splunk evidence.'
    expected: ''
    owner: ''
    phase: ''
  - n: 12
    action: Confirm the parent Problem record's Known Error entry is updated to Resolved status.
    expected: ''
    owner: ''
    phase: ''
  - n: 13
    action: 'If this was a preventive action: document the risk that was mitigated and the measurement used to confirm mitigation.'
    expected: ''
    owner: ''
    phase: ''
  - n: 14
    action: Report the closed CAPA in the next SRE operational review, noting the time from Problem creation to validated
      resolution.
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Fix introduces unexpected behaviour in testing
    - Stop deployment. Revert to the workaround. Update the P-Task with test failure evidence. Revisit the RCA.
  - - Production validation shows recurrence within 14 days
    - Reopen the Problem record. Escalate to the SRE Lead for a deeper RCA session.
  - - Fix requires architectural change beyond the sprint scope
    - Raise a separate engineering initiative. Retain the P-Task as a tracking vehicle with a revised due date approved by
      the engineering manager.
  validation:
  - P-Task is Closed — Validated with evidence attached.
  - Change record is Closed with post-implementation review completed.
  - Splunk shows no recurrence of the original error pattern for 14 days post-deployment.
  - Known Error record updated to Resolved.
  - CAPA outcome reported in SRE monthly reliability report.
  source_file: ITSM-PB-04 — Corrective & Preventive Action (CAPA) Playbook.docx
  version: V1
- id: ITSM-PB-05
  title: Change Enablement & Release Management Playbook
  objective: Prevent change-induced outages; ensure every production change has appropriate risk assessment, approval, test
    evidence, rollback procedure, and post-deployment validation.
  triggers:
  - An engineer raises a Change Request (CHG) in ServiceNow for a planned production deployment.
  - A Problem P-Task requires a production fix (ITSM-PB-04).
  - An emergency fix is required to restore service during a P1 incident (Emergency Change).
  - A scheduled maintenance window is approaching for a platform or infrastructure component.
  steps:
  - n: 1
    action: 'Raise a Change Request in ServiceNow. Select the change type: Standard (pre-approved, low-risk), Normal (requires
      CAB approval), or Emergency (P1-linked, IC-approved).'
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: 'Complete the Change Description field: what is changing, which CI is affected, and why the change is necessary.'
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: 'Complete the Risk Assessment: select the impact (1–4) and likelihood (1–4) scores. Document the basis for the
      risk score in the Risk Notes field.'
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: 'Attach or link the test evidence: non-production test summary, performance test results (if applicable), and
      peer review approval.'
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: Document the rollback plan in the Backout Plan field. The rollback must be executable within the maintenance window.
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: 'Document the implementation plan in the Implementation Plan field: step-by-step deployment instructions with
      time estimates for each step.'
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: 'For Normal changes: submit for CAB review at least 5 business days before the target deployment date.'
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: 'For Emergency changes: obtain verbal approval from the Incident Commander and the SRE Lead. Raise the Change
      record immediately and link to the P1 incident.'
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: Confirm SRE on-call availability and notify the PSE team of the deployment window.
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: Execute the deployment per the implementation plan. Document the actual start time, each step completion, and
      any deviations in the Work Notes.
    expected: ''
    owner: ''
    phase: ''
  - n: 11
    action: Execute the smoke test and confirm application health via Splunk and AppDynamics.
    expected: ''
    owner: ''
    phase: ''
  - n: 12
    action: 'If the smoke test fails or an alert fires within 15 minutes of deployment: execute the rollback plan immediately.
      Notify SRE on-call and open a P2 incident.'
    expected: ''
    owner: ''
    phase: ''
  - n: 13
    action: 'If the smoke test passes: continue to monitor for 30 minutes before declaring the deployment successful.'
    expected: ''
    owner: ''
    phase: ''
  - n: 14
    action: 'Complete the Post-Implementation Review (PIR) section in the Change record: actual vs. planned duration, any
      issues encountered, and whether the rollback was invoked.'
    expected: ''
    owner: ''
    phase: ''
  - n: 15
    action: Update the CI record in ServiceNow CMDB to reflect any configuration changes made during the deployment.
    expected: ''
    owner: ''
    phase: ''
  - n: 16
    action: Set the Change state to Closed.
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Smoke test fails post-deployment
    - Invoke rollback immediately. Raise a P2 incident linked to the Change record. Do not attempt further fixes until the
      rollback is confirmed.
  - - Deployment exceeds the maintenance window
    - 'IC or SRE Lead decides: proceed with rollback, or extend the window with stakeholder notification.'
  - - Emergency change required during P1
    - IC approves verbally. Engineer raises the CHG and links to the INC. CAB post-review within 2 business days.
  - - CMDB CI does not exist for the deployed application
    - Halt deployment until CI is registered. Raise a CMDB onboarding task (CMDB-PB-01).
  validation:
  - Change record is Closed with completed PIR section.
  - Rollback plan is documented and was not invoked (or if invoked, the reason is recorded).
  - Splunk and AppDynamics confirm no error spike within 30 minutes post-deployment.
  - CMDB CI record updated to reflect post-change configuration state.
  - Post-deployment validation evidence (smoke test result or monitoring screenshot) is attached to the Change record.
  source_file: ITSM-PB-05 — Change Enablement & Release Management Playbook.docx
  version: V1
- id: ITSM-PB-06
  title: Event & Alert Management Playbook
  objective: Ensure every alert is reviewed, classified as actionable or noise, and either drives an incident to resolution
    or is suppressed with documented justification.
  triggers:
  - An automated alert creates a ServiceNow incident via the Event Management integration.
  - A PSE or SRE engineer notices an alert pattern during a morning health check.
  - A recurring alert fires more than three times in 24 hours on the same CI.
  - An alert suppression rule expires and requires review.
  steps:
  - n: 1
    action: Open the ServiceNow incident created by the alert. Review the alert name, source, CI, severity, and time of first
      occurrence.
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: Navigate to the Splunk alert definition. Confirm the alert condition, threshold, and last-modified date.
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: 'Check the CI field. If it is blank or generic: look up the application from the alert payload and update the
      CI.'
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: 'Evaluate actionability: Does this alert indicate a real service degradation that requires engineer action? Check
      Splunk for corroborating signals (error rate, latency, throughput).'
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: 'If actionable: proceed with the Incident Detection, Triage & Resolution Playbook (ITSM-PB-01). Leave the Event
      Management source visible in the Work Notes.'
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: 'If not actionable (false positive, known transient, or test noise): document the reason in the Work Notes. Close
      the incident as Cancelled with the reason code ''Monitoring Noise''.'
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: 'For a recurring false positive (same alert, same result, 3+ times in 7 days): raise an alert improvement task
      in the SRE backlog. Assign to the monitoring engineer.'
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: Review the alert threshold and suppression configuration in Splunk. Determine if the threshold is appropriate
      for the current service baseline.
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: 'If the threshold is incorrect: raise a ServiceNow Change record to update the Splunk alert definition.'
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: Document the alert review outcome in the Event Management correlation rule (if applicable) to prevent duplicate
      incident creation.
    expected: ''
    owner: ''
    phase: ''
  - n: 11
    action: 'Report the weekly alert quality metrics in the SRE operational review: total alerts, actionable %, false positive
      %, suppressed %.'
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Alert is actionable
    - Proceed to ITSM-PB-01 triage. Keep the Event Management incident open.
  - - Alert is a recurring false positive (3+ in 7 days)
    - Raise an alert improvement task. Suppress the alert temporarily pending threshold review.
  - - Alert has no named owner
    - Assign to SRE On-Call group immediately. Raise a governance task to assign a permanent alert owner.
  - - Alert fires during a known maintenance window
    - Close as Cancelled — Planned Maintenance. Ensure a maintenance suppression rule is in place for future windows.
  validation:
  - 'Every ServiceNow incident from Event Management has a disposition: Actionable (linked to investigation) or Cancelled
    (reason documented).'
  - No alert fires for more than 7 days as a recurring false positive without an improvement task being raised.
  - Alert ownership matrix is reviewed and updated at least monthly.
  - Weekly alert quality metrics are reported in the SRE operational review.
  source_file: ITSM-PB-06 — Event & Alert Management Playbook.docx
  version: V1
- id: ITSM-PB-07
  title: Known Error & Workaround Management Playbook
  objective: Maintain an accurate KEDB so that any engineer can apply an approved workaround within minutes of a recurring
    incident being identified.
  triggers:
  - A Problem record is raised and a workaround is identified before a permanent fix is available.
  - An incident is resolved with a workaround and the Problem record is created (ITSM-PB-03).
  - The KEDB quarterly review identifies stale or unapproved entries.
  - An engineer cannot find an existing workaround during an active incident.
  steps:
  - n: 1
    action: Confirm a ServiceNow Problem record exists. If not, raise one per ITSM-PB-03 before creating the Known Error.
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: In ServiceNow, create a Known Error record linked to the Problem record.
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: 'Populate the Symptom Description: the observable user or system behaviour that engineers will see during a recurrence.'
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: 'Populate the Root Cause Summary: a plain-language explanation of why the error occurs (from the RCA).'
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: 'Document the approved workaround: step-by-step instructions that any engineer can follow without specialist knowledge.'
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: 'Specify the workaround limitations: time required, service impact during execution, prerequisites, and any conditions
      under which the workaround does not apply.'
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: Set the Known Error status to Known Error — Active — Awaiting Permanent Fix.
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: Link the Known Error record to all related incident records. This enables the Incident team to find the workaround
      by searching the CI.
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: Notify the PSE and SRE teams that the Known Error is active. Post the INC-search path in the Teams SRE operations
      channel.
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: Review the Known Error every 30 days. If a permanent fix has been deployed (ITSM-PB-04), update the status to
      Resolved and document the fix.
    expected: ''
    owner: ''
    phase: ''
  - n: 11
    action: 'If no permanent fix is possible: classify as Permanent Workaround and set an annual review date.'
    expected: ''
    owner: ''
    phase: ''
  - n: 12
    action: 'During the quarterly KEDB review: identify stale entries (no update in 90 days), orphaned entries (no linked
      Problem), and duplicates. Archive or resolve as appropriate.'
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Workaround has been applied more than 5 times in 30 days
    - Escalate the Problem to high priority. Raise a request to accelerate the permanent fix with the engineering manager.
  - - Permanent fix is deployed
    - Validate the fix per ITSM-PB-04. Update the Known Error status to Resolved.
  - - Workaround is no longer effective due to a system change
    - Update the Known Error immediately. Notify the PSE team. Raise a new P-Task for a revised workaround or permanent fix.
  validation:
  - Known Error record is linked to a Problem record in ServiceNow.
  - Workaround steps are documented and have been validated by at least one engineer other than the author.
  - Known Error status reflects the current state (Active / Resolved / Permanent Workaround).
  - Quarterly KEDB review is completed and evidenced with a review note.
  - All incident records for the affected CI reference the Known Error in their Work Notes.
  source_file: ITSM-PB-07 — Known Error & Workaround Management Playbook.docx
  version: V1
- id: ITSM-PB-08
  title: Knowledge Management & SOP Maintenance Playbook
  objective: Maintain a complete, accurate, and reviewed knowledge base so that any engineer can perform any documented operational
    procedure without escalation.
  triggers:
  - A new application is onboarded to FSI REO production support.
  - 'An incident reveals a procedural gap: the engineer could not find or follow the runbook.'
  - A change or deployment modifies application behaviour not reflected in the current SOP.
  - A knowledge article reaches its scheduled review date.
  - An RCA or PIR identifies missing operational knowledge as a contributing factor.
  steps:
  - n: 1
    action: 'Select the appropriate template: Incident Recovery Runbook, Deployment Runbook, Operational SOP, or Troubleshooting
      Guide.'
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: Draft the content. Use plain language and numbered steps. Avoid jargon that is not defined within the article.
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: 'For recovery runbooks: include the trigger condition, preconditions, step-by-step procedure, expected output
      at each step, rollback, and escalation path.'
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: 'For deployment runbooks: include the pre-deployment checklist, deployment steps, smoke test, rollback plan, and
      post-deployment validation.'
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: Include the CI name, application version, last-tested environment and date, and the author name.
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: Submit the draft for peer review. The reviewer must be an engineer who has not authored the document.
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: Incorporate reviewer feedback. Resolve all comments before advancing to approval.
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: Submit for SRE Lead or technical manager approval in ServiceNow.
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: Publish the approved article in ServiceNow Knowledge or the designated SharePoint library.
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: Notify PSE and on-call SRE engineers that the runbook is available. Post the link in the Teams SRE operations
      channel.
    expected: ''
    owner: ''
    phase: ''
  - n: 11
    action: 'Set the review date: 12 months from publication, or immediately after any major application release.'
    expected: ''
    owner: ''
    phase: ''
  - n: 12
    action: 'At review date: the assigned owner reviews the article against the current application configuration and deployment
      evidence. Update or retire as appropriate.'
    expected: ''
    owner: ''
    phase: ''
  - n: 13
    action: Mark articles that are no longer applicable as Retired. Do not delete — retain for audit purposes.
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Runbook cannot be validated because the application has changed significantly
    - Mark as Draft — Under Revision. Assign a new author. Set a 2-week revision deadline.
  - - Review date is missed by more than 30 days
    - Escalate to SRE Lead. Mark the article as Unreviewed — Use With Caution. Remove from the Active SOP list.
  - - Two engineers report the runbook does not work
    - Immediately flag as Unvalidated. Raise a P-Task for urgent revision. Notify the PSE team.
  validation:
  - Every FSI REO application has at least one incident recovery runbook and one deployment runbook in ServiceNow or SharePoint.
  - All runbooks have a review date and a named owner.
  - No active runbook is more than 12 months old without a review note.
  - New runbooks are validated by an engineer other than the author before publication.
  - 'SRE monthly report includes the runbook currency metric: % of runbooks reviewed within the last 12 months.'
  source_file: ITSM-PB-08 — Knowledge Management & SOP Maintenance Playbook.docx
  version: V1
- id: ITSM-PB-09
  title: Operational Handoff & Escalation Playbook
  objective: Ensure every shift handoff and on-call transition is documented, acknowledged, and traceable; prevent open incidents
    or unresolved risks from being lost during team transitions.
  triggers:
  - End of PSE or SRE on-call shift.
  - On-call engineer is unavailable and escalation to the next level is required.
  - A P1/P2 incident spans a shift boundary.
  - A cross-region escalation is required because the incident affects a shared platform component.
  steps:
  - n: 1
    action: '15 minutes before the handoff: the outgoing engineer prepares the handoff note using the standard template.'
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: 'Handoff note must include: all open P1/P2 incidents (INC number, status, last action, next action), any active
      changes in the deployment window, known risks or pending alerts requiring monitoring, and any KEDB entries relevant
      to open work.'
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: Send the handoff note to the incoming engineer via the Teams SRE operations channel. CC the SRE Lead.
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: The incoming engineer confirms receipt and acknowledges understanding of each open item.
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: 'For any open P1 incident: the incoming engineer joins the active bridge before the outgoing engineer leaves.'
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: 'The outgoing engineer updates ServiceNow: reassign all open incidents to the incoming engineer''s group and add
      a Work Note: ''Handoff to [name] at [time]. See handoff note [link].'''
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: The incoming engineer verifies the ServiceNow assignment queue. Confirm no incident is in an unassigned or defaulted
      state.
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: 'Post the handoff completion note in Teams: ''Handoff complete. [Name] is on-call from [time].'''
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: 'For cross-region escalations: the escalating engineer contacts the target region SRE Lead directly (Teams or
      phone). Does not rely on ServiceNow routing alone.'
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: The receiving region acknowledges and takes ownership. The originating region remains available for context for
      30 minutes.
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Incoming engineer cannot be reached at handoff time
    - Outgoing engineer contacts the SRE Lead immediately. Extends shift until relief is confirmed. Does not leave incidents
      unassigned.
  - - Open P1 incident at handoff time
    - Outgoing engineer stays on the bridge until the incoming engineer has confirmed they understand the current status and
      next action.
  - - No on-call cover identified for a region
    - SRE Director is notified immediately. Cross-region cover is arranged from an adjacent region.
  validation:
  - Handoff note is posted in the Teams SRE channel and acknowledged by the incoming engineer.
  - All open incidents are reassigned in ServiceNow with a handoff Work Note.
  - No incident is in an unassigned or default group state at the end of the handoff window.
  - Cross-region escalations are acknowledged within 15 minutes.
  source_file: ITSM-PB-09 — Operational Handoff & Escalation Playbook.docx
  version: V1
- id: ITSM-PB-10
  title: Continual Improvement & Operational Toil Playbook
  objective: Systematically identify and eliminate toil; track toil reduction as a measurable reliability improvement metric;
    ensure engineering capacity is redirected toward sustainable reliability engineering.
  triggers:
  - SRE engineer reports more than 2 hours per week on the same manual task.
  - The same alert or incident type has been manually resolved more than 10 times in a month.
  - An on-call engineer reports feeling overwhelmed by repetitive work during a retrospective.
  - An SRE quarterly review includes a toil measurement exercise.
  - A new automation candidate is identified during a Post-Incident Review.
  steps:
  - n: 1
    action: 'Conduct a toil inventory exercise with the SRE and PSE teams: each engineer lists their top 5 repetitive manual
      tasks and the time spent per week.'
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: 'Categorise each toil item: Incident Response Toil, Deployment Toil, Alert Triage Toil, Reporting Toil, or Configuration
      Management Toil.'
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: 'Quantify the toil: hours per week, frequency of occurrence, and estimated full-year cost in engineer hours.'
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: 'Prioritise toil items by: (1) frequency × time, (2) engineer frustration level, (3) automation feasibility.'
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: 'For the top 3 toil items: raise a Reliability Improvement Story in the engineering backlog. Assign an owner and
      a target completion quarter.'
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: 'Design the automation or process improvement: runbook automation in ServiceNow, Splunk scheduled search, CI/CD
      pipeline enhancement, or alert suppression rule.'
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: Build and test the automation in a non-production environment. Document the expected time saving per week.
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: Deploy the automation and monitor for the first 30 days. Track the actual time saving against the estimate.
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: 'Report the toil reduction in the SRE monthly reliability report: before/after engineer hours, automation coverage,
      and remaining toil backlog.'
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: 'Repeat the toil inventory quarterly. Track the trend: total toil hours per on-call week should decrease by at
      least 10% per quarter.'
    expected: ''
    owner: ''
    phase: ''
  - n: 11
    action: Celebrate toil elimination wins in the SRE quarterly review. Recognise engineers who contributed automation improvements.
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Toil item cannot be automated (manual judgement required)
    - Document why automation is not feasible. Investigate process simplification or decision-tree tooling instead.
  - - Toil reduction automation causes an incident
    - Disable the automation immediately. Raise a P2 incident. Review the automation design before re-enabling.
  - - Engineering capacity is insufficient for toil reduction work
    - Escalate to Engineering Manager. Present the toil cost in hours and its impact on reliability investment capacity.
  validation:
  - Toil inventory is conducted and documented at least quarterly.
  - At least one toil reduction automation is delivered per quarter.
  - Total on-call toil hours decrease quarter-over-quarter.
  - Toil reduction outcomes are reported in the SRE monthly reliability report.
  - Every automation has a named owner and a fallback procedure if it fails.
  source_file: ITSM-PB-10 — Continual Improvement & Operational Toil Playbook.docx
  version: V1
- id: ITSM-PB-11
  title: Alert Noise Management Runbook
  objective: ''
  triggers:
  - 'This runbook is triggered by any of the following:'
  - Monthly alert noise ratio in any region exceeds 20% (measured from ServiceNow monthly report)
  - A single alert source generates > 500 alerts in a 24-hour window without a linked P1 or P2 incident
  - Operations team reports > 30% of on-call alerts acknowledged but resolved with no action taken
  - Post-incident review (PIR) identifies a true positive buried in noise that caused delayed response
  - SRE or ITSM Manager requests a noise reduction sprint
  - Alert Correlation funding is approved and onboarding begins (triggers Section 6 Step 7)
  steps:
  - n: 1
    action: 'Pull Alert Noise Report: Export all monitoring-generated incidents from ServiceNow for the target month; Filter:
      incident_source IN (Dynatrace, AppDynamics, PagerDuty, Splunk); Calculate: (incidents with no work notes AND resolved
      without SRE action) / total monitoring incidents; Segment by region and by alert source tool; Compare to 20% threshold;
      flag regions exceeding it'
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: 'Classify Alert Categories: Category A — True noise: alert fires but no human action ever taken across 30+ consecutive
      occurrences; Category B — Duplicate / storm: same CI firing > 5 alerts within 10 minutes; Category C — Threshold miscalibration:
      alert fires outside business hours for a non-critical service; Category D — Correlation candidate: multiple alerts precede
      a single P1/P2 incident; Tag each alert rule with its category before proceeding'
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: 'Validate with On-Call Engineers: Share the classified list with the regional on-call leads (Region A, B, C, D);
      On-call leads confirm: "Have you ever taken action on this alert in the past 90 days?"; Any alert confirmed as never
      actioned AND with no open linked incident is eligible for suppression; Document validation sign-off: on-call lead name,
      region, date confirmed'
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: 'Raise Change Ticket for Suppression Rules: Open a Standard Change in ServiceNow for each batch of alert rule
      modifications; Change description must include: alert rule name, source tool, affected region, business justification;
      Attach the validation sign-off from Step 3 as evidence; Change requires approval from ITSM Platform Owner AND regional
      SRE lead; Implementation window: low-traffic hours (weekday 02:00-04:00 local region time)'
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: 'Implement Suppression Rules: Dynatrace: Settings > Anomaly Detection > Custom Events > [rule] > set Maintenance
      Window or suppress; PagerDuty: Services > [service] > Alert Grouping > adjust grouping window or silence rule; AppDynamics:
      Alert & Respond > Policies > [policy] > edit trigger threshold; Document the exact change made (before/after config
      export) in the change ticket; Do NOT bulk-suppress entire alert categories without per-rule review'
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: 'Monitor Post-Suppression for 5 Business Days: Pull daily alert noise counts for the affected region for 5 business
      days post-change; Confirm: no new P1/P2 incidents opened manually that match the suppressed alert pattern; If a true
      positive is missed within the 5-day window: immediately re-enable the suppressed rule and escalate to SRE Manager; Record:
      actual noise reduction achieved (target: each batch reduces noise by >= 5pp)'
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: 'Alert Correlation Onboarding (When Funded): Engage the monitoring platform vendor (Dynatrace / PagerDuty) for
      correlation rule design; Map Category D alerts (Step 2) as the initial correlation candidates; Pilot in Region B (lowest
      total volume) before rolling out to Region A and C; Success criterion: > 40% reduction in alert-to-incident ratio within
      60 days of activation; Update ITSM-AT-06 baseline after each major change'
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: 'Monthly Governance Review: Owner presents updated noise ratio by region to ITSM Operations Review; Report format:
      current ratio, 3-month rolling trend, rules added/removed, missed true positives; Escalate to ITSM Director if any region
      remains above 20% for 3 consecutive months; Update this runbook if new monitoring tools are onboarded or platform architecture
      changes'
    expected: ''
    owner: ''
    phase: ''
  decisions: []
  validation: []
  source_file: ITSM-PB-11 — Alert Noise Management Runbook.docx
  version: V1
- id: SRE-PB-01
  title: Reliability by Design Playbook
  objective: Ensure every FSI REO production application has documented reliability requirements, failure-handling design,
    and production readiness evidence before its first production deployment.
  triggers:
  - A new application is proposed for FSI REO production.
  - A major architecture change is approved (new service, new integration, platform migration).
  - An SRE assessment identifies that an existing application lacks baseline reliability requirements.
  - The Production Readiness Review (SRE-PB-07) flags reliability gaps that must be addressed.
  steps:
  - n: 1
    action: 'At project intake: schedule a Reliability by Design kick-off with the application engineer, SRE Lead, and architect.'
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: 'Define the reliability requirements: availability target (e.g., 99.9%), latency SLO (P99 response time), error
      budget, and recovery time objective.'
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: 'Review the architecture for reliability patterns: redundancy, circuit breakers, timeouts, retry logic, graceful
      degradation, and dependency isolation.'
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: Identify and document every external dependency. Classify each as Critical or Non-Critical (CMDB-PB-05).
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: 'Define the observability requirements: structured logging schema, key metrics (request rate, error rate, latency,
      saturation), and distributed tracing.'
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: 'Confirm the alerting strategy: what conditions must alert? Who is the alert owner? What is the initial response
      action?'
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: Create the SLI definitions and SLO targets in the SRE governance record. Assign an error budget owner.
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: 'Review the deployment architecture: how will the application be deployed without downtime? What is the rollback
      plan?'
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: 'Document the failure scenarios: for each Critical dependency, what happens to this application if that dependency
      is unavailable?'
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: 'Create the runbook skeleton: incident recovery procedure, deployment runbook, and dependency failure response.'
    expected: ''
    owner: ''
    phase: ''
  - n: 11
    action: 'At the sprint demo before production release: present the completed reliability checklist to the SRE Lead for
      review.'
    expected: ''
    owner: ''
    phase: ''
  - n: 12
    action: Obtain SRE Lead sign-off before the Production Readiness Review (SRE-PB-07) is scheduled.
    expected: ''
    owner: ''
    phase: ''
  - n: 13
    action: 'After go-live: review the reliability requirements at the first monthly SRE operational review. Confirm SLOs
      are being measured.'
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Architecture review identifies a SPOF with no mitigation
    - Raise an Architecture Risk item. Do not proceed to production until the SPOF is addressed or the risk is formally accepted
      by the SRE Director.
  - - SLO targets cannot be agreed between engineering and business
    - Escalate to the SRE Director. Use the application’s business impact and incident history as the basis for negotiation.
  - - Observability tooling is not in place for the new application
    - Raise an onboarding task for Splunk and AppDynamics instrumentation. Block the Production Readiness Review until observability
      is confirmed.
  validation:
  - SLI and SLO definitions are documented in the SRE governance record.
  - Architecture review confirms resilience patterns are implemented.
  - Observability coverage includes logs, metrics, traces, and at least one actionable alert.
  - Runbook skeleton is created in ServiceNow Knowledge or SharePoint.
  - SRE Lead has signed off the reliability requirements before the Production Readiness Review.
  source_file: SRE-PB-01 — Reliability by Design Playbook.docx
  version: V1
- id: SRE-PB-02
  title: Architecture Risk Storming Playbook
  objective: Identify and document all material reliability risks in the application architecture; produce a risk register
    with owners, mitigations, and timelines.
  triggers:
  - A new application or major architecture change is proposed.
  - A production incident reveals an unaddressed architectural SPOF.
  - The SRE quarterly review identifies an application with elevated incident frequency and no risk review on record.
  - An application approaches end-of-life for a critical dependency (e.g., a platform version going unsupported).
  steps:
  - n: 1
    action: 'Schedule the risk storming session (60–90 minutes). Participants: application engineer, SRE Lead, independent
      SRE engineer, and optionally the application architect.'
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: Open the architecture diagram. Walk through each component from the user entry point to the data layer.
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: 'For each component: ask ‘What happens if this fails?’ Document the failure scenario, affected users, and expected
      impact.'
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: 'Identify single points of failure: components with no redundancy, no circuit breaker, or no fallback path.'
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: 'Identify dependency risks: external services, shared databases, or identity providers with no SLA or no circuit
      breaker.'
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: 'Identify fault propagation paths: can a failure in one component cascade to unrelated services?'
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: 'Score each risk: Likelihood (1–4) × Impact (1–4) = Risk Score (1–16). Prioritise risks scoring 9 or above.'
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: 'For each high-priority risk: agree a mitigation strategy (implement circuit breaker, add redundancy, create a
      fallback, accept and monitor).'
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: 'For accepted risks: document the acceptance rationale and the engineer who accepted the risk.'
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: Create Architecture Risk items in the ServiceNow SRE backlog for each mitigation. Assign owners and due dates.
    expected: ''
    owner: ''
    phase: ''
  - n: 11
    action: Publish the Architecture Risk Register and share with the SRE Director and engineering manager.
    expected: ''
    owner: ''
    phase: ''
  - n: 12
    action: Schedule a follow-up review 30 days after the session to confirm mitigations are in progress.
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - A risk score of 16 (maximum) is identified
    - Halt new feature development on the affected component. Escalate to the SRE Director. Treat as a critical reliability
      debt item.
  - - Application owner refuses to accept the risk mitigation
    - Escalate to the SRE Director and engineering manager. The risk cannot be marked as accepted without management sign-off.
  - - Risk storming reveals a systemic risk across multiple applications
    - Raise a platform-level Architecture Risk item. Assign to the SRE Director and Infrastructure Engineering.
  validation:
  - Architecture Risk Register is published with all identified risks, scores, owners, and mitigations.
  - All risks scoring 9+ have a mitigation plan with a named owner and due date.
  - Accepted risks have documented rationale and management sign-off.
  - 30-day follow-up review confirms mitigations are in progress.
  - Risk Register is linked to the application’s CI record in ServiceNow.
  source_file: SRE-PB-02 — Architecture Risk Storming Playbook.docx
  version: V1
- id: SRE-PB-03
  title: Observability Engineering Playbook
  objective: Ensure every FSI REO production application has structured logging, key application metrics, distributed tracing,
    and at least one actionable alert configured and owned.
  triggers:
  - A new application is onboarding to FSI REO production.
  - An existing application generates Splunk alerts with no structured log data.
  - An SRE assessment identifies observability gaps (missing metrics, missing traces, or unowned alerts).
  - AppDynamics APM is not configured for a Tier 1 or Tier 2 application.
  - An incident is resolved with ‘insufficient log data’ cited as a contributing factor.
  steps:
  - n: 1
    action: Confirm Splunk index allocation for the application. Verify that log forwarding is configured and test logs are
      arriving.
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: 'Implement structured JSON logging in the application. Required fields: timestamp (ISO 8601), log level, service
      name, trace ID, correlation ID, message, and error detail (if applicable).'
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: 'Instrument the application with AppDynamics APM: install the agent, configure the application name, and verify
      that transactions are being captured.'
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: 'Define the four golden signals for this application: Latency (P50, P95, P99 response time), Traffic (requests
      per second), Errors (error rate %), and Saturation (thread pool, connection pool utilisation).'
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: Create the AppDynamics health rules for the four golden signals. Set baseline thresholds using 4 weeks of historical
      data.
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: Create the Splunk saved search for error rate. Set an alert to fire when the error rate exceeds the SLO threshold.
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: 'Create the Splunk dashboard: include the four golden signals, top error messages, and dependency call success
      rates.'
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: 'Configure distributed tracing: ensure every inbound request generates a trace ID that is propagated to all downstream
      calls.'
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: Assign an owner to every alert. No alert without a named owner and assignment group is accepted.
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: 'Conduct a 30-minute observability walkthrough with the PSE team: demonstrate the dashboard, show how to navigate
      from an alert to the root cause in logs, and confirm the escalation path.'
    expected: ''
    owner: ''
    phase: ''
  - n: 11
    action: Document the observability configuration in the application runbook (SRE-PB-08).
    expected: ''
    owner: ''
    phase: ''
  - n: 12
    action: Verify the Splunk and AppDynamics configuration is reflected in the CMDB CI record.
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Application cannot emit structured logs (legacy system)
    - Implement a log normalisation pattern in Splunk (field extraction). Raise a technical debt item to upgrade the logging
      framework.
  - - AppDynamics agent cannot be installed (containerised or serverless environment)
    - Use OpenTelemetry SDK for instrumentation. Export traces and metrics to AppDynamics via the OTLP endpoint. Confirm with
      the SRE Lead.
  - - Baseline data insufficient for threshold setting (new application)
    - Set conservative initial thresholds. Review and tighten after 4 weeks of production data.
  validation:
  - Splunk logs are arriving in the correct index with structured JSON format.
  - AppDynamics is capturing transactions with at least 95% instrumentation coverage.
  - Four golden signal metrics are visible on the Splunk dashboard.
  - At least one actionable alert is configured with a named owner for each application.
  - PSE team has completed the observability walkthrough.
  - Observability configuration is documented in the runbook and reflected in the CI record.
  source_file: SRE-PB-03 — Observability Engineering Playbook.docx
  version: V1
- id: SRE-PB-04
  title: SLI-SLO & Error Budget Engineering Playbook
  objective: Ensure every FSI REO Tier 1 and Tier 2 application has at least one SLI and one SLO defined, measured, and reviewed
    monthly.
  triggers:
  - A new application is being onboarded (SRE-PB-01).
  - An existing application has no defined SLO.
  - A post-incident review identifies that the incident breached an undocumented reliability expectation.
  - The monthly SLO review shows an application is consuming its error budget faster than planned.
  steps:
  - n: 1
    action: 'Define the SLI: identify the measurable property that best represents the user experience. Common SLIs: availability
      (% of successful requests), latency (P99 response time), error rate (% of requests returning errors).'
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: 'Express the SLI as a ratio: ‘good events / total events.’ Define what constitutes a ‘good event’ for this application.'
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: 'Set the SLO target: the percentage of time the SLI must be within the acceptable range (e.g., 99.9% of requests
      must complete within 500ms).'
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: 'Calculate the error budget: Error Budget = 1 - SLO. For a 99.9% SLO over 30 days, the error budget is 43.2 minutes
      of downtime.'
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: 'Implement the SLI measurement in Splunk: write the saved search that computes the SLI ratio from application
      logs.'
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: 'Create the SLO dashboard in Splunk: show the rolling 28-day SLI trend, current error budget remaining, and burn
      rate.'
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: 'Set an error budget alert: fire when the burn rate indicates the error budget will be exhausted before the end
      of the window.'
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: 'Document the SLO in the SRE governance record: SLI definition, SLO target, measurement method, error budget,
      and owner.'
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: 'Define the error budget policy: when the error budget is > 50%, feature velocity proceeds normally. When 25-50%,
      SRE reviews all new releases. When < 25%, new feature deployments are paused and reliability work is prioritised.'
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: 'Review the SLO monthly: compare the actual SLI against the SLO target. Adjust if the target is consistently trivially
      met or consistently breached.'
    expected: ''
    owner: ''
    phase: ''
  - n: 11
    action: 'After the first 3 months: review whether the SLO reflects the actual user experience. Refine if needed.'
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Error budget is exhausted mid-month
    - 'Invoke the error budget policy: pause non-critical deployments. Convene an SRE reliability review. Prioritise reliability
      work in the next sprint.'
  - - SLO target is trivially met every month (no budget consumed)
    - Review whether the target is too loose. Tighten the SLO to reflect the actual business expectation.
  - - SLI measurement is technically infeasible from current logs
    - Raise an observability improvement task (SRE-PB-03). Use a proxy SLI temporarily. Document the proxy in the governance
      record.
  validation:
  - SLI is defined as a measurable ratio and is being computed from Splunk data.
  - SLO target is agreed by the SRE Lead and the application business owner.
  - Splunk SLO dashboard is live and shows the rolling 28-day trend.
  - Error budget policy is documented and the engineering team has been briefed.
  - Monthly SLO review is on the SRE calendar.
  - SLO definition is recorded in the SRE governance record and linked to the application CI.
  source_file: SRE-PB-04 — SLI-SLO & Error Budget Engineering Playbook.docx
  version: V1
- id: SRE-PB-05
  title: Application Resilience Engineering Playbook
  objective: Ensure every FSI REO Tier 1 application implements at least three resilience patterns with validated configurations,
    and every Tier 2 application implements at least one.
  triggers:
  - A new application is onboarding and the architecture review (SRE-PB-02) identifies missing resilience patterns.
  - A production incident is caused by a cascade failure from a missing timeout or circuit breaker.
  - An SRE assessment identifies that a Tier 1 application lacks resilience patterns.
  - A critical dependency’s SLA is reduced and the application must tolerate increased failure rates.
  steps:
  - n: 1
    action: Review the architecture dependency map (CMDB-PB-05). Identify every external call made by this application.
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: 'For each external call: determine the current timeout, retry, and circuit breaker configuration. Document the
      current state.'
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: Set explicit timeouts on every outbound HTTP, database, and message queue call. Use the dependency’s P99 response
      time as the timeout baseline, with a 3x multiplier.
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: Implement retry logic with exponential backoff and jitter on transient failure codes (HTTP 429, 503). Cap retries
      at 3 attempts.
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: Implement circuit breakers on calls to Critical dependencies (CMDB-PB-05). Configure the circuit to open after
      5 consecutive failures within a 30-second window.
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: 'Implement bulkhead isolation: use separate thread pools for calls to each Critical dependency so one dependency’s
      slowness does not exhaust the shared thread pool.'
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: 'Define graceful degradation behaviour: if a Non-Critical dependency is unavailable, what does the application
      return to the user? Implement and test the degraded response.'
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: Deploy the resilience configuration to the non-production environment.
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: 'Run chaos engineering tests: simulate dependency failures using a timeout injection or connection refusal in
      the test environment. Confirm the circuit breaker opens and the fallback is invoked.'
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: Review chaos test results with the SRE Lead. Confirm the application behaves as designed under failure conditions.
    expected: ''
    owner: ''
    phase: ''
  - n: 11
    action: Deploy to production per ITSM-PB-05. Monitor AppDynamics and Splunk for 30 minutes post-deployment.
    expected: ''
    owner: ''
    phase: ''
  - n: 12
    action: Document the resilience configuration in the application runbook (SRE-PB-08).
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Circuit breaker cannot be implemented in the current framework version
    - Raise a technical upgrade task. Implement a manual timeout and retry pattern as an interim measure. Document the gap
      in the Architecture Risk Register (SRE-PB-02).
  - - Chaos test reveals the circuit breaker does not open correctly
    - Do not deploy to production. Fix the configuration and repeat the test. Do not accept a failed chaos test as ‘acceptable
      risk.
  - - Application framework does not support bulkhead isolation
    - Use process-level isolation (separate service instances) as a bulkhead alternative. Document the design decision.
  validation:
  - Every external call has an explicit timeout configured.
  - Retry logic with exponential backoff is implemented on all transient failure paths.
  - Circuit breakers are configured for all Critical dependency calls.
  - Chaos engineering test results confirm circuit breakers open and fallbacks are invoked.
  - Resilience configuration is documented in the application runbook.
  - SRE Lead has reviewed and approved the resilience configuration.
  source_file: SRE-PB-05 — Application Resilience Engineering Playbook.docx
  version: V1
- id: SRE-PB-06
  title: Performance & Capacity Engineering Playbook
  objective: Ensure every Tier 1 application has a documented performance baseline, a passing load test result, and a capacity
    forecast updated at least quarterly.
  triggers:
  - A new application is preparing for production deployment.
  - A significant traffic increase is anticipated (new integration, marketing campaign, regulatory deadline).
  - A production incident is attributed to capacity exhaustion or performance degradation.
  - Quarterly capacity review is due.
  - A platform migration changes the application’s resource profile.
  steps:
  - n: 1
    action: 'Establish the performance baseline: from 4 weeks of AppDynamics production data, compute the P50, P95, and P99
      response times and the peak transactions per second (TPS).'
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: 'Define the performance acceptance criteria: the P99 response time must not exceed the SLO latency target at 1.5x
      the current peak TPS.'
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: 'Design the load test scenario: model the representative user journey (read, write, search operations) with transaction
      mix matching production.'
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: Run the baseline load test in the non-production environment at 1x peak TPS. Confirm the response times meet the
      acceptance criteria.
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: Run the stress test at 1.5x peak TPS. Confirm the application degrades gracefully (latency increases but the circuit
      breaker does not open and no errors occur).
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: 'Run the breaking point test: increase load until errors begin. Document the breaking point TPS. Confirm the breaking
      point is at least 2x the expected peak.'
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: Review load test results with the SRE Lead. Identify bottlenecks (CPU, memory, thread pool, database connection
      pool).
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: 'Resolve identified bottlenecks: scale the resource, tune the thread pool, or optimise the query. Re-run the test
      after each fix.'
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: 'Document the capacity forecast: current peak TPS, growth rate per quarter, estimated capacity ceiling, and the
      quarter when the ceiling will be reached.'
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: 'Configure auto-scaling rules (if the platform supports it): scale out at 70% CPU or 80% connection pool utilisation.'
    expected: ''
    owner: ''
    phase: ''
  - n: 11
    action: 'Set a Splunk capacity alert: fire when observed TPS exceeds 80% of the load-tested safe maximum.'
    expected: ''
    owner: ''
    phase: ''
  - n: 12
    action: Update the capacity forecast quarterly using AppDynamics traffic trend data.
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Load test passes in non-prod but fails in production
    - Investigate environmental differences. Check connection pool sizes, infrastructure tier, and data volume. Rerun with
      production-representative data.
  - - Breaking point is below 1.5x current peak TPS
    - Do not proceed to production without capacity remediation. Escalate to the SRE Director.
  - - Capacity ceiling will be reached within 2 quarters
    - Raise a capacity expansion request immediately. Do not wait for the quarterly review.
  validation:
  - Baseline load test passes at 1x peak TPS within acceptance criteria.
  - Stress test passes at 1.5x peak TPS with graceful degradation.
  - Breaking point is at least 2x expected peak TPS.
  - Capacity forecast is documented and updated quarterly.
  - Splunk capacity alert is configured and owned.
  - SRE Lead has reviewed and approved the load test results.
  source_file: SRE-PB-06 — Performance & Capacity Engineering Playbook.docx
  version: V1
- id: SRE-PB-07
  title: Production Readiness Review Playbook
  objective: Prevent immature applications from reaching production by enforcing a standardised readiness gate with clear
    pass/fail criteria.
  triggers:
  - An application completes the Reliability by Design process (SRE-PB-01) and is ready for production.
  - A major release with a new service or dependency is approaching the deployment window.
  - The SRE Director requests a PRR for an existing application that was deployed without one.
  steps:
  - n: 1
    action: 'Schedule the PRR: SRE Lead, application engineer, PSE Lead, and (for Tier 1 applications) SRE Director.'
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: 'Review the Reliability by Design checklist: confirm SLIs, SLOs, error budget, and architecture review are complete.'
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: 'Review observability: confirm Splunk and AppDynamics are configured, the four golden signals are visible, and
      at least one actionable alert is owned.'
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: 'Review resilience: confirm timeouts, retries, and circuit breakers are implemented for all Critical dependencies.'
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: 'Review the runbook: confirm the incident recovery runbook, deployment runbook, and dependency failure response
      are published.'
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: 'Review the change plan: confirm the deployment has a rollback plan, test evidence, and a post-deployment validation
      step.'
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: 'Review on-call coverage: confirm the PSE on-call schedule includes this application and the assignment group
      is correct in ServiceNow.'
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: 'Review the CMDB CI: confirm the CI is registered with the correct tier, SRE region, and dependency relationships.'
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: 'Conduct a tabletop failure simulation: ‘The primary database fails at 2am. Walk me through the response.’ The
      engineer must be able to answer using the runbook.'
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: 'Score each PRR criterion: Pass, Conditional Pass (minor gap, owner and due date agreed), or Fail (significant
      gap, deployment blocked).'
    expected: ''
    owner: ''
    phase: ''
  - n: 11
    action: 'If all criteria Pass or have Conditional Pass resolutions agreed: PRR is approved. The SRE Lead signs off.'
    expected: ''
    owner: ''
    phase: ''
  - n: 12
    action: 'If any criterion Fails: deployment is blocked. The application engineer must address the failure and request
      a re-review.'
    expected: ''
    owner: ''
    phase: ''
  - n: 13
    action: Document the PRR outcome in ServiceNow (linked to the deployment Change record) and in SharePoint.
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Runbook tabletop simulation fails
    - PRR Fail. Deployment blocked. Application engineer must practice the runbook steps in a non-production simulation before
      re-review.
  - - Observability shows gaps but a fix is in progress
    - Conditional Pass. Agree the fix due date (must be before the deployment date). SRE Lead signs off with condition noted.
  - - SRE Director is unavailable for a Tier 1 PRR
    - Reschedule within 2 business days. Do not proceed with the PRR without the SRE Director for Tier 1 applications.
  validation:
  - PRR scorecard is completed for every criterion.
  - SRE Lead has signed off the PRR.
  - PRR outcome is documented in ServiceNow and linked to the deployment Change record.
  - All Conditional Pass items have agreed owners and due dates before the deployment proceeds.
  - PRR document is stored in the application’s SharePoint library.
  source_file: SRE-PB-07 — Production Readiness Review Playbook.docx
  version: V1
- id: SRE-PB-08
  title: Operational Runbook Engineering Playbook
  objective: Ensure every FSI REO production application has a current, validated incident recovery runbook and deployment
    runbook before any on-call rotation includes that application.
  triggers:
  - A new application is approved for production (before the Production Readiness Review, SRE-PB-07).
  - An incident reveals that the runbook is incorrect or incomplete.
  - A major application release changes the recovery or deployment procedure.
  - A runbook’s review date is reached.
  - An engineer reports being unable to use the runbook during an incident.
  steps:
  - n: 1
    action: 'Select the runbook type: Incident Recovery Runbook or Deployment Runbook.'
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: 'For an Incident Recovery Runbook: structure the content as follows: Trigger Condition, Preconditions, Triage
      Steps (5 minutes), Diagnosis Steps (confirm the failure type), Recovery Steps (numbered, with expected output at each
      step), Rollback (if recovery steps fail), Escalation Path, and Post-Incident Actions.'
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: 'For a Deployment Runbook: structure as: Pre-Deployment Checklist, Deployment Steps (with commands and expected
      output), Smoke Test, Rollback Plan, Post-Deployment Validation.'
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: 'Write every step as a specific action: not ‘check the logs’ but ‘Navigate to Splunk > [dashboard name] > filter
      by app=[name] and level=ERROR. Expected: error rate < 0.1%.’'
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: Include the exact commands, dashboard links, ServiceNow search paths, and expected output at each step.
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: Write the runbook assuming the reader has never touched this application before. Do not assume institutional knowledge.
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: 'Test the runbook: the author and a second engineer independently follow the runbook steps in a non-production
      environment. Document any step that was unclear or failed.'
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: Incorporate test feedback. Revise until both engineers can follow the runbook to a successful outcome without
      asking questions.
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: Submit for technical review by the SRE Lead or a senior engineer. Resolve all review comments.
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: Publish in ServiceNow Knowledge Base or SharePoint. Set the CI link on the knowledge article to the application’s
      CMDB CI.
    expected: ''
    owner: ''
    phase: ''
  - n: 11
    action: Notify PSE on-call engineers that the runbook is available. Post the link in the Teams SRE operations channel.
    expected: ''
    owner: ''
    phase: ''
  - n: 12
    action: 'Set the review date: 12 months from publication, or after any major application release.'
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Runbook test reveals a step that cannot be followed without specialist knowledge
    - Rewrite the step with sufficient context. If specialist knowledge is genuinely required, add an escalation step to a
      named subject matter expert.
  - - Recovery steps differ between production and non-production environments
    - Document the production-specific steps explicitly. Flag non-production test limitations in the runbook header.
  - - Runbook review date is missed
    - Mark the runbook as Unreviewed. Remove it from the active on-call reference list. Assign a revision task with a 10-business-day
      deadline.
  validation:
  - Incident Recovery Runbook is published and tested before the application is added to the PSE on-call rotation.
  - Both the author and an independent engineer have completed the runbook test successfully.
  - All review comments are resolved and the SRE Lead has approved.
  - Runbook is linked to the application CI in ServiceNow.
  - Review date is set and the runbook appears in the SRE currency report.
  source_file: SRE-PB-08 — Operational Runbook Engineering Playbook.docx
  version: V1
- id: SRE-PB-09
  title: Reliability Incident Investigation Playbook
  objective: 'For every P1 incident and for recurring P2 patterns: produce a reliability investigation report that identifies
    systemic contributing factors and drives engineering improvements.'
  triggers:
  - A P1 incident is resolved and the PIR task is created (ITSM-PB-02).
  - A P2 incident type has recurred three or more times in 60 days.
  - The SRE Lead identifies a reliability pattern requiring deeper investigation.
  - An error budget is exhausted and a root cause investigation is required.
  steps:
  - n: 1
    action: 'Reconstruct the incident timeline: list every event, action, and decision in chronological order from the first
      alert to resolution.'
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: 'Identify the contributing factors using the Systems Thinking approach: what conditions in the system made this
      failure possible?'
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: Apply the Five Whys to each contributing factor. Trace each factor to its systemic root.
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: 'Classify the contributing factors: Missing Observability, Missing Resilience, Process Gap, Human Factors, Architecture
      Risk, or External Dependency.'
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: 'Identify what went well: what detection, response, or communication actions worked as intended?'
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: 'Identify what could have been better: where were the delays, miscommunications, or ineffective actions?'
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: 'Define engineering improvements for each contributing factor. Be specific: not ‘improve monitoring’ but ‘add
      a Splunk alert for database connection pool exhaustion on [application name] within 10 business days.’'
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: Assign each improvement to a named engineer with a due date. Create P-Tasks in ServiceNow for each action.
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: 'Write the investigation report using the standard template: timeline, contributing factors, what went well, improvements,
      and assigned actions.'
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: 'Conduct a blameless review: this report is shared openly. No individual is blamed. Actions target system and
      process improvements.'
    expected: ''
    owner: ''
    phase: ''
  - n: 11
    action: Share the report with the SRE team, engineering leads, and (for P1s) the SRE Director.
    expected: ''
    owner: ''
    phase: ''
  - n: 12
    action: Schedule a 30-day follow-up to confirm engineering improvements are in progress.
    expected: ''
    owner: ''
    phase: ''
  - n: 13
    action: Add the findings to the SRE reliability knowledge base to benefit future investigations.
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Investigation reveals a systemic architecture risk
    - Raise an Architecture Risk item (SRE-PB-02). Escalate to the SRE Director.
  - - The incident was caused by a process that engineering cannot change
    - Escalate the finding to the SRE Director and the relevant process owner. Document the cross-team action item.
  - - Investigation cannot be completed due to missing log data
    - Document the missing data as a reliability evidence gap. Raise an observability improvement task (SRE-PB-03).
  validation:
  - Investigation report is complete with timeline, contributing factors, and improvements.
  - All improvements have named owners and due dates in ServiceNow P-Tasks.
  - Report is shared with the SRE team and relevant engineering leads.
  - 30-day follow-up is scheduled and completed.
  - Improvement actions are tracked through to closure in ServiceNow.
  source_file: SRE-PB-09 — Reliability Incident Investigation Playbook.docx
  version: V1
- id: SRE-PB-10
  title: Disaster Recovery & Failover Engineering Playbook
  objective: Ensure every Tier 1 FSI REO application has a tested DR procedure that can be executed by the on-call team and
    delivers recovery within the agreed RTO/RPO.
  triggers:
  - A Tier 1 application has no documented DR procedure.
  - Annual DR test is due.
  - A P1 incident escalates to the point where normal recovery is infeasible and DR invocation is being considered.
  - A major architecture change alters the DR design.
  steps:
  - n: 1
    action: Confirm the RTO and RPO for this application from the CMDB CI record.
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: 'Design the DR architecture: active-passive (standby), active-active (load-balanced), or backup-and-restore. Document
      the design decision and its RTO/RPO implications.'
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: 'Document the data replication strategy: synchronous or asynchronous. Confirm the RPO achievable with the chosen
      replication method.'
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: 'Write the DR runbook: include trigger criteria, decision authority (who can invoke DR), step-by-step failover
      procedure, DNS or load balancer cutover, data validation steps, and rollback procedure.'
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: 'Identify the DR invocation authority: who can declare a DR event? Document the escalation chain.'
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: Schedule the annual DR test. Notify the business owner and the PSE team at least 10 business days in advance.
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: 'Execute the DR test in a controlled window: follow the DR runbook step by step. Measure the actual recovery time
      and confirm data integrity.'
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: 'Compare actual recovery time against the RTO. If RTO is not met: raise a DR gap task immediately.'
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: 'Document the DR test results: start time, each recovery step timestamp, recovery completion time, data integrity
      validation result, and any deviations from the runbook.'
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: Update the DR runbook based on test findings. Address any steps that were unclear or required improvisation.
    expected: ''
    owner: ''
    phase: ''
  - n: 11
    action: Submit the DR test report to the SRE Director and the business owner.
    expected: ''
    owner: ''
    phase: ''
  - n: 12
    action: 'For a live DR invocation: follow the DR runbook. The Incident Commander has final decision authority. Document
      every action in the ServiceNow P1 incident Work Notes.'
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Annual DR test fails to meet RTO
    - Raise a Severity 1 DR gap task. Escalate to the SRE Director and engineering manager. Do not defer remediation to the
      next quarter.
  - - DR invocation is being considered during a P1 incident
    - IC consults the SRE Director before invoking DR. DR invocation is a high-impact action that requires explicit management
      approval.
  - - DR environment is not equivalent to production (data drift, version mismatch)
    - Pause the DR test. Investigate and remediate the environment gap. Reschedule the test within 10 business days.
  validation:
  - Annual DR test is completed and results documented.
  - Actual recovery time meets the RTO.
  - Data integrity validation passes after failover.
  - DR test report is submitted to the SRE Director and business owner.
  - DR runbook is updated based on test findings.
  - DR test evidence is linked to the application CI in ServiceNow.
  source_file: SRE-PB-10 — Disaster Recovery & Failover Engineering Playbook.docx
  version: V1
- id: SRE-PB-11
  title: Reliability Automation Engineering Playbook
  objective: Ensure every reliability automation artefact has a named owner, a tested failure mode, a manual override, and
    monitoring coverage before it is allowed to act on production systems.
  triggers:
  - A new reliability automation is proposed for production.
  - An existing automation causes an unexpected production action.
  - A toil reduction initiative (ITSM-PB-10) produces an automation candidate.
  - A Post-Incident Review recommends automation to reduce response time.
  steps:
  - n: 1
    action: 'Document the automation design: what trigger causes it to fire, what action it takes, what production systems
      it can affect, and what it does if the action fails.'
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: 'Identify the failure modes: what happens if the automation fires incorrectly? What is the worst-case production
      impact?'
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: 'Implement a manual override: every automation must be disableable within 30 seconds by a single command or a
      configuration toggle accessible to the on-call engineer.'
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: 'Implement logging: every automation action must generate a Splunk log entry with: timestamp, trigger condition,
      action taken, target system, and outcome.'
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: 'Implement dry-run mode: before enabling the automation in production, run it in dry-run mode for at least 5 business
      days. Review the dry-run log to confirm it would have taken correct actions.'
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: 'Test the failure mode: simulate the automation’s trigger condition in non-production and confirm the action is
      correct. Then simulate an incorrect trigger and confirm the manual override works.'
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: Obtain SRE Lead approval before enabling in production. Document the approval in ServiceNow.
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: Enable the automation in production. Monitor Splunk for the first 7 days for unexpected actions.
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: 'Set a monthly review: review the automation log. Confirm it is still taking correct actions and is not firing
      false positives.'
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: 'If the automation fires an incorrect action: disable immediately. Raise a P2 incident. Investigate before re-enabling.'
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Automation fires more than 3 incorrect actions in a week
    - Disable permanently until a root cause investigation is complete. Do not re-enable with only a threshold adjustment.
  - - Automation owner leaves the team
    - Reassign ownership before the engineer departs. No automation is allowed to run in production without an active owner.
  - - Automation blast radius is assessed as ‘full service outage’
    - Require SRE Director approval before enabling. Implement a two-person confirmation requirement for the trigger.
  validation:
  - Automation has a documented design, failure mode analysis, and blast radius assessment.
  - Manual override is tested and accessible to the on-call engineer.
  - Dry-run completed for at least 5 business days with reviewed logs.
  - SRE Lead approval is documented in ServiceNow.
  - Monthly review is scheduled and Splunk monitoring is active.
  source_file: SRE-PB-11 — Reliability Automation Engineering Playbook.docx
  version: V1
- id: SRE-PB-12
  title: Reliability Toil Reduction Playbook
  objective: Reduce SRE and PSE operational toil by at least 10% per quarter through systematic identification, prioritisation,
    and automation of repetitive reliability work.
  triggers:
  - Quarterly SRE toil measurement exercise is due.
  - An SRE engineer reports toil consuming more than 30% of their on-call time.
  - A Post-Incident Review identifies that manual steps during the incident could be automated.
  - The SRE Director commissions a toil reduction sprint.
  steps:
  - n: 1
    action: 'Conduct the quarterly toil survey: each SRE and PSE engineer records their top 5 most time-consuming repetitive
      tasks and the estimated weekly hours.'
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: Aggregate the survey results. Calculate total toil hours per week for the team.
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: 'Categorise toil by type: Alert Triage Toil, Incident Response Toil, Deployment Toil, Reporting Toil, or Maintenance
      Toil.'
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: 'Prioritise toil items using the formula: (weekly hours × frequency per year) ÷ estimated automation effort in
      days.'
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: 'For the top 3 toil items: raise Reliability Improvement Stories in the SRE backlog. Assign owners and target
      delivery quarters.'
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: 'Design the automation or process simplification. For alert toil: improve alert quality (SRE-PB-03). For incident
      response toil: improve runbooks (SRE-PB-08) or implement auto-remediation (SRE-PB-11).'
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: Build and test the automation per SRE-PB-11 (if the toil reduction involves production automation).
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: 'Deploy and measure: track the actual hours saved per week after automation.'
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: 'Report toil reduction progress quarterly: before/after hours, automation deployed, and remaining toil backlog.'
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: 'Aim for the SRE team to spend no more than 50% of on-call time on toil. If toil exceeds 50%: escalate to the
      SRE Director and engineering manager as a capacity risk.'
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Toil item requires automation that touches production systems
    - Follow SRE-PB-11 for reliability automation safety. Do not implement production automation outside of that process.
  - - Toil reduction is blocked by a process outside SRE control
    - Raise the cross-team dependency to the SRE Director. Frame as a reliability capacity risk.
  - - Engineering capacity cannot be allocated for toil reduction
    - Present the toil cost in engineering hours per year to the engineering manager. Toil reduction is not optional — it
      is a precondition for sustainable SRE.
  validation:
  - Quarterly toil survey is completed and results are documented.
  - At least one toil reduction automation is delivered per quarter.
  - On-call toil hours decrease quarter-over-quarter.
  - No SRE engineer spends more than 50% of on-call hours on toil.
  - Toil reduction outcomes are reported in the SRE quarterly reliability report.
  source_file: SRE-PB-12 — Reliability Toil Reduction Playbook.docx
  version: V1
- id: SRE-PB-13
  title: Post-Deployment Reliability Validation Playbook
  objective: Ensure every production deployment is followed by a documented reliability validation covering SLO performance,
    error rate, latency, and dependency health for a minimum of 60 minutes post-deployment.
  triggers:
  - A production deployment is completed per ITSM-PB-05.
  - An emergency change is deployed during a P1 incident.
  - A configuration change is applied that affects application behaviour.
  - An SRE assessment identifies a recent deployment without validation evidence.
  steps:
  - n: 1
    action: 'Immediately after deployment: execute the smoke test from the deployment runbook. Record pass or fail for each
      smoke test step.'
    expected: ''
    owner: ''
    phase: ''
  - n: 2
    action: Open the Splunk application health dashboard. Compare the current error rate against the pre-deployment baseline.
    expected: ''
    owner: ''
    phase: ''
  - n: 3
    action: Open AppDynamics APM. Check the transaction response times for the 10 minutes immediately post-deployment.
    expected: ''
    owner: ''
    phase: ''
  - n: 4
    action: 'Confirm the four golden signals are within normal bounds: error rate < SLO threshold, P99 latency < SLO target,
      transaction throughput within expected range, saturation metrics (thread pool, connection pool) within capacity.'
    expected: ''
    owner: ''
    phase: ''
  - n: 5
    action: 'Check dependency call success rates: confirm that all upstream and downstream dependencies are responding normally.'
    expected: ''
    owner: ''
    phase: ''
  - n: 6
    action: 'At T+15 minutes: post a status update in the Teams SRE channel: ‘[Application] deployment complete. Error rate:
      [x]%. Latency P99: [x]ms. Status: NOMINAL / WATCH / ISSUE.’'
    expected: ''
    owner: ''
    phase: ''
  - n: 7
    action: Monitor for 60 minutes from deployment completion. Check Splunk and AppDynamics every 15 minutes.
    expected: ''
    owner: ''
    phase: ''
  - n: 8
    action: 'At T+60 minutes: if all metrics are nominal, declare the deployment validated. Post the validation completion
      in the Teams channel.'
    expected: ''
    owner: ''
    phase: ''
  - n: 9
    action: 'Document the validation in the Change record’s Post-Implementation Review section: smoke test result, error rate
      comparison, latency comparison, and the 60-minute observation notes.'
    expected: ''
    owner: ''
    phase: ''
  - n: 10
    action: 'If any metric degrades beyond the SLO threshold at any point during the 60-minute window: invoke the rollback
      plan (ITSM-PB-05). Raise a P2 incident.'
    expected: ''
    owner: ''
    phase: ''
  - n: 11
    action: Close the Change record with the validation evidence attached.
    expected: ''
    owner: ''
    phase: ''
  decisions:
  - - Error rate increases above SLO threshold within 60 minutes
    - Invoke rollback immediately per ITSM-PB-05. Raise a P2 incident. Do not wait for the 60-minute window to expire.
  - - Metrics are elevated but below the SLO threshold
    - Extend the monitoring window to 120 minutes. Notify the SRE Lead. Do not close the Change record until metrics return
      to normal.
  - - Splunk or AppDynamics is unavailable post-deployment
    - Do not declare the deployment validated without observability data. Raise an infrastructure task. Extend the monitoring
      window until observability is restored.
  validation:
  - Smoke test is completed and all steps pass.
  - 60-minute monitoring window is completed with no SLO breach.
  - Four golden signals are within normal bounds at T+60.
  - Change record PIR section documents the validation evidence.
  - Teams SRE channel post-deployment status messages are present.
  - Change record is Closed with validation evidence attached.
  source_file: SRE-PB-13 — Post-Deployment Reliability Validation Playbook.docx
  version: V1
