<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#333"/>
    </marker>
    <marker id="arrd" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#222">FSIC COG v2 on CAP (Kubernetes): deployment view</text>
  <text x="30" y="54" fill="#666">Solid = confirmed from the repository. Dashed grey = platform detail not recorded in the repo [confirm with CAP docs].</text>

  <!-- Build and publish row -->
  <rect x="30" y="80" width="200" height="80" rx="8" fill="#eef3fb" stroke="#4a6fa5"/>
  <text x="130" y="108" text-anchor="middle" font-weight="bold">GitHub</text>
  <text x="130" y="127" text-anchor="middle">cvs-health-source-code/</text>
  <text x="130" y="144" text-anchor="middle">fsic-cog (push)</text>

  <rect x="290" y="80" width="250" height="80" rx="8" fill="#eef3fb" stroke="#4a6fa5"/>
  <text x="415" y="104" text-anchor="middle" font-weight="bold">GitHub Actions: ci.yml</text>
  <text x="415" y="123" text-anchor="middle">shared python_docker.yaml</text>
  <text x="415" y="140" text-anchor="middle">SCA, docker build, publish</text>

  <rect x="600" y="80" width="270" height="80" rx="8" fill="#fff4e0" stroke="#d98a00"/>
  <text x="735" y="104" text-anchor="middle" font-weight="bold">JFrog Artifactory (cvsh.jfrog.io)</text>
  <text x="735" y="123" text-anchor="middle">cvsdigital-docker: images</text>
  <text x="735" y="140" text-anchor="middle">cvsdigital-pypi / -npm: packages</text>

  <line x1="230" y1="120" x2="290" y2="120" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="540" y1="120" x2="600" y2="120" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="570" y="112" text-anchor="middle" font-size="11" fill="#555">push image</text>

  <!-- Image tag note -->
  <text x="735" y="182" text-anchor="middle" font-size="12" fill="#555">image tag: fsic-cog-v2-&lt;run_number&gt;</text>

  <!-- CAP platform boundary -->
  <rect x="30" y="215" width="760" height="500" rx="12" fill="#f7f9fc" stroke="#2f4f7f" stroke-width="2"/>
  <text x="48" y="240" font-size="15" font-weight="bold" fill="#2f4f7f">CAP: Kubernetes Application Platform</text>

  <!-- Namespace -->
  <rect x="55" y="260" width="710" height="430" rx="10" fill="#ffffff" stroke="#7a8fb3" stroke-dasharray="6,4"/>
  <text x="70" y="282" font-weight="bold" fill="#555">Application namespace [confirm name / environment]</text>

  <!-- Ingress / Service (unconfirmed) -->
  <rect x="85" y="305" width="190" height="60" rx="8" fill="#f2f2f2" stroke="#999" stroke-dasharray="5,4"/>
  <text x="180" y="331" text-anchor="middle" fill="#666">Ingress / Service</text>
  <text x="180" y="349" text-anchor="middle" font-size="11" fill="#888">[confirm CAP routing]</text>

  <!-- Pod -->
  <rect x="320" y="300" width="420" height="260" rx="10" fill="#eaf6ee" stroke="#2e8b57" stroke-width="2"/>
  <text x="530" y="324" text-anchor="middle" font-weight="bold" fill="#1f6b41">Pod (shared network namespace: localhost)</text>

  <!-- App container -->
  <rect x="340" y="340" width="380" height="130" rx="8" fill="#ffffff" stroke="#2e8b57"/>
  <text x="530" y="362" text-anchor="middle" font-weight="bold">Container: fsic-cog (distroless python, UID 31337)</text>
  <text x="530" y="383" text-anchor="middle" font-size="12">service.py: single process, port 8080</text>
  <text x="530" y="402" text-anchor="middle" font-size="12">FastAPI + uvicorn: React UI, /api/*, /healthz</text>
  <text x="530" y="421" text-anchor="middle" font-size="12">Scheduler: review 04:00/18:00, snapshot 03:00,</text>
  <text x="530" y="438" text-anchor="middle" font-size="12">cluster 07:00, tag backfill 11:00 (UTC)</text>
  <text x="530" y="457" text-anchor="middle" font-size="12">Baked in: /app/data, /app/config, ui/dist</text>

  <!-- Sidecar -->
  <rect x="340" y="485" width="380" height="60" rx="8" fill="#ffffff" stroke="#2e8b57"/>
  <text x="530" y="508" text-anchor="middle" font-weight="bold">Sidecar: cloud-sql-proxy</text>
  <text x="530" y="527" text-anchor="middle" font-size="12">listens on localhost; IAM login (no password)</text>

  <!-- app -> sidecar -->
  <line x1="530" y1="470" x2="530" y2="485" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Ingress to pod -->
  <line x1="275" y1="335" x2="340" y2="380" stroke="#999" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrd)"/>
  <text x="285" y="352" font-size="11" fill="#888">:8080</text>

  <!-- Injected config box -->
  <rect x="85" y="410" width="205" height="130" rx="8" fill="#fffbe6" stroke="#c9a400"/>
  <text x="187" y="432" text-anchor="middle" font-weight="bold">Injected / runtime config</text>
  <text x="187" y="453" text-anchor="middle" font-size="11.5">CAP_POSTGRES_&lt;APP&gt;_&lt;DB&gt;_JDBC_URI</text>
  <text x="187" y="470" text-anchor="middle" font-size="11.5">CAP_POSTGRES_USER</text>
  <text x="187" y="490" text-anchor="middle" font-size="11.5">ANTHROPIC_API_KEY</text>
  <text x="187" y="506" text-anchor="middle" font-size="10.5" fill="#666">(approved secret store, not in image)</text>
  <text x="187" y="526" text-anchor="middle" font-size="11.5">COG_* schedule settings</text>
  <line x1="290" y1="450" x2="340" y2="420" stroke="#c9a400" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Namespace footer notes -->
  <text x="70" y="620" font-size="12" fill="#555">Image pulled from JFrog by tag; node pulls need JFrog access [confirm mechanism].</text>
  <text x="70" y="640" font-size="12" fill="#555">Replica count, resources, probes: [confirm]. Probe target would be GET /healthz on 8080.</text>
  <text x="70" y="660" font-size="12" fill="#555">No login on the UI yet: keep to the CAP dev environment.</text>

  <!-- JFrog -> CAP -->
  <path d="M735,160 L735,200 L735,215" stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="745" y="205" font-size="11" fill="#555">image pull</text>

  <!-- Right column: external -->
  <!-- Users -->
  <rect x="860" y="300" width="300" height="60" rx="8" fill="#f4f0fa" stroke="#7b5ea7"/>
  <text x="1010" y="326" text-anchor="middle" font-weight="bold">Reviewers / operators</text>
  <text x="1010" y="345" text-anchor="middle" font-size="12">browser: UI and report.xlsx downloads</text>
  <path d="M860,330 L832,330 L832,288 L180,288 L180,305" stroke="#999" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrd)"/>

  <!-- Database -->
  <rect x="860" y="470" width="300" height="140" rx="8" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="1010" y="496" text-anchor="middle" font-weight="bold">CAP-provisioned PostgreSQL (Cloud SQL)</text>
  <text x="1010" y="516" text-anchor="middle" font-size="12">one database for reviews, clusters and snapshot</text>
  <text x="1010" y="540" text-anchor="middle" font-size="11.5">cog_run, cog_incident_result, cog_tag_prediction</text>
  <text x="1010" y="557" text-anchor="middle" font-size="11.5">cog_cluster_run, cog_cluster, cog_cluster_incident</text>
  <text x="1010" y="573" text-anchor="middle" font-size="11.5">cog_snapshot_load, cog_incident_snapshot</text>
  <text x="1010" y="595" text-anchor="middle" font-size="10.5" fill="#666">tables created on first use (schema.sql)</text>

  <path d="M720,515 L860,540" stroke="#333" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="790" y="513" text-anchor="middle" font-size="11" fill="#333">TLS, IAM auth</text>

  <!-- LMS gateway -->
  <rect x="860" y="130" width="300" height="130" rx="8" fill="#fdeeee" stroke="#b34040"/>
  <text x="1010" y="154" text-anchor="middle" font-weight="bold">LMS gateway (HTTPS 443)</text>
  <text x="1010" y="173" text-anchor="middle" font-size="12">hyperion-lms-api.prod.cvshealth.com</text>
  <text x="1010" y="196" text-anchor="middle" font-size="12">-&gt; AWS Bedrock -&gt; Anthropic Claude</text>
  <text x="1010" y="219" text-anchor="middle" font-size="11" fill="#666">ANTHROPIC_BASE_URL set in the image;</text>
  <text x="1010" y="235" text-anchor="middle" font-size="11" fill="#666">key supplied at runtime</text>
  <path d="M720,372 L805,372 L805,215 L860,215" stroke="#333" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="816" y="300" font-size="11" fill="#333" text-anchor="middle" transform="rotate(-90 816 300)">outbound only: AI checks</text>

  <!-- Legend -->
  <rect x="860" y="640" width="300" height="75" rx="6" fill="#fafafa" stroke="#ccc"/>
  <text x="875" y="662" font-weight="bold" font-size="12">Legend</text>
  <line x1="875" y1="676" x2="915" y2="676" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="925" y="680" font-size="12">confirmed from repo</text>
  <line x1="875" y1="696" x2="915" y2="696" stroke="#999" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrd)"/>
  <text x="925" y="700" font-size="12">platform detail, to confirm</text>

  <text x="30" y="740" font-size="11" fill="#888">Sources: Dockerfile, service.py, cog/config.py, cog/web.py, CLAUDE.md, .github/workflows/ci.yml</text>
</svg>
