# Known threshold conflicts between templates and the rubric / Evidence Catalog.
# The template's threshold decides the template criterion; the rubric's decides the rating.
conflicts:
  - templates: [ SRE-AT-01, SRE-AT-07 ]
    criteria: [ SRE-AT-01-C05, SRE-AT-07-C03 ]
    rubric: P1-04
    text: "Runbook review period: SRE-AT-01-C05 and SRE-AT-07-C03 require review within 6 months; rubric P1-04 / Evidence Catalog use 12 months. Template criteria are evaluated at 6 months, the rubric rating at 12."
  - templates: [ CMDB-AT-04 ]
    criteria: [ CMDB-AT-04-C02 ]
    rubric: P2-10
    text: "CMDB completeness: V2 TH-01 requires 95/90/85% by tier; the rubric rule (Evidence Catalog) uses 95/85/75%. CMDB-AT-04-C02 is evaluated at TH-01 and, because it feeds P2-10, decides the P2-10 result when CMDB-AT-04 is assessed. The V2 change summary recommends the rubric adopt TH-01 (pending OD-2)."
  - templates: [ CMDB-AT-06 ]
    criteria: [ CMDB-AT-06-C06 ]
    rubric: P2-01
    text: "Dependency map currency: V2 TH-07 requires validation within 6 months (Tier 1) / 12 months (Tier 2); the rubric rule uses 12 months for every tier. CMDB-AT-06-C06 is evaluated at TH-07 and feeds P2-01 (pending OD-2)."
  - templates: [ CMDB-AT-01 ]
    criteria: [ CMDB-AT-01-C06 ]
    rubric: P2-10
    text: "Incident attribution: V2 TH-03 requires 90/85/80% of resolved incidents attributed to the Business Application by tier, counting the Business Application field (not the CI field alone); config/detectors.yaml ci_linkage_min_pct (90%) is now only the fallback."
