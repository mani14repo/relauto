# Crosswalk: template criteria  <->  rubric P1/P2 criteria  <->  standards  <->  remediation playbooks.
#
# The V1 SRE and ITSM templates do not say which rubric criterion each of their criteria feeds; this file
# does, curated by hand (status: DRAFT, pending SRE Standards Owner review).
# The V2 CMDB/CSDM templates (variant C) state their own rubric links, standards and playbooks, so CMDB
# criteria are not listed here: src/sra/crosswalk.py reads them from the compiled catalog.
#
# Resolution order for a template criterion's playbooks/standards:
#   templates.<ID>.criteria.<Cnn>  ->  templates.<ID>  ->  rubric.<P-id> (if mapped)
# Duplicate playbooks in V1 (SRE-PB-11/14, SRE-PB-13/15): the lower number is referenced.
version: "2026-11-draft"

rubric:
  P1-01: { standards: [ CMDB-STD-02 ], playbooks: [ CMDB-PB-04, CMDB-PB-03 ], criteria: [ SRE-AT-01-C06, SRE-AT-08-C01 ] }
