  P1-07: { standards: [ ITSM-STD-04 ], playbooks: [ ITSM-PB-05 ], criteria: [ SRE-AT-01-C04, ITSM-AT-01-C01, ITSM-AT-01-C03, SRE-AT-12-C03 ] }
