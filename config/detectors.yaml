# Detector thresholds. Values tagged CONFIRM come from Evidence Catalog [CONFIRM] placeholders
# and must be checked against the actual ServiceNow instance (CVS Field Confirmation Tracker).
servicenow:
  app_table: cmdb_ci                 # CONFIRM: or u_business_application (CSDM)
  owner_field: owned_by              # CONFIRM
  support_group_field: support_group # CONFIRM
  slo_table: u_slo_definition        # CONFIRM: custom table or external SLO tool
rubric_rules:
  incident_window_days: 90           # P1-02, P2-02
  alert_window_days: 30              # P1-03
  runbook_max_age_months: 12         # P1-04 (SRE-AT-01-C05 says 6 - conflict is flagged)
  slo_measurement_max_age_days: 7    # P1-05
  change_window_days: 90             # P1-07 (falls back to 365)
  change_fallback_days: 365
  architecture_doc_max_age_months: 18  # P1-08
  min_failure_scenarios: 2           # P1-08
  dependency_review_max_age_months: 12 # P2-01
  recurrence_min_incidents: 3        # P2-02
  error_budget_review_max_age_days: 30 # P2-03
  perf_test_max_age_days: 90         # P2-05
  capacity_plan_max_age_months: 6    # P2-06
  post_deploy_keywords: [slo, smoke test, health check, validated, post-deployment validation]
  # P2-10, as the rubric lists them (application CI and its direct child CIs); the last two are [CONFIRM] in the rubric.
  # A list inside the list means alternative column names. Columns missing from the export are reported, not counted.
  required_ci_fields: [name, sys_class_name, operational_status, support_group, owned_by, environment,
                       [u_service_tier, busines_criticality, business_criticality], u_application_id]
  # CMDB-AT-04-C02 / CMDB-AT-11-C04 (TH-01): CMDB-STD-00 required fields for a Business Application (names pending OD-1)
  th01_required_fields: [name, number, it_application_owner, owned_by, support_group, [busines_criticality, business_criticality],
                         [life_cycle_stage, life_cycle_stage_status, install_status], u_region, u_portfolio]
anomalies:
  spike_window_weeks: 12
  spike_mad_threshold: 3.5           # robust z-score
  min_weekly_incidents: 5
  false_positive_share_max: 0.30
  monitoring_share_info: 0.50
  mttr_outlier_factor: 3.0           # x median
  change_induced_window_hours: 24
  ci_linkage_min_pct: 90
incident_clusters:                   # recurring incidents grouped by meaning (advisory; never sets a result)
  enabled: true
  method: auto                       # auto (embeddings, else TF-IDF) | embedding | tfidf
  similarity:                        # cosine similarity to the cluster representative (app name removed first)
    embedding: 0.72                  # tuned on a small hand-made set; raise it if clusters mix unrelated issues
    tfidf: 0.35
  margin_over_typical: 0.12          # and at least this much above the app's median similarity between incidents
  min_size: 3                        # same as rubric_rules.recurrence_min_incidents
  min_descriptions: 3                # one wording is the exact-match rule's job; two are usually two routine issues
  text_fields: [short_description, description]
  max_incidents: 3000                # newest incidents in the window
  max_findings: 5
criteria_rules:                      # template criteria settled from data already ingested (sra.detectors.criteria_rules)
  # CMDB-AT-01-C03 / CMDB-STD-02 R06-R07: the four placement attributes. Each entry lists alternative column names
  # (first found wins); real names pending OD-1. busines_criticality is ServiceNow's own (misspelt) field.
  placement_fields:
    region: [u_region]
    portfolio: [u_portfolio]
    tier: [busines_criticality, business_criticality]
    life cycle: [life_cycle_stage, life_cycle_stage_status, install_status]
  # CMDB-AT-07-C03 / CMDB-AT-12-C04: keys proposed in CMDB-PB-10 step 11 (pending OD-4)
  required_labels: [app.kubernetes.io/name, app.kubernetes.io/part-of, fsi-reo/app-service, fsi-reo/business-app, fsi-reo/env, fsi-reo/support-group]
  # CMDB-AT-12-C04 (CMDB-STD-12 R04): the five things every production workload must carry; each may come from a label or
  # an OTEL_RESOURCE_ATTRIBUTES key (keys proposed, pending OD-4)
  workload_metadata_keys:
    service name: [service.name, app.kubernetes.io/name]
    environment: [deployment.environment.name, deployment.environment, fsi-reo/env]
    application service key: [fsi-reo/app-service]
    business application key: [fsi-reo/business-app]
    owner: [fsi-reo/support-group]
  # CMDB-AT-10-C04: lowest acceptable priority per tier and impact, from CMDB-STD-10 R06 / tier table
  incident_priority_by_tier:
    1: { outage: 1, degradation: 2 }
    2: { outage: 2, degradation: 3 }
    3: { outage: 3, degradation: 4 }
  # Impact read from the description (the template leaves the final classification to a person). An outage word with
  # one of these limiting words is a degradation; these are regular expressions, whole words, any case.
  outage_limiting_words: ['briefly', 'brief', 'momentar(il)?y', 'partial(ly)?', 'intermittent(ly)?', 'degraded', 'degradation',
                          'slow(ness)?', 'some users', 'some customers', 'some requests', 'a few', 'single user', 'one user']
  # Words that make an incident a degradation on their own (a slower or partly failing service). "Intermittent" and
  # "partial" only qualify an outage word, so they are limiting words above, not here.
  degradation_words: ['slow(ness)?', 'latency', 'degraded', 'degradation', 'timeouts?', 'timing out', 'timed out',
                      'error rate', 'delay(ed|s)?']
  # CMDB-AT-12-C05 (CMDB-STD-12 R08): alerts bound to one of these are bound to a tool, not the service
  monitoring_tool_cis: [splunk, appdynamics, dynatrace, datadog, new relic, prometheus, grafana, moogsoft, bigpanda, scom,
                        solarwinds, nagios, zabbix, pagerduty, opsgenie, elastic]
  pse_groups: []                     # ITSM-AT-04-C01: PSE assignment groups; empty counts every incident
  kb_owner_fields: [u_review_owner, ownership_group, kb_owner, author]   # ITSM-AT-07-C02; CONFIRM
  hpa_cpu_target_pct: 70             # SRE-AT-06-C05
  reporting_fields: [cmdb_ci, assignment_group, priority, close_code, resolved_at]   # ITSM-AT-11-C02, as the template lists them
  audit_fields:                      # ITSM-AT-09-C03 completeness standard per record type; CONFIRM
    change_request: [short_description, cmdb_ci, start_date, end_date, backout_plan, test_plan, close_code]
    problem: [short_description, state, cmdb_ci]
    incident: [short_description, category, priority, assignment_group, opened_at, resolved_at, close_code, close_notes]
data_rules:                          # rules on service-model / discovery / audit / SLA / catalog tables and registers
  fields: {}                         # override ServiceNow field names, e.g. {service_tier: business_criticality,
                                     # tier_approved_by: u_tier_approver}; defaults and CONFIRM list: data_rules.FIELDS
vulnerabilities:
  report_min_severity: Low           # every scanner finding at or above this becomes a finding
  block_severities: [Critical, High] # mapped onto SRE-AT-11 Gap
  eol_products:                      # product -> EOL date (ISO); extend from CMDB-AT-09 register
    jenkins: "2026-10-31"
    python 3.8: "2024-10-07"
    python 3.9: "2025-10-31"
    node 18: "2025-04-30"
    java 8: "2026-12-31"
    centos 7: "2024-06-30"
    rhel 7: "2024-06-30"
config_checks:
  min_replicas: 2
code_signals:                        # source code from a GitHub repository scan (pattern-based; results ask for review)
  report_min_severity: Low           # lowest severity that becomes a finding
  max_refs: 10                       # locations kept as evidence references per finding
  print_logging_min: 20              # print/console statements (with no structured logger) that make SRE-AT-03-C01 a Gap
