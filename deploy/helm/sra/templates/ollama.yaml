{{- if .Values.ollama.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-ollama
  labels:
    {{- include "sra.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm
spec:
  serviceName: {{ .Release.Name }}-ollama
  replicas: {{ .Values.ollama.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: sra, app.kubernetes.io/component: llm}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sra, app.kubernetes.io/component: llm}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.ollama.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ollama.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: load-model
          image: {{ .Values.ollama.gcloudImage }}
          command: ["sh", "-c", "gcloud storage rsync -r {{ .Values.ollama.modelMirror }} /models"]
          volumeMounts: [{name: models, mountPath: /models}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          env:
            - {name: OLLAMA_MODELS, value: /models}
            - {name: OLLAMA_KEEP_ALIVE, value: "24h"}
            - {name: OLLAMA_NUM_PARALLEL, value: "1"}
          ports: [{name: http, containerPort: 11434}]
          readinessProbe: {httpGet: {path: /api/tags, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/tags, port: http}, periodSeconds: 30, failureThreshold: 5}
          resources: {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts: [{name: models, mountPath: /models}]
  volumeClaimTemplates:
    - metadata: {name: models}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.ollama.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ollama
spec:
  selector: {app.kubernetes.io/name: sra, app.kubernetes.io/component: llm}
  ports: [{name: http, port: 11434, targetPort: http}]
---
# The LLM accepts traffic only from the API and worker pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-llm-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: llm}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions: [{key: app.kubernetes.io/component, operator: In, values: [api, worker]}]
      ports: [{port: 11434}]
{{- end }}
