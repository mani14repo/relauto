apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "sra.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: sra, app.kubernetes.io/component: worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sra, app.kubernetes.io/component: worker}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 31337, fsGroup: 31337, seccompProfile: {type: RuntimeDefault}}
      terminationGracePeriodSeconds: 120
      initContainers:
        {{- include "sra.proxy" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "sra.image" . }}
          args: ["worker"]
          env:
            {{- include "sra.env" . | nindent 12 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
