# Values for the CAP (GKE) namespace. Items marked [confirm] depend on CAP conventions.
image:
  repository: cvsh.jfrog.io/cvsdigital-docker/sra
  tag: sra-1                      # set by CI: sra-<run_number>
  pullPolicy: IfNotPresent
imagePullSecrets: [{name: jfrog-pull}]   # [confirm]

serviceAccount:
  name: sra
  gcpServiceAccount: sra@PROJECT_ID.iam.gserviceaccount.com   # Workload Identity: Cloud SQL client + GCS object admin

cloudSql:
  instance: PROJECT_ID:REGION:INSTANCE        # [confirm] CAP-provisioned Cloud SQL Postgres (pgvector enabled)
  database: sra
  user: sra@PROJECT_ID.iam                    # IAM database user, no password
  proxyImage: cvsh.jfrog.io/cvsdigital-docker/cloud-sql-proxy:2.14.1
  # true: do not set DATABASE_URL; use the CAP_POSTGRES_<APP>_<DB>_JDBC_URI and CAP_POSTGRES_USER that CAP injects for a
  # provisioned database (how COG is configured). Use this to share COG's database: the SRA tables are all prefixed
  # sra_ (COG's are cog_) and are created on first start. [confirm the injected variable names with CAP]
  useCapInjected: false
  capJdbcVar: ""                              # only when CAP injects more than one database: the variable to use

kafka:
  bootstrap: kafka-bootstrap.kafka.svc:9092   # [confirm]
  securityProtocol: ""                        # e.g. SASL_SSL
  saslMechanism: ""
  existingSecret: ""                          # keys: username, password
  group: sra-worker

gcs:
  bucket: sra-evidence-PROJECT_ID             # uploaded evidence + generated reports

# Checklist line suggestions use a small NLI model (cross-encoder/nli-deberta-v3-xsmall, ~96 MB ONNX). The pods run
# with HF_HUB_OFFLINE=1, so its files must be baked into the image's Hugging Face cache (or mounted with HF_HOME);
# without them suggestions are simply off. Mirror through JFrog/GCS like the other model weights.
# Hybrid retrieval (docs/Hybrid Retrieval Architecture Overview.png): keyword (tsvector) + vector (pgvector) + RRF runs in
# the database above. pgvector must be enabled once per database (CREATE EXTENSION vector); without it retrieval is
# keyword-only. The embedding model (BAAI/bge-small-en-v1.5, 384-d) and the optional reranker must be in the image's
# model cache, like the NLI model below.
retrieval:
  rerank: "off"                               # off | auto (use the local cross-encoder when its files are in the image)

# The standing knowledge store's sources. Uploads are ingested by the worker as they arrive. The schedule below runs
# the ingestion service as a CronJob to refresh the OIPReqs library (baked into the image) and to sync ServiceNow.
ingestion:
  schedule: ""                                # e.g. "*/30 * * * *"; empty = no CronJob (trigger with POST /api/knowledge/sync)
  standards: true
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}

servicenow:
  instanceUrl: ""                             # e.g. https://<instance>.service-now.com ; empty = connector off [confirm]
  existingSecret: ""                          # Kubernetes secret with the connector account's credentials
  tokenKey: ""                                # key holding an OAuth bearer token; empty = use userKey / passwordKey
  userKey: username
  passwordKey: password

llm:
  enabled: true                              # false: rules/checklists only, no chat; also set ollama.enabled=false to skip the server
  provider: ollama                           # ollama | openai_compat | anthropic (Claude through the LMS gateway; see gateway below)
  # Only for provider: anthropic. OFF unless you choose that provider. Evidence is then sent to the hosted model through
  # the gateway COG uses, so it needs the same approval. Also set ollama.enabled: false (the model below is not used).
  gateway:
    model: claude-opus-5-5                    # or the gateway's own name for the model
    baseUrl: ""                               # e.g. https://hyperion-lms-api.prod.cvshealth.com [confirm path with the LMS team]
    existingSecret: ""                        # Kubernetes secret holding the key (from the approved secret store)
    secretKey: ANTHROPIC_API_KEY
    concurrency: 4                            # criteria evaluated at the same time
    effort: medium                            # low | medium | high | xhigh | max; "" = do not send (if the gateway's model rejects it)
    structuredOutput: true                    # false if the gateway rejects output_config.format
  model: gemma4:26b                           # MoE, ~4B active params: CPU-friendly; confirm with eval/run_eval.py
  think: false                                # reasoning tokens are too slow on CPU
  timeoutSeconds: 600
  numCtx: 8192
  numPredict: 768                             # most tokens per reply

api:
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
  ingress:
    enabled: false                            # [confirm] CAP ingress + IAP; the UI has no login of its own
    host: sra.example.internal
    className: ""

worker:
  replicas: 1                                 # one LLM job at a time per worker; scale with Ollama replicas
  resources:
    requests: {cpu: 500m, memory: 1Gi}        # includes the local ONNX embedding model
    limits: {cpu: "2", memory: 2Gi}

ollama:
  enabled: true
  image: cvsh.jfrog.io/cvsdigital-docker/ollama:0.40.14   # needs >= the release that ships gemma4
  replicas: 1                                 # each replica is a separate CPU node's worth of throughput; the app spreads criteria across them
  numParallel: 1                              # OLLAMA_NUM_PARALLEL per replica (and LLM_CONCURRENCY); 2+ needs memory for 2+ KV caches
  nodeSelector: {}                            # e.g. {cloud.google.com/gke-nodepool: llm-cpu} (c3/n2 highmem)
  tolerations: []
  resources:
    requests: {cpu: "8", memory: 24Gi}        # gemma4:26b weights are 16-19 GB + KV cache
    limits: {cpu: "16", memory: 32Gi}
  storage: 30Gi
  # Model weights cannot be pulled from the internet: mirror an `ollama pull` models/ directory to GCS once;
  # the init container copies it into the PVC.
  modelMirror: gs://sra-models-PROJECT_ID/ollama/models
  gcloudImage: cvsh.jfrog.io/cvsdigital-docker/google-cloud-cli:slim
